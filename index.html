<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케이스·페르미 일람</title>
<style>:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #66666b; --line: #e2e2de;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --warn: #a35a00; --warn-soft: #fff2df;
  --excl: #8a8a8f; --excl-soft: #efefec; --sup: #1d7a4c; --sup-soft: #e3f4ea;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #a0a0a8; --line: #34343a;
    --accent: #8aa8ff; --accent-soft: #263152; --warn: #f0b562; --warn-soft: #3b2c16;
    --excl: #9a9aa2; --excl-soft: #2a2a2e; --sup: #6fd3a0; --sup-soft: #173527;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #a0a0a8; --line: #34343a;
  --accent: #8aa8ff; --accent-soft: #263152; --warn: #f0b562; --warn-soft: #3b2c16;
  --excl: #9a9aa2; --excl-soft: #2a2a2e; --sup: #6fd3a0; --sup-soft: #173527;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
button { font: inherit; color: inherit; }
.top { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
h1 { font-size: 17px; margin: 0; }
.source { margin: 0; color: var(--muted); font-size: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 8px; }
.search { flex: 1 1 280px; }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"] { background: var(--accent); color: #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.toggle { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1.05fr); gap: 12px; padding: 12px 16px; align-items: start; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.tree-pane, .detail-pane { position: sticky; top: var(--top-h, 110px); max-height: calc(100vh - var(--top-h, 110px) - 24px); overflow: auto; }
.tree-pane summary { padding: 8px 12px; font-weight: 600; cursor: pointer; list-style-position: inside; }
#tree { padding: 0 6px 8px; }
.tnode { display: flex; width: 100%; justify-content: space-between; gap: 8px; border: 0; background: transparent; text-align: left; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
.tnode:hover { background: var(--bg); }
.tnode[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tnode .n { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tnode.zero { color: var(--muted); }
.tarch > summary { list-style: none; display: flex; align-items: center; }
.tarch > summary::-webkit-details-marker { display: none; }
.tarch > summary .tw { width: 16px; color: var(--muted); flex: none; font-size: 10px; }
.tarch[open] > summary .tw { transform: rotate(90deg); }
.tarch > summary .tnode { font-weight: 600; }
.tsubs { padding-left: 16px; }

.list-head { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.link { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; }
.list { list-style: none; margin: 0; padding: 0; }
.item { border-bottom: 1px solid var(--line); }
.item button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 12px; cursor: pointer; }
.item button:hover { background: var(--bg); }
.item[aria-selected="true"] button { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.item .q { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.item .m { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 3px; font-size: 12px; color: var(--muted); }
.badge { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 11px; line-height: 18px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.b-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.b-excl { background: var(--excl-soft); color: var(--excl); border-color: transparent; }
.b-sup { background: var(--sup-soft); color: var(--sup); border-color: transparent; }
.b-mode { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.empty { padding: 24px 12px; color: var(--muted); text-align: center; }
.more { display: block; width: 100%; padding: 10px; border: 0; background: var(--bg); color: var(--accent); cursor: pointer; }

.detail-pane { padding: 12px 14px; }
.detail-pane h2 { font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 600; letter-spacing: .02em; }
.detail-pane section + section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.orig { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.orig-title { font-weight: 600; margin: 0 0 4px; }
.src { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
.memo { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; background: var(--bg); border-radius: 6px; padding: 8px 10px; margin: 6px 0 0; }
.hint-head { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.hint-head strong { font-size: 15px; }
.axis { margin: 4px 0 8px; }
.formula { background: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; }
.formula .fm { color: var(--muted); font-size: 12px; }
.formula .u { color: var(--muted); font-size: 11px; }
.formula .term + .term::before { content: "+ "; color: var(--muted); }
.formula .term { display: block; }
details.steps { margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; }
details.steps > summary { padding: 6px 10px; cursor: pointer; color: var(--accent); }
details.steps > div { padding: 0 12px 8px; }
.steps h3 { font-size: 12px; margin: 8px 0 2px; color: var(--muted); }
.steps ul { margin: 0; padding-left: 18px; }
.sups { list-style: none; padding: 0; margin: 0; }
.sups li { display: flex; gap: 6px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
.sups .badge { flex: none; }
.sup-link { text-align: left; line-height: 1.5; }
.sub-h { font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
.scope { margin: 0 0 8px; font-size: 13px; }
.alt { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.pit { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
details.ref > summary { color: var(--muted); }
.why { margin: 0 0 8px; font-size: 13px; }
.applies { margin: 6px 0 2px; font-size: 12px; color: var(--muted); }
.ref-label { margin: 6px 0 2px; font-size: 12px; color: var(--warn); }
.goalbox { background: var(--warn-soft); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; }
.goalbox .gl { margin: 0 0 4px; font-size: 13px; color: var(--warn); font-weight: 600; }
.goalbox .axis, .goalbox .why { margin: 2px 0; }
.branches { margin: 8px 0 0; padding-left: 20px; }
.branches li { margin-bottom: 6px; }
.branches .bl { font-size: 12px; color: var(--muted); }
.placeholder { color: var(--muted); }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 240px minmax(0, 1fr); }
  .detail-pane { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 720px) {
  .top { position: static; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .tree-pane, .detail-pane { position: static; max-height: none; }
  .tree-pane #tree { max-height: 50vh; overflow: auto; }
}
.premise { margin: 2px 0 6px; font-size: 13px; background: var(--bg); border-radius: 6px; padding: 6px 10px; }
.guide { margin: 4px 0 10px; }
.terms { margin: 0; }
.terms dt { font-weight: 600; margin-top: 6px; }
.terms dd { margin: 0 0 0 12px; font-size: 13px; }
.terms dd.ex, .levels .ex { color: var(--muted); font-size: 12px; }
.levels { list-style: none; margin: 0; padding: 0; }
.levels li { border-left: 1px solid var(--line); padding: 4px 0 4px 10px; margin-bottom: 6px; font-size: 13px; overflow-wrap: anywhere; }
.levels .calc { font-size: 12px; background: var(--bg); border-radius: 4px; padding: 2px 6px; margin: 2px 0; }
.levels .nx { font-size: 12px; }
.why-top { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; margin: 4px 0 10px; }
.guide .sub-h { margin-top: 14px; padding-top: 8px; border-top: 1px dashed var(--line); font-weight: 600; }
.guide .sub-h:first-child { margin-top: 4px; }
.levels .q { display: inline; }
.levels .bl { font-size: 12px; margin-top: 2px; }
.causal { margin: 0; padding-left: 20px; font-size: 13px; }
.causal li { margin-bottom: 3px; overflow-wrap: anywhere; }
.cands { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0 10px; }
.cand { border: 1px solid var(--line, #d0d7de); border-radius: 8px; padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; }
.cand.on { border-color: var(--accent); background: var(--accent-soft); }
.cand-h { margin: 0 0 4px; }
.cand .bl { margin: 2px 0; font-size: 12px; }
.cand .cue { color: var(--accent); }
.cand .pick { margin-top: 6px; font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--bg); color: var(--accent); cursor: pointer; }
.cand.on .pick { background: var(--accent); color: #fff; }
.choose ol { margin: 4px 0 0; padding-left: 20px; font-size: 13px; }
@media (max-width: 720px) { .cands { grid-template-columns: 1fr; } }

.plist { margin: 2px 0 0; padding-left: 18px; }
.plist li { margin: 1px 0; }
.cv { font-size: 13px; background: var(--bg); border-left: 1px solid var(--accent); padding: 6px 10px; margin: 6px 0 10px; }

/* ---- tabs, 프레임워크 학습, 참고 자료 (system-design §16.2) ---- */
.tabs { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; color: var(--text); }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.learn { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 12px; padding: 12px 16px; align-items: start; }
.learn[hidden], .refs[hidden], .layout[hidden], .controls[hidden] { display: none; }
.fam-list { position: sticky; top: var(--top-h, 110px); max-height: calc(100vh - var(--top-h, 110px) - 24px); overflow: auto; padding: 10px 12px; }
.fam-detail { position: sticky; top: var(--top-h, 110px); max-height: calc(100vh - var(--top-h, 110px) - 24px); overflow: auto; padding: 12px 16px; }
.fam-intro p { margin: 0 0 6px; font-size: 13px; }
.fams { list-style: none; margin: 8px 0 0; padding: 0; }
.fam { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font: inherit; color: var(--text); }
.fam:hover { background: var(--bg); }
.fam[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.fam-n { display: block; font-weight: 600; }
.fam-q { display: block; font-size: 13px; }
.fam-cue { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.fam-en { display: block; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.fw-links { border-left: 1px solid var(--accent); padding-left: 10px; }
.fam-title { font-size: 17px; margin: 4px 0 2px; }
.fam-title:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.back { font-size: 13px; }
.summary3 { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px 8px 28px; margin: 8px 0; font-size: 14px; }
.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
.cmp th, .cmp td { border-bottom: 1px solid var(--line); padding: 6px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.contrast { padding-left: 18px; font-size: 13px; }
.forms { list-style: none; padding: 0; margin: 4px 0; font-size: 13px; }
.forms li { margin-bottom: 6px; overflow-wrap: anywhere; }
.goalqs { display: grid; gap: 8px; margin: 8px 0; }
.gq { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.gq-h { margin: 0 0 4px; }
.tool { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; font-size: 13px; }
.tool summary { cursor: pointer; }
.example { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px; }
.ex-h { margin: 0 0 4px; font-weight: 600; overflow-wrap: anywhere; }
.tree { border-left: 1px solid var(--accent); padding-left: 10px; margin: 8px 0; }
.from-banner { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; }
.from-banner p { margin: 0 0 4px; }
.refs { padding: 12px 16px; }
.refs-pane { padding: 12px 16px; max-width: 900px; }
.ref { border-top: 1px solid var(--line); padding: 8px 0; }
.ref h3 { margin: 4px 0; font-size: 15px; }
.ref a { color: var(--accent); overflow-wrap: anywhere; }
.ref code { font-size: 12px; overflow-wrap: anywhere; }
@media (max-width: 1100px) {
  .learn { grid-template-columns: minmax(0, 1fr); }
  .fam-list, .fam-detail { position: static; max-height: none; overflow: visible; }
}
/* land below the sticky header when scrolled into view */
.fam-title, #detail, #famList { scroll-margin-top: var(--top-h, 110px); }
.tool-if { display: block; font-size: 12px; color: var(--muted); margin: 2px 0 0 14px; }
.threec { display: grid; gap: 6px; margin: 10px 0; }
details.tool { scroll-margin-top: var(--top-h, 110px); }

/* ---- 상재 6묶음 트리, 상재별 심화 (system-design §18) ---- */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: var(--accent-soft); color: var(--text); }
.tkind { margin: 8px 0 2px 8px; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.tid { color: var(--muted); font-size: 11px; font-weight: 400; }
.tnode-u { margin-top: 6px; border-top: 1px solid var(--line); border-radius: 0; padding-top: 6px; }
.empty p { margin: 0 0 8px; }
.deep { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; padding: 12px 16px; align-items: start; }
.deep[hidden] { display: none; }
.deep-nav { position: sticky; top: var(--top-h, 110px); max-height: calc(100vh - var(--top-h, 110px) - 24px); overflow: auto; padding: 10px 12px; }
.dg { padding: 8px 0 10px; border-bottom: 1px solid var(--line); }
.dg:last-child { border-bottom: 0; }
.dg-h { margin: 0 0 2px; font-size: 15px; }
.dg-c { margin: 0 0 6px; font-size: 12px; color: var(--muted); }
.dg-reps { list-style: none; margin: 0; padding: 0; }
.drep { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 8px; border-radius: 5px; cursor: pointer; font: inherit; color: var(--text); }
.drep:hover { background: var(--bg); }
.drep[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.dg-all { margin-top: 6px; font-size: 12px; }
.dg-all > summary { cursor: pointer; color: var(--accent); }
.dk-h { margin: 6px 0 2px; color: var(--muted); }
.dk ul { margin: 0; padding-left: 14px; }
.deep-body { padding: 20px 28px 32px; font-size: 16px; line-height: 1.7; }
.deep-body > * { max-width: 76ch; }
.dtitle { font-size: 24px; line-height: 1.35; margin: 4px 0 8px; scroll-margin-top: var(--top-h, 110px); }
.dtitle:focus { outline: none; }
.dtitle:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.deep-body h3 { font-size: 18px; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.crumb { margin: 0; font-size: 13px; color: var(--muted); }
.scope-l { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
.lead { margin: 0 0 10px; }
.deep-body .alt { font-size: 13px; }
.fq { padding-left: 22px; margin: 0; }
.fq li { margin-bottom: 4px; }
.lens-idx { background: var(--bg); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
.lens-idx ol { margin: 0; padding-left: 20px; }
.lens { margin-top: 20px; }
.lens h4 { font-size: 20px; line-height: 1.4; margin: 0 0 6px; }
.ldl { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.ldl dt { color: var(--muted); font-size: 13px; padding-top: 2px; }
.ldl dd { margin: 0; overflow-wrap: anywhere; }
.chain { padding-left: 22px; margin: 0; }
.chain li { margin-bottom: 6px; }
.trend { margin: 10px 0 14px; }
.trend p { margin: 0 0 6px; }
.deep-body details.src { margin: 6px 0 0; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
.deep-body details.src > summary { padding: 6px 10px; cursor: pointer; color: var(--accent); }
.deep-body details.src > :not(summary) { padding: 0 12px 10px; }
.deep-body details.src .ldl { grid-template-columns: 6.5em minmax(0, 1fr); }
.deep-body a { color: var(--accent); text-underline-offset: 2px; overflow-wrap: anywhere; }
.pdfl { margin: 8px 0 0; padding-left: 18px; }
.pdfl li { margin-bottom: 6px; }
.probs { list-style: none; padding: 0; margin: 0; }
.probs li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.probs .pq { margin: 0 0 4px; overflow-wrap: anywhere; }
.probs .bl { margin: 0 0 6px; font-size: 14px; }
.deep-body .pick, .empty .pick, .from-banner .pick { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); cursor: pointer; }
.deep-body .pick:hover, .empty .pick:hover, .from-banner .pick:hover { background: var(--accent-soft); }
.dov { margin-top: 8px; }
.dov-c { margin: 0 0 6px; }
.dov-reps { margin: 0; padding-left: 18px; }
.dov-reps li { margin-bottom: 4px; }
.dov-name { font-weight: 600; font-size: 16px; }
.dov-q { color: var(--muted); font-size: 14px; }
@media (max-width: 1100px) {
  .deep { grid-template-columns: minmax(0, 1fr); }
  .deep-nav { position: static; max-height: none; overflow: visible; }
  /* 한 열에서는 비교·상세 본문을 먼저, 전체 상재 목록은 그 뒤에 둔다. */
  .deep-body { order: -1; }
  .deep-body { padding: 16px; }
}
@media (max-width: 720px) {
  .ldl, .deep-body details.src .ldl { grid-template-columns: minmax(0, 1fr); }
  .ldl dt { padding-top: 6px; }
  .dtitle { font-size: 21px; }
  .lens h4 { font-size: 18px; }
}
.deep-body h3, .lens, .trend { scroll-margin-top: var(--top-h, 110px); }
.dtitle, .deep-body h3, .lens h4, .dg-h { text-wrap: balance; }
@media (max-width: 720px) { .deep-body h3, .lens, .trend { scroll-margin-top: 12px; } }
</style>
</head>
<body>
<header class="top">
  <div class="title-row">
    <h1>케이스·페르미 일람</h1>
    <p class="source" id="source"></p>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="화면"></nav>
  <div class="controls" id="controls">
    <label class="search">
      <span class="sr-only">검색</span>

/ 제도·조직","whyAxis":"조직 문제는 업무 절차를 바꿔도 사람이 쓸 이유를 느끼지 못하거나 평가 제도가 따라오지 않으면 정착하지 않을 수 있다. 업무·사람·제도로 나누면 무엇을 바꾸고 누구를 설득할지가 함께 정리된다.","sequential":false,"guide":{"terms":[{"term":"진짜 과제","means":"개선 목표(비용·시간·만족) 뒤에서 조직이 정말 겪는 문제","ex":["창구 대기 시간","직원 이직","잔업 증가"]},{"term":"업무","means":"일이 처리되는 흐름(단계·시간)","ex":["신청 접수","확인·결재","보고서 작성"]},{"term":"사람(의욕·능력)","means":"그 업무를 하는 사람이 새 방식을 쓸 이유를 느끼는지(의욕)와 할 수 있는지(능력)","ex":["새 시스템을 쓸 이유가 없음","교육·시간 부족"],"aka":["사람"]},{"term":"제도·조직","means":"평가·보상, 결재 권한, 부서 구조처럼 사람의 행동을 정하는 규칙","ex":["평가 항목","결재 단계","부서 간 역할"]}],"order":"개선 목표의 숫자만 보면 업무 절차만 고치게 될 수 있다. 진짜 과제를 정한 뒤 업무의 병목을 찾고, 그 변경을 사람이 받아들일 이유와 제도가 받쳐 주는지를 함께 본다.","levels":[{"by":"개선 목표 뒤의 문제가 업무 흐름·사람의 의욕과 능력·제도와 조직 중 어디서 생기는지 나눈다","ex":["업무: 단계별 처리 시간·대기","사람: 새 방식을 쓸 이유·스킬","제도·조직: 평가·결재 규칙"],"next":"업무량·단계별 처리 시간, 직원 조사, 평가 항목","q":"개선 목표 뒤의 문제는 업무·사람·제도 중 어디에서 생기나?","lv":"대"},{"by":"업무는 단계별 처리 시간으로, 사람은 쓸 이유와 스킬로, 제도는 평가·보상·결재 권한으로 나눈다","ex":["업무: 단계별 처리 시간·병목 단계","사람: 의욕(쓸 이유)·능력(스킬·시간)","제도: 평가·보상·결재 권한"],"next":"단계별 소요 시간, 대기 건수, 직원이 새 방식을 쓰지 않는 이유","calc":"업무량 × 1건 처리 시간 = 필요 인력 시간","q":"그 안에서 무엇이 처리를 늦추거나 변화를 막나?","lv":"중"},{"by":"결재 단계·수작업·평가 미연동 중 목표 지표를 가장 크게 움직이는 원인을 고른다","ex":["결재 단계가 많아 대기 발생","종이·수작업이 남음","평가가 새 방식과 연동되지 않아 쓰지 않음"],"next":"결재 단계 수, 디지털화율, 평가 항목과 실제 행동","q":"어느 원인을 고치면 목표 지표가 가장 크게 바뀌나?","lv":"소"}]},"logic":{"frame":[["결론","업무·사람·제도 중 어느 원인을 무엇으로 바꾸면 목표 지표가 나아지나?"],["원인을 고른 이유","다른 원인보다 목표 지표에 미치는 영향이 크다는 자료는?"],["사람이 따라오나","새 방식을 쓸 이유(의욕)와 할 수 있는 조건(능력)이 갖춰지나?"],["부작용","통제 약화나 다른 부서의 부담 증가가 생기나?"]]},"premise":"목표 시점과 정책 대상 범위, 정책 주체가 쓸 수 있는 권한·예산, 개선 목표 뒤의 진짜 과제(예: 대기 시간인가 직원 이직인가)와 대상 업무 범위","scenarios":{},"goalSplits":{"profit":{"split":"비용 항목별 크기 / 각 항목의 사용량·단가 / 대체·폐지 가능성","why":"내부 비용 절감은 큰 항목부터, 사용량과 단가 중 바꾸기 쉬운 쪽부터 손대야 효과가 크다. 셋으로 나누면 ‘무엇을 얼마나 줄일지’가 5분 안에 정리된다.","guide":{"terms":[{"term":"비용 항목","means":"조직이 쓰는 돈의 종류","ex":["인건비","외주비","시스템비","사무실비"]},{"term":"사용량·단가","means":"각 비용을 얼마나 쓰고 1단위에 얼마인지","ex":["외주 시간","시간당 단가"]},{"term":" :"찬반 문항은 떠오르는 장단점을 늘어놓으면 결론의 근거가 약해진다. 검토 계기를 짚고, 이해관계자별 편익·비용을 나눈 뒤, 가장 강한 반대 논거에 답하는 순서로 입장을 세운다.","levels":[{"by":"이 안이 나온 계기와 쟁점, 판단하는 입장(정부·기업·개인)으로 나눈다","ex":["계기: 사고·비용·기술 변화","쟁점: 무엇을 지키고 무엇을 잃나","입장: 누구의 시점"],"next":"정책 배경, 쟁점 정의","q":"이 안은 왜 지금 검토되고, 쟁점은 무엇인가?","lv":"대"},{"by":"이용자·사업자·정부·다른 집단별로 편익과 비용을 단기·장기로 나눈다","ex":["이용자","사업자","정부·지자체","영향을 받는 다른 집단"],"next":"집단별 편익·비용의 크기와 기간","q":"누구에게 어떤 편익과 비용이 생기나?","lv":"중"},{"by":"가장 강한 반대 논거, 결론이 바뀌지 않는 이유, 결론이 성립하는 조건으로 나눈다","ex":["가장 강한 반대 논거","그래도 결론이 바뀌지 않는 이유","조건부 도입"],"next":"반대 측 근거, 조건별 결과","q":"가장 강한 반대에 어떻게 답하고, 어떤 조건이면 찬성하나?","lv":"소"}]},"logic":{"frame":[["결론","찬성·반대·조건부 중 무엇이고, 누구의 입장인가?"],["검토 계기와 쟁점","왜 지금 이 안이 나왔고, 무엇을 지키고 무엇을 잃는 문제인가?"],["이해관계자별 근거","결론을 받치는 편익과, 손해를 보는 쪽은 누구인가?"],["가장 강한 반대에 대한 답","가장 강한 반대 논거는 무엇이고, 그래도 결론이 바뀌지 않는 이유는?"],["조건","어떤 조건(대상·시기·범위)에서 결론이 성립하나?"]]},"premise":"판단 목표(찬성·반대·조건부)와 판단하는 입장(정부·기업·개인), 이 안이 나온 계기","scenarios":{},"goalSplits":{},"branches":[{"name":"왜 지금 검토되나","diagnose":["이 안이 나온 계기와 그것이 해치는 것","면접에서 이 주제를 낸 쟁점"],"levers":["쟁점을 한 문장으로 정의"]},{"name":"이해관계자별 편익과 비용","diagnose":["누가 이익을 보고 누가 손해를 보나","단기·장기, 금전·비금전으로 나누기"],"levers":["손해 보는 쪽의 보완책"]},{"name":"반대 논거와 조건부 결론","diagnose":["가장 강한 반대 논거","어떤 조건이면 찬성(반대)인가"],"levers":["조건부 도입·시범 실시"]}],"premiseList":["판단 목표(찬성·반대·조건부)와 판단하는 입장(정부·기업·개인), 이 안이 나온 계기"],"candidates":null,"candNone":"찬반 문항은 승인된 찬반 틀로 바로 푼다"},{"id":"A15-5","name":"사회·산업 구조(전망·원인)","formula":null,"pitfalls":["한 가지 원인으로 설명하는 정적인 가설을 피한다","예측 기간과 대상 범위를 먼저 정한다"],"supplements":[{"id":"S-A15-5-1","kind":"case","text":"少子高齢化が進む中、10年後の日本の小売業はどう変わるか。","types":["future"],"fermi":null,"scope":null}],"goal":"future","firstAxis":"예측 목표(무엇이·언제까지 어떻게 변하나)와 대상 범위 확인 후 세 갈래로 나누기 → 거시 흐름 / 수요의 변화 / 산업 구조의 변화","whyAxis":"사회·산업의 변화는 한 가지 원인으로 설명하면 정적인 가설에 머문다. 거시 흐름·수요·산업 구조로 나눠 서로 엮으면 동적인 가설과 근거가 함께 선다(PDF p74).","sequential":false,"guide":{"terms":[{"term":"예측 목표","means":"무엇이·언제까지 어떻게 변하는지 답할지","ex":["10년 후 수요","산업 구조","사회의 모습"]},{"term":"거시 흐름","m 해외에서 성과를 낸 사람의 장면 / 묶음 후보 = 언어·이해·실행 / 주장 = 가장 중요한 것과 그 이유"},"630":{"kw":"企業価値","text":"정의 = 기업 가치를 무엇으로 보나(미래 현금흐름·성장·위험) / 드라이버 = 매출 성장·이익률·투자·자본 비용 / 검증 = 계산 문제로 어느 드라이버가 큰지 확인"},"338":{"kw":"サブスク","text":"사례 = 구독이 잘 되는 상품과 안 되는 상품 / 묶음 후보 = 사용 빈도·교체 주기·개인 맞춤 / 주장 = 구독에 맞는 商材의 조건"},"411":{"kw":"サブスクリプション","text":"사례 = 구독 상품과 판매 상품 / 묶음 후보 = 고객과 기업의 장단점 / 주장 = 장점이 큰 업종 조건과 도입 판단. 뒤의 도입 여부는 찬반 틀로"},"204":{"kw":"カフェ","text":"사례 = 잘 되는 카페와 문 닫은 카페 / 묶음 후보 = 입지·체류 가치·회전·원가 / 주장 = 경영에서 중요한 것 2~3개"},"542":{"kw":"書店","text":"사례 = 서점에 가는 이유(발견·체험·즉시) / 묶음 후보 = EC가 대신하는 것과 못 하는 것 / 주장 = 앞으로의 제공 가치"},"421":{"kw":"10万円","text":"목적 = 운동회 입상 상품 예산의 취지(아이들의 동기·공평성) / 후보 = 상품·학급 전체 경험·설비 / 기준 = 효과·공평성·학교 규칙"},"439":{"kw":"10万円","text":"목적 = 체육제를 통해 무엇을 이루려나 / 후보 = 용품·경험·기록 / 기준 = 참가 학생 전체에 미치는 효과·규칙"},"238":{"kw":"サークル","text":"목적 = 서클 돈으로 무엇을 벌어 어디에 쓰나 / 후보 = 판매·행사·서비스 / 기준 = 수익·위험·회원 부담"},"576":{"kw":"中古物件","text":"목적 = 구매자의 목표(주거 기간·자산) / 후보 = 중고·신축 / 기준 = 총비용(가격·수리·대출·세금)·자산 가치 변화·생활 편의를 같은 기간으로 비교"},"533":{"kw":"スポンサー","text":"목적 = 스폰서로 무엇을 얻으려나(인지·브랜드 이미지) / 후보 = 종목 / 기준 = 시청자 규모·브랜드와의 적합·비용"},"31":{"kw":"外国人観光客","text":"노릴 대상 = 국가·지역·방문 목적별 성장 여지 / 오지 않는 이유 후보 = 인지·항공편·비용·볼거리 / 수단 = 대상별 홍보와 체류 상품"},"115":{"kw":"外国人観光客","text":"노릴 대상 = 원문 ①처럼 국가·지역부터 고른다(규모·성장·거리) / 오지 않는 이유 후보 = 인지·항공편·비자·비용 / 수단 = 원문 ②의 대상별 시책"},"194":{"kw":"国内観光客","text":"노릴 대상 = 연령·동행자·거주지별 / 오지 않는 이유 후보 = 시간·비용·가고 싶은 곳이 없음 / 수단 = 휴가 분산·지역 상품"},"286":{"kw":"京都","text":"노릴 대상 = 아직 적은 국가·계절 / 오지 않는 이유 후보 = 혼잡·숙박 비용·다른 지역과의 비교 / 수단 = 분산 관광·체류형 상품"},"457":{"kw":"九州","text":"노릴 대상 = 가까운 아시아·직항 노선 / 오지 않는 이유 후보 = 인지·이동 수단 / 수단 = 노선과 규슈 내 여러 지역을 도는 여행 상품"},"491":{"kw":"外国人観光客","text":"노릴 대상 = 국가·목적별 / 오지 않는 이유 후보 = 인지·접근·비용·매력 / 수단 = 대상별 홍보와 체류 상품"},"570":{"kw":"欧州","text":"노릴 대상 = 유럽 국가별 방일 수요 / 오지 않는 이유 후보 = 거리·비용·체류 기간 / 수단 = 장기 체류 상품·문화 체험"},"607":{"kw":"訪日観光客","text":"노릴 대상 = 10% 증가에 기여가 큰 국가·층 / 오지 않는 이유 후보 = 인지·항공편·비용 / 수단 = 대상별 시책과 효과 추정"},"442":{"kw":"旅行支援","text":"노릴 대상 = 지원이 없으면 여행하지 않는 층 / 오지 않는 이유 후보 = 비용·시간·혼잡 / 수단 = 평일·비수기 분산, 지역 한정 지원"},"408":{"kw":"過疎地域","text":"노릴 대상 = 스페인 사례에서 온 방문객 층 / 온 이유 후보 = 싼 가격·현지 음식·모여 즐길 장소 / 일본 적용 = 지역 자원으로 같은 이유를 만들 수 있나"},"425":{"kw":"住人","text":"진짜 과제 = 인구가 줄어 무엇이 해쳐지나(서비스 유지·세수) / 늘리거나 붙잡을 층 = 이주 후보(가족·은퇴·원격 근무자) / 정주를 막는 조건 후보 = 일자리·주거·교육·의료"},"435":{"kw":"人口減少","text":"진짜 과제 = 인구 감소로 해쳐지는 것 / 늘리거나 붙잡을 층 = 전입·출산·유출 방지 중 어디 / 정주를 막는 조건 후보 = 일자리·주거·육아 환경"},"458":{"kw":"地方創生","text":"진짜 과제 = 지방창생으로 무엇을 늘리나(인구·소득·관계 인구) / 늘릴 층 = 이주자·기업 이전 / 정주를 막는 조건 후보 = 일자리·교통·정보. 원문의 기업 이전 흐름을 살리기"},"503":{"kw":"地方","text":"진짜 과제 = 어떤 지방의 무엇을 되살리나(인구·산업) / 늘리거나 붙잡을 층 = 젊은 층 / 정주를 막는 조건 후보 = 일자리·교통·젊은 층 유출"},"587":{"kw":"地方都市","text":"진짜 과제 = 통폐합 뒤 남는 거점의 기능 유지 / 모을 층 = 주변 주민·기업 / 정주를 막는 조건 후보 = 서비스 축소·교통"},"678":{"kw":"地方創生","text":"진짜 과제 = 무엇이 늘면 지방창생인가(인구·소득·관계 인구) / 늘릴 층 = 이주자·관계 인구 / 정주를 막는 조건 후보 = 일자리·교통·정보"},"586":{"kw":"ICT","text":"진짜 과제 = ICT로 무엇을 좋게 하려나(학습 효과·교원 업무 시간) / 구성 요소 = 학생·교원·학교 설비 / 병목 = 정량 효과를 낼 수 있는 한 곳(예: 채점 시간)"},"588":{"kw":"オンライン講義","text":"진짜 과제 = 「활성화」가 무엇인가(참여·만족·학습) / 구성 요소 = 학생의 참여 동기·교원의 수업 설계·수강 환경 / 병목 = 참여가 떨어지는 장면"},"509":{"kw":"エネルギー","text":"진짜 과제 = 관공서가 해결하려는 에너지 문제(공급 안정·가격·탈탄소) / 구성 요소 = 수요·공급·제도 / 병목 = 컨설팅이 도울 수 있는 범위"},"606":{"kw":"カーボンニュートラル","text":"진짜 과제 = 줄일 배출원(발전·산업·운송·가정) / 구성 요소 = 비용·기술·제도 / 병목 = 감축 여지가 크고 시책이 닿는 곳"},"549":{"kw":"商店街","text":"진짜 과제 = 상점가에 무엇이 부족한가(방문 이유·체류·구매) / 구성 요소 = 방문객·가게·자치단체 / 병목 = 방문 이유"},"569":{"kw":"ラッシュ","text":"진짜 과제 = 혼잡이 해치는 것(지연·안전·쾌적) / 구성 요소 = 수요(시간대 집중)·처리 능력(편성·간격)·운영(요금·근무 제도) / 병목 = 피크 집중"},"337":{"kw":"バッテリー","text":"목적 = 편의점이 배터리 사업으로 얻으려는 것 / 인수 외 선택지 = 자체·제휴(원문 메모와 같음) / 시너지·리스크 = 매장망 활용·충전 수요·인수가"},"407":{"kw":"ファミマ","text":"목적 = 완전 자회사화로 얻으려는 것 / 선택지 = 지분 유지·제휴 / 시너지·리스크 = 상사의 물류·데이터 활용, 인수 비용. 자료로 평가"},"614":{"kw":"アパレル","text":"시장 = 의류 시장의 성장·안정 / 지속력 = 대상 기업의 브랜드·점유 / 개입 여지 = 재고·원가·점포 효율. 그래프·계산으로 확인"},"615":{"kw":"アパレル","text":"시장 = 의류 시장의 성장·안정 / 지속력 = 대상 기업의 브랜드·점유 / 개입 여지 = 재고·원가·점포 효율. 그래프·계산으로 확인"},"618":{"kw":"おもちゃ","text":"시장 = 장난감 시장의 성장·안정 / 지속력 = 경쟁사 대비 매출 추이 / 개입 여지 = 원가·판로. 그래프에서 가설"},"656":{"kw":"おもちゃ","text":"시장 = 장난감 시장의 성장·안정 / 지속력 = 경쟁사 대비 매출 추이 / 개입 여지 = 원가·판로. 그래프에서 가설"},"627":{"kw":"ワインメーカー","text":"시장 = 와인 시장의 성장·안정 / 지속력 = 브랜드·포도밭 / 개입 여지 = 원가·판로. 표 계산으로 확인"},"55":{"kw":"買収","text":"인수 후 성장: 먼저 인수 목적(대학 연계·지역 회원 확대 등)을 확인하고, 아래 성장 틀(기존 고객·새 고객)로 시책을 낸다"},"167":{"kw":"買収","text":"인수 후 성장: 먼저 인수 목적(대학 연계·지역 회원 확대 등)을 확인하고, 아래 성장 틀(기존 고객·새 고객)로 시책을 낸다"},"420":{"kw":"値上げ","text":"원가 = 인건비·광열비·작품료 / 지불 의사 = 관객층별(학생·가족·애호가) / 경쟁 대안 = 스트리밍 서비스 → 인상 시 관객 감소와 손익을 비교"},"500":{"kw":"値上げ","text":"원가 = 원가 상승분 / 지불 의사 = 가격 인상과 용량 감소 중 고객이 덜 떠나는 쪽 / 경쟁 대안 = 경쟁 제품의 대응 → 두 안의 수요 변화와 이익을 비교"},"539":{"kw":"価格","text":"원가 = 제조·유통 비용 / 지불 의사 = 이 의자를 살 고객층이 낼 금액 / 경쟁 대안 = 비슷한 의자의 가격 → 가격별 판매량과 이익"},"432":{"kw":"環境事業","text":"전제 = 환경 사업의 범위와 수익 모델(설비·서비스·컨설팅)을 먼저 확인 / 성장 여지 = 기존 고객 확대와 새 고객·사업 / 원문의 이해관계자(행정·기업·주민)와의 관계"},"582":{"kw":"ふるさと納税","text":"전제 = 판매 주체(사업자·자치체)와 플랫폼을 먼저 확인 / 경쟁 대안 = 다른 자치체의 답례품 / 고객 선택 기준 = 품질·환원율·이야기·배송"},"667":{"kw":"カップル","text":"사업 목적 = 커플의 어떤 시간을 대상으로 하나 / 시장 매력 = 대상 커플 수·지출 / 고객 니즈 = 데이트·기념일·동거 준비 / 실현성 = 자원·경쟁"},"666":{"kw":"社会課題","text":"과제 = 자료에서 고른 사회 과제 / 가치 = 상사의 조달·물류·투자로 그 과제를 푸는 방식 / 수익·실현성 = 사업 규모와 파트너"},"274":{"kw":"映画館","text":"과제 후보 = 영화를 집에서 보는 사람이 극장에 가지 않는 이유(시간·가격·체험 차이) / 가치 = 극장만의 체험(음향·모임·이벤트) / 수익·실현성 = 입장료 외 식음·대관, 입지와 투자"},"360":{"kw":"オンライン教育","text":"과제 후보 = 혼자 공부를 이어 가기 어려움, 질문할 사람이 없음 / 가치 = 학습 관리·질의응답·동료 / 수익·실현성 = 월 구독·법인 연수, 강사 확보"},"385":{"kw":"習い事","text":"과제 후보 = 바쁜 사람·성인이 배울 시간이 없음, 아이 맡길 곳 / 가치 = 짧은 시간·온라인·보육 결합 / 수익·실현성 = 회비·체험 단가, 강사·장소"},"476":{"kw":"家電量販店","text":"과제 후보 = 구입 후 설치·수리·처분의 불편 / 가치 = 설치·보수·회수 서비스, 매장 상담 / 수익·실현성 = 서비스료·보증 구독, 기존 고객 기반"},"552":{"kw":"高齢者","text":"과제 후보 = 고령자의 장보기·이동·안부 확인 불편 / 가치 = 정기 배송·방문·견수 / 수익·실현성 = 월 구독(본인·가족 지불), 원문대로 효과를 숫자로"},"564":{"kw":"映画館","text":"과제 후보 = 평일 낮·비상영 시간의 빈 좌석과 공간 / 가치 = 대관·라이브 중계·교육 이용 / 수익·실현성 = 대관료·행사 수입, 기존 설비 활용"},"668":{"kw":"家電量販店","text":"과제 후보 = 가전을 산 뒤의 생활 과제(설치·에너지 관리·처분) / 가치 = 매장 고객과 설치 인력을 쓰는 서비스 / 수익·실현성 = 서비스료, 시너지(판매 증가)"},"669":{"kw":"美容院","text":"과제 후보 = 시술 중 대기 시간, 머리 이외의 미용 고민 / 가치 = 같은 고객에게 파는 서비스(네일·두피 케어·상품) / 수익·실현성 = 추가 단가, 공간·인력"},"670":{"kw":"宿泊施設","text":"과제 후보 = 숙박객의 체류 중·전후 불편(짐·식사·관광 안내), 객실 낮 시간 공실 / 가치 = 체험·짐 보관·낮 시간 객실 이용 / 수익·실현성 = 이용료, 기존 객실·인력"},"671":{"kw":"ショッピングモール","text":"과제 후보 = 방문객이 오래 머물 이유가 없음, 빈 공간 / 가치 = 체험·생활 서비스·공유 공간 / 수익·실현성 = 임대료·이용료, 테넌트 구성"},"672":{"kw":"シェアオフィス","text":"과제 후보 = 입주자의 업무 외 과제(채용·회계·교류) / 가치 = 입주자 대상 서비스 / 수익·실현성 = 서비스료·소개 수수료, 입주자 기반"},"674":{"kw":"カフェ","text":"과제 후보 = 작업·모임 장소 부족, 비피크 시간의 빈 좌석 / 가치 = 공간·원두·교실을 쓰는 서비스 / 수익·실현성 = 이용료·상품, 기존 점포"},"679":{"kw":"本屋","text":"과제 후보 = 책을 고를 기준이 없음, 서점에 갈 이유가 줄어듦 / 가치 = 큐레이션·모임·공간 / 수익·실현성 = 회비·행사 수입, 매장 공간"},"680":{"kw":"カーシェア","text":"과제 후보 = 차를 빌린 이용자의 이동 전후 과제(주차·충전·짐) / 가치 = 회원과 거점을 쓰는 서비스 / 수익·실현성 = 이용료, 거점·회원 데이터"},"681":{"kw":"牛丼","text":"과제 후보 = 빨리 먹고 싶은 사람의 식사 외 과제, 비피크 매장 / 가치 = 매장·조리 설비·식재 조달을 쓰는 서비스 / 수익·실현성 = 추가 매출, 운영 부담"},"682":{"kw":"睡眠","text":"과제 후보 = 잠들기 어려움·수면 질 저하·측정 수단 부재 / 가치 = 음료·기기·측정·상담 / 수익·실현성 = 상품 판매·구독, 근거(효과 검증)"},"354":{"kw":"賃貸","text":"과제 후보 = 이사·계약 수고, 짧은 기간만 살 곳 / 가치 = 가구 포함·짧은 계약·구독형 거주 / 수익·실현성 = 월 이용료, 물건 확보"},"356":{"kw":"人材紹介","text":"과제 후보 = 구직자와 기업의 적합도를 미리 알기 어려움 / 가치 = 체험 근무·평판 정보·장기 지원 / 수익·실현성 = 성공 보수·구독, 데이터"},"363":{"kw":"ショッピングモール","text":"과제 후보 = 교외 몰에 갈 이유 감소(EC) / 가치 = 체험·의료·교육 같은 생활 서비스 유치 / 수익·실현성 = 임대료와 방문 증가, 공간"},"473":{"kw":"航空","text":"과제 후보 = 여행객의 공항·탑승 전후 불편, 항공사 데이터 미활용 / 가치 = 예약·이동·체류를 잇는 서비스 / 수익·실현성 = 수수료·회원 서비스, 기술 투자"},"532":{"kw":"ドローン","text":"과제 후보 = 고객사가 사람 손으로 하는 점검·배송·촬영 / 가치 = 드론과 통신망 결합 서비스 / 수익·실현성 = 월 요금, 규제·운용 인력"},"543":{"kw":"オンライン会議","text":"과제 후보 = 기존 도구가 못 푸는 회의 불편(기록·번역·몰입) / 가치 = 그 불편만 푸는 기능 / 수익·실현성 = 구독, 경쟁 도구와의 전환 비용"},"578":{"kw":"カーシェア","text":"과제 후보 = 차를 사지 않는 사람의 이동 과제 / 가치 = 공유·구독·이동 서비스 / 수익·실현성 = 이용료, 자동차 회사의 차량·판매망"},"579":{"kw":"シェアリング","text":"과제 후보 = 가끔만 쓰는 비싼 물건·공간의 소유 부담 / 가치 = 공유로 싸게 쓰기 / 수익·실현성 = 이용료·수수료, 원문대로 정량(이용자 수×빈도×단가)"},"580":{"kw":"IOT","text":"과제 후보 = 원격으로 상태를 알 수 없어 생기는 손실(설비 고장·재고) / 가치 = 센서와 알림 / 수익·실현성 = 월 요금과 원가, 원문대로 수익성 계산"},"609":{"kw":"VR","text":"과제 후보 = 여행 전 고르기 어려움, 갈 수 없는 사람 / 가치 = 사전 체험·가상 관광 / 수익·실현성 = 예약 전환 수수료·콘텐츠 판매"},"673":{"kw":"すきま時間","text":"과제 후보 = 짧은 빈 시간을 쓸 마땅한 수단이 없음 / 가치 = 짧게 끝나는 학습·휴식·정리 / 수익·실현성 = 구독·광고, 경쟁 서비스(SNS·게임)"},"207":{"kw":"Eコマース","text":"새 이용자 후보 = 고령자·지방 / 빈도·장면 = 식품·일용품 정기 구매 / 1회 금액 = 묶음 구매. 업계 공통 장벽(배송·결제·반품)부터"},"208":{"kw":"アパレル","text":"새 이용자 후보 = 옷에 돈을 덜 쓰게 된 층 / 빈도·장면 = 출근·외출 감소 이후의 장면 / 1회 금액 = 기능성·지속 가능성 가치. 업계 전체 시책으로"},"329":{"kw":"腕時計","text":"새 이용자 후보 = 스마트폰으로 시계를 쓰지 않는 젊은 층 / 빈도·장면 = 여러 개를 장면별로 / 1회 금액 = 고급·수리·중고 순환"},"359":{"kw":"漫画喫茶","text":"새 이용자 후보 = 여성·가족·원격 근무자 / 빈도·장면 = 작업·휴식·숙박 대용 / 1회 금액 = 개인실·식음. 앞의 페르미 수치로 여지가 큰 곳을 고른다"},"377":{"kw":"ノンアルコール","text":"새 이용자 후보 = 운전·건강·임신 등 마시지 못하는 장면의 사람 / 빈도·장면 = 평일 저녁·점심 / 1회 금액 = 고급 라인"},"399":{"kw":"ノンアルコール","text":"새 이용자 후보 = 운전·건강·임신 등 마시지 못하는 장면의 사람 / 빈도·장면 = 평일 저녁·점심 / 1회 금액 = 고급 라인"},"381":{"kw":"高速バス","text":"새 이용자 후보 = 신칸센·자가용을 쓰는 사람 / 빈도·장면 = 주말 여행·귀성 외 장면 / 1회 금액 = 고급 좌석"},"406":{"kw":"高速バス","text":"새 이용자 후보 = 신칸센·자가용을 쓰는 사람 / 빈도·장면 = 주말 여행·귀성 외 장면 / 1회 금액 = 고급 좌석. 원문대로 시장 전체로"},"383":{"kw":"会議室","text":"새 이용자 후보 = 회의실을 빌린 적 없는 소기업·개인 / 빈도·장면 = 면접·연습·촬영 / 1회 금액 = 설비 포함 패키지"},"405":{"kw":"会議室","text":"새 이용자 후보 = 회의실을 빌린 적 없는 소기업·개인 / 빈도·장면 = 면접·연습·촬영 / 1회 금액 = 설비 포함 패키지"},"398":{"kw":"フードデリバリー","text":"새 이용자 후보 = 지방·고령자 / 빈도·장면 = 점심·혼자 저녁·사무실 / 1회 금액 = 배달비 구조. 업계 공통 장벽(배달원·수수료)부터"},"487":{"kw":"ヘルスケア","text":"새 이용자 후보 = 아직 건강 관리 서비스를 쓰지 않는 사람 / 빈도·장면 = 예방·일상 관리 / 1회 금액 = 보험 외 서비스. 업계 범위를 먼저 정한다"},"488":{"kw":"医療","text":"새 이용자 후보 = 진료를 미루는 사람 / 빈도·장면 = 예방·원격 진료 / 1회 금액 = 자비 서비스. 공적 보험의 제약을 먼저 확인"},"6":{"kw":"ライザップ","text":"이익 = 매출 측(회원 수·단가: 고가 단기 프로그램) / 비용 측(트레이너 인건비·점포). 원문은 이익 목표"},"54":{"kw":"個人タクシー","text":"이익 = 매출 측(실차 시간·단가·예약 고객) / 비용 측(연료·차량·보험). 원문의 강점·약점은 개인 운영의 유연성과 집객력"},"124":{"kw":"個人タクシー","text":"이익 = 매출 측(실차 시간·단가·예약 고객) / 비용 측(연료·차량·보험)"},"277":{"kw":"JR","text":"이익 = 역 수에 따른 운임 수입·역 상업 수입 / 역 운영 비용. 앞의 페르미(역 수)를 비용 단위로 쓴다"},"317":{"kw":"JR","text":"이익 = 역 수에 따른 운임 수입·역 상업 수입 / 역 운영 비용. 앞의 페르미(역 수)와 타당성 평가를 먼저"},"284":{"kw":"鍋","text":"판단 = 냄비 메뉴의 추가 매출(누가 언제 먹나) / 추가 비용(조리 시간·회전 저하). 이익이 나는 조건으로 결론"},"396":{"kw":"百貨店","text":"이익 = 매출 측(방문·관내 소비, 임대 수입) / 비용 측(인건비·점포 유지). 직영·임대 비중을 먼저 확인"},"397":{"kw":"旅行代理店","text":"이익 = 매출 측(취급액·수수료율) / 비용 측(점포·인건비). 채널별 수익 차이를 먼저"},"472":{"kw":"機械製造","text":"이익률 = 매출 측(가격·제품 구성) / 비용 측(원가·고정비). 보수 매출 비중도 확인"},"581":{"kw":"外食チェーン","text":"이익 = 매출 측(객수·객단가) / 비용 측(인건비). 원문의 인력 부족은 비용과 처리 능력 양쪽 제약"},"658":{"kw":"電気自動車","text":"이익 = 매출 측(판매 대수·단가·소프트웨어 수익) / 비용 측(배터리 원가·투자). 원문대로 먼저 조사할 항목을 망라"},"29":{"kw":"婚約指輪","text":"외부 = 혼인 건수·경쟁 / 내부 = 후발로서 성장한 이유(가격·디자인·접점)와 최근 정체 이유. 성장 요인이 약해졌는지부터"},"165":{"kw":"婚約指輪","text":"외부 = 혼인 건수·경쟁 / 내부 = 후발로서 성장한 이유(가격·디자인·접점)와 최근 정체 이유"},"46":{"kw":"惣菜","text":"외부 = 반찬 시장·경쟁 업태(편의점·도시락) / 내부 = 반찬 구색·가격·진열 시간대. 원문대로 원인 뒤 전략"},"159":{"kw":"惣菜","text":"외부 = 반찬 시장·경쟁 업태 / 내부 = 반찬 구색·가격·진열 시간대"},"56":{"kw":"8月","text":"외부 = 8월 방학으로 학생이 없음(가설) / 내부 = 영업 시간·프로그램. 일시적 계절 요인인지부터 확인"},"134":{"kw":"トラック","text":"외부 = 화물 수요·경쟁 / 내부 = 제품·가격·판매망·서비스 중 진 곳. 앞의 이익 추정을 기준으로"},"437":{"kw":"イチゴ","text":"외부 = 날씨·재해 / 내부 = 재배 기술·설비·인력. 원문대로 인지도는 있으니 생산 안정이 쟁점"},"504":{"kw":"台風","text":"외부 = 태풍 빈도 / 내부 = 방풍 설비·보험·수확 시기 분산. 피해를 줄일지 손실을 메울지로"},"507":{"kw":"大学","text":"외부 = 18세 인구·경쟁 대학 / 내부 = 교육 내용·홍보·재무. 원문대로 과제와 해결책"},"550":{"kw":"電機メーカー","text":"외부 = 해외 경쟁·시장 성숙 / 내부 = 제품 차별·판매 방식. 원문 2번은 판매 촉진 시책"},"616":{"kw":"病院","text":"외부 = 환자 수·보험 제도 / 내부 = 부문별 진료·병상. 원문 3번은 부문 철수의 손익 판단"},"620":{"kw":"LCC","text":"외부 = 연료·경쟁·수요 / 내부 = 노선별 운임·탑승률·비용. 원문대로 고르지 않은 요소도 영향이 없는지 확인"},"631":{"kw":"テレビ離れ","text":"외부 = 동영상·SNS 대체 / 내부 = 프로그램 내용·시청 방식(시간 고정). 대상(시청 시간인가 수상기 보유인가)을 먼저 정한다"},"644":{"kw":"音楽学校","text":"외부 = 학령 인구·진로 선호·경쟁 학교 / 내부 = 교육 내용·학비·홍보. 원문대로 가설을 MECE로"},"643":{"kw":"葬儀","text":"지역 수요 = 상권의 사망·장례 건수 / 선택 비중 = 그 상권에서 이 점포가 선택되는 비율(경쟁 장례식장·가족장) / 건당 매출 = 장례 규모·옵션(PM 결정)"},"648":{"kw":"インタビュー","text":"외부 = 저가 아시아 부품의 유입 / 내부 = 제품 특징과 고객 필요의 어긋남. 원문 1번은 누구에게 물을지(사용자·판매점·비사용자)"},"24":{"kw":"半導体","text":"진입 목적 = 왜 반도체인가 / 시장 매력 = 분야별 성장·투자 규모 / 잡을 수 있나 = 자사 기술·고객 / 실현성 = 투자액·인재"},"47":{"kw":"ペットフード","text":"진입 목적 = 고가 시장으로 가는 이유 / 시장 매력 = 고급 사료 성장 / 잡을 수 있나 = 대중 브랜드 이미지가 걸림 / 실현성 = 별도 브랜드·판로(동물병원·전문점)"},"260":{"kw":"UberEats","text":"진입 목적 = 거래 확대 / 시장 매력 = 도쿄 내 가맹점 확대 vs 새 지역 / 잡을 수 있나 = 지역 밀도 / 실현성 = 배달원 확보. 앞의 페르미로 여지를 비교"},"448":{"kw":"川崎汽船","text":"진입 목적 = 전략 과제 / 시장 매력 = 사업 영역별 성장 / 잡을 수 있나 = 동업 2사 대비 강점 / 실현성 = 자원. 자료로 비교"},"518":{"kw":"アメリカ","text":"진입 목적 = 미국 진출 이유 / 시장 매력 = 지역별 수요 / 잡을 수 있나 = 기존 대형 사업자 대비 / 실현성 = 규제·자본"},"623":{"kw":"カナダ","text":"진입 목적 / 시장 매력 = 캐나다 농업 규모·성장 / 잡을 수 있나 = 현지 경쟁·판매망 / 실현성 = 규제·물류. 원문대로 필요한 질문을 망라"},"640":{"kw":"電力小売","text":"진입 목적 = 경쟁 속 새 수익 / 시장 매력 = 북서부 세대·서비스 수요 / 잡을 수 있나 = 400만 세대 고객 기반 / 실현성 = 제휴·규제"}},"families":{"F1":{"id":"F1","name":"수치·인수 분해","question":"어떤 수치가 목표 변화를 만드는가?","cues":["목표가 매출·이익·시장 규모·보유량처럼 숫자로 주어졌다","전년 대비 얼마 줄었는지·늘려야 하는지가 문제다","항별 자료(인수·비용 항목)를 셀 수 있다"],"summary":{"if":"목표가 숫자이고 항별 자료를 셀 수 있다면","first":"목표에 맞는 식(매출·이익·보유량·흐름)을 고른 뒤 항으로 나눈다","next":"변화가 가장 큰 항은 무엇이 정하나?"},"favorable":["목표 지표와 기간·단위가 분명하다","항마다 움직이는 레버가 다르다고 볼 근거가 있다"],"data":["항별 전년 대비 증감(매출 인수와 비용 항목)","이용자 수인지 거래 건수인지, 기간이 1년인지 1개월인지","가격을 바꾼 이력(이용자 수·빈도가 함께 움직였는지)"],"why":"목표 수치를 그 목표에 맞는 식의 항으로 나누면 변화가 어디에서 왔는지 숫자로 좁힐 수 있다. 이익 목표라면 비용 항목도 가지가 된다. 식이 성립한다는 것과 각 항을 따로 움직일 수 있다는 것은 다르다.","split":"목표 식 / 변화가 큰 항 / 항을 정하는 수치","formulas":[{"kind":"identity","text":"매출 = 이용자 수(기간 안에 한 번 이상 이용한 사람) × 기간 내 이용 빈도 × 1회 금액","unit":"엔/기간","premise":"이용자 수와 거래 건수(연인원)를 섞지 않는다. 거래 건수로 쓰면 매출 = 거래 건수 × 건당 금액이다. 점포·채널별 이용자 수를 더하면 여러 곳을 쓰는 사람이 중복되므로, 기간 고유 이용자로 쓰려면 중복을 조정하고 아니면 거래 건수로 쓴다. 가격을 바꾸면 이용자 수·빈도가 함께 움직일 수 있으므로 식은 성립해도 각 인수를 독립 레버로 해석하지 않는다"},{"kind":"identity","text":"이익 = 매출 − 변동비 − 고정비","unit":"엔/기간","premise":"이익 목표라면 비용 항목(원재료·인건비·연료비·임차료 등)도 가지로 둔다. 매출을 늘리는 시책이 비용도 늘리는지 함께 본다"},{"kind":"identity","text":"플랫폼 한쪽 기준 매출 = 기회 수(주문·예약 요청 수) × 성사율 × 건당 수익","unit":"엔/기간","premise":"반대쪽(드라이버·가맹점)은 처리 가능 건수 = 공급자 수 × 1인당 처리 건수로 상한만 확인한다. 양쪽 수를 서로 곱하지 않는다(단위가 맞지 않고 건수가 중복된다)"},{"kind":"rule","text":"목표 변화가 어느 인수의 변화로 설명되는지 자료로 확인되면 그 인수 아래로 내려간다","unit":"","premise":"확인 전이면 인수별 증감을 먼저 묻는다"}],"tools":["mix"],"switch":[{"cue":"인수는 줄지 않았는데 특정 고객층·채널에만 변화가 몰려 있다","to":"F2","why":"칸별로 나눠야 원인이 보인다","ask":"칸별로 나누면 변화가 몰린 칸이 있나?"},{"cue":"이용자 수가 줄었고 고객이 다른 대안으로 옮겼다는 단서가 있다","to":"F4","why":"인수보다 고르는 이유가 원인일 수 있다","ask":"떠난 고객은 대신 무엇을 고르나?"},{"cue":"목표 시간대가 꽉 차 거절이 생긴다","to":"F5","why":"수요가 아니라 처리 능력이 상한이다","ask":"목표 시간대에 거절·대기 이탈이 실제로 있었나?"}],"paths":null,"examples":[{"row":14,"goal":"growth","hypothesis":"특정 채널에서 진열이 줄어 구매자 수가 줄었다면","split":"칸을 정한 뒤 취급 점포 수 / 점포당 판매량 / 납품 단가","data":"칸별 매출 증감, 취급 점포 수 추이","why":"칸 하나를 세 인수로 나누면 진열 문제와 수요 문제가 갈린다","primary":true},{"row":54,"goal":"profit","hypothesis":"개인택시의 이익이 실차율과 연료비에 좌우된다면","split":"매출(운행 시간 × 실차율 × 시간당 운임)과 비용으로 나누기","data":"실차율, 운행 시간대, 연료비","why":"이익은 매출 쪽과 비용 쪽 중 어디를 고칠지부터 정해야 한다","primary":true,"tree":"goal:profit","treeWhy":"대가 이익 식의 두 항(매출 측·비용 측)이고 중이 각 항의 인수(수량·단가, 변동비·고정비)다"},{"row":2,"goal":"fermi","hypothesis":"타이어 수는 보유량(스톡)을 묻는 문제라면","split":"차량 종류별 대수 × 1대당 타이어 수","data":"차량 보유 대수, 1대당 타이어 수","why":"보유량과 1년 판매량(흐름)을 섞으면 단위가 틀린다","primary":true},{"row":200,"goal":"growth","hypothesis":"주문 요청은 있는데 드라이버가 부족해 성사되지 않는다면","split":"요청 수 × 성사율 × 건당 수익, 드라이버 처리 가능 건수는 상한으로","data":"시간대별 요청 수·성사율, 드라이버 가동","why":"플랫폼은 한쪽을 주 식으로 두고 반대쪽은 제약으로 본다","primary":false},{"row":377,"goal":"market","hypothesis":"시장 전체를 넓히려면 아직 이용하지 않는 사람이 열쇠라면","split":"이용자 수 / 이용 빈도 / 1회 금액(자사 점유 없이)","data":"음용 경험률, 음용 장면별 빈도","why":"시장 확대 문제는 자사 점유가 아니라 이용 전체를 본다","primary":false}],"fermi":[{"kind":"demand","when":"이용·소비 행동을 셀 수 있다면","formula":"대상 인구 × 이용률 × 기간 내 빈도 × 1회 수량","unit":"개/년","check":"공급 쪽(점포 수 × 1곳 판매량)으로 다시 계산해 자릿수를 맞춘다"},{"kind":"stock","when":"지금 있는 수(보유량)를 묻는다면","formula":"보유 단위 수 × 1단위당 개수","unit":"개","check":"1년 판매량과 다른가?","n":3}]},"F3":{"id":"F3","name":"과정·단계","question":"어디에서 이탈·비용·지연이 생기는가?","cues":["알고는 있는데 사지 않는다","한 번 사고 다시 오지 않는다","업무 단계 중 원가·지연·불량이 큰 곳이 있다"],"summary":{"if":"고객 단계별 인원이나 업무 단계별 원가·소요 시간을 관측할 수 있다면","first":"문제에 맞는 흐름 하나(고객 흐름 또는 업무 흐름)를 골라 단계로 나눈다","next":"기준보다 나쁘고 개선하면 목표 효과가 큰 단계는 어디인가?"},"favorable":["단계마다 대책이 다르다","단계별 인원·전환율 또는 원가·소요 시간을 셀 수 있다"],"data":["고객 흐름: 단계별 인원과 조건부 전환율","업무 흐름: 단계별 원가·소요 시간·불량","B2B라면 결정자와 심사 단계"],"why":"단계로 나누면 손님이 빠지거나 비용이 새는 곳을 한 곳으로 좁힐 수 있다. 고객이 사지 않는 문제와 만드는 데 돈·시간이 새는 문제는 흐름이 다르므로 하나를 골라 쓴다. 상품 종류로 적용을 금지하지 않는다. B2B도 구매 단계가 있고 충동구매도 노출·접근·결제 병목이 있을 수 있다.","split":"흐름 선택 / 개선 효과가 큰 단계 / 이탈·비용 이유","formulas":[{"kind":"identity","text":"구매자 수 = 대상자 수 × 단계별 전환율의 곱","unit":"명/기간","premise":"같은 대상자 집단(코호트)을 같은 기간에 따라가고, 단계 순서가 정해져 있으며, 각 전환율이 앞 단계를 통과한 사람 기준(조건부)일 때만 성립한다. 관측할 수 있는 단계만 쓰고, 근거 없이 모든 구매 단계를 강제하지 않는다"},{"kind":"identity","text":"제품 1개 원가 = 업무 단계별 원가의 합","unit":"엔/개","premise":"단계별 원가는 같은 기간·같은 제품 기준으로 맞추고, 불량으로 버린 분은 양품 1개에 나눠 싣는다"},{"kind":"rule","text":"전환율이 가장 낮거나 원가가 가장 큰 단계를 곧바로 병목으로 확정하지 않는다. 기준(과거·경쟁) 대비 개선 여지와 그 단계의 인원·물량, 목표 지표 효과를 함께 비교한다","unit":"","premise":"자료가 없으면 단계별 인원이나 원가를 셀 수 있는지부터 묻는다"}],"tools":["funnel","b2b_stage","journey","value_chain"],"switch":[{"cue":"단계 전환율은 기준 수준인데 고객이 다른 대안을 고른다는 말이 있다","to":"F4","why":"단계보다 고르는 이유가 원인일 수 있다","ask":"고객은 대신 무엇을 고르고, 왜 그쪽이 낫다고 보나?"},{"cue":"이탈이 대기·만실처럼 받지 못해서 생긴다는 단서가 있다","to":"F5","why":"처리 능력이 상한일 수 있다","ask":"목표 시간대에 거절·대기 이탈이 실제로 있었나?"}],"paths":[{"name":"고객 흐름","when":"고객이 알고도 사지 않거나 다시 오지 않는 것이 문제라면","tools":["funnel","b2b_stage","journey"]},{"name":"업무 흐름","when":"원가·지연·불량처럼 만들고 전달하는 데서 돈·시간이 새는 것이 문제라면","tools":["value_chain"]}],"examples":[{"row":19,"goal":"cause","hypothesis":"B2B 고객의 시험·심사 단계에서 경쟁사에 진다면","split":"구매 단계 / 그 단계의 결정자 / 탈락 이유","data":"단계별 탈락 건수, 결정자별 평가 기준","why":"B2B는 탈락 단계와 그 단계 결정자의 기준을 함께 봐야 탈락 이유가 보인다","primary":true,"tree":"famtree:F3:19","treeWhy":"대가 구매 단계, 중이 그 단계의 결정자 기준, 소가 탈락 이유다"},{"row":135,"goal":"growth","hyp  역량·경쟁 대비를 나눠야 근거 있는 평가가 된다"},{"row":648,"part":"Competitor(경쟁)","cond":"싼 아시아 부품이 들어와 점유율이 떨어지고, 제품 특징과 고객 니즈가 어긋났다는 가설이 주어지면","why":"경쟁(저가 부품)·고객(니즈)·자사(제품 특징)가 문제 문장에 함께 들어 있어 세 관점의 어긋남을 맞춰 봐야 한다"}],"note":"3C 칸마다 아래 프레임워크로 내려가는 조건이 다르다. 칸을 다 채우는 것보다 단서가 있는 칸 하나를 깊게 판다.","notFit":[]},"aidma":{"id":"aidma","name":"AIDMA(구매 퍼널)","en":"Attention · Interest · Desire · Memory · Action","question":"고객이 사기까지의 어느 단계에서 빠지나?","def":"소비자가 상품을 알고(Attention), 관심을 갖고(Interest), 갖고 싶어지고(Desire), 기억하고(Memory), 사는(Action) 단계를 순서대로 놓고, 단계마다 남는 사람 수를 세는 구매 과정 틀이다.","parts":[{"name":"Attention(주의)","means":"상품을 알게 된다","q":"애초에 알고 있는 사람이 적은가?","links":[{"to":"4p","cond":"알고 있는 사람 자체가 적으면","why":"판촉(Promotion)·유통 접점(Place) 중 무엇이 부족한지 나눈다"}]},{"name":"Interest(관심)","means":"관심을 갖고 알아본다","q":"알지만 관심을 갖지 않나?","links":[{"to":"stp","cond":"관심을 보이는 층과 그렇지 않은 층이 갈리면","why":"관심이 없는 층이 원래 노릴 층인지부터 정한다"}]},{"name":"Desire(욕구)","means":"갖고 싶어진다","q":"관심은 있지만 갖고 싶지 않나?","links":[{"to":"jtbd","cond":"비교 후 다른 대안을 고른다면","why":"고객이 해결하려는 일에서 대안보다 못한 점을 찾는다"}]},{"name":"Memory(기억)","means":"살 때까지 기억한다","q":"살 시점에 떠올리지 못하나?","links":[{"to":"4p","cond":"구매 시점의 매장·화면에서 눈에 띄지 않으면","why":"구매 접점의 진열·노출(Place·Promotion)을 본다"}]},{"name":"Action(행동)","means":"실제로 산다","q":"사려다 멈추나?","links":[{"to":"4p","cond":"가격·결제·재고 때문에 멈추면","why":"가격(Price)과 구매 경로(Place)를 본다"},{"to":"profit_tree","cond":"단계 전환율로 매출 영향을 계산해야 하면","why":"구매자 수 = 인지자 수 × 단계별 전환율로 매출 식에 잇는다"}]}],"favorable":["개인 소비자가 사기까지 단계가 분명하고, 단계별 사람 수를 셀 수 있을 때","알리는 문제인지 사게 하는 문제인지 가려야 할 때"],"data":["인지율·방문 수·장바구니 수·구매 수 같은 단계별 수","과거·경쟁 대비 단계 전환율"],"why":"단계마다 빠지는 사람 수를 세면 시책을 둘 단계가 좁혀진다. 알리는 시책과 사게 하는 시책은 원인이 다르다.","vsOther":"이용 경험·재방문이 문제면 구매 전 단계만 보는 AIDMA보다 고객 여정이 맞다. 조직 구매(B2B)는 결정자가 단계마다 달라 결정자 축을 더한다.","misuse":"근거 없이 다섯 단계를 모두 채우지 않는다. 재구매는 AIDMA 단계에 없으니 첫 구매 → 재구매처럼 문제에 맞춘 단계를 따로 둔다.","bookPage":"p39 時間軸(단계로 나누기), p44~45(인지·관심·비교·구매·재구매 가설)","cases":[{"row":207,"part":"Attention(주의)","cond":"EC를 써 본 적 없는 사람이 첫 구매 단계에서 멈춘다면","why":"이용 경험이 없는 사람을 단계별로 세면 모르는 것인지, 알지만 불안해 멈추는 것인지가 갈린다"},{"row":135,"part":"Action(행동)","cond":"가전 양판점에 오는 사람이 줄었거나, 와서 보고도 사지 않는다면","why":"내점(관심) 단계와 구매(행동) 단계를 나누면 집객 시책과 매장 안 구매 시책이 갈린다"}],"note":"AIDMA는 단계 이름의 한 예다. 관측되는 단계만 쓴다.","notFit":[{"row":19,"cond":"B2B 고객사의 시험·심사 단계에서 경쟁사에 진다면","why":"조직 구매는 요구 정의·후보 선정·시험·결재처럼 단계마다 판단하는 사람이 달라 개인 소비자의 AIDMA 단계와 맞지 않는다. 결정자와 그 기준을 축으로 둔 B2B 구매 단계(변형 퍼널)를 쓴다"}]},"value_chain":{"id":"value_chain","name":"가치사슬","en":"Value Chain","question":"어느 업무 단계에서 비용·지연·품질 문제가 생기거나 강점이 나오나?","def":"기업이 고객 가치를 만드는 일을 조달 → 생산 → 물류 → 판매 → 서비스 같은 업무 단계로 나누고, 단계마다 비용·시간·품질·강점을 보는 틀이다(인사·기술 개발 같은 지원 활동을 따로 둘 수 있다).","parts":[{"name":"조달","means":"원재료·인력·부품을 확보한다","q":"원재료·인력 확보에서 비용이 큰가?","links":[{"to":"five_forces","cond":"공급자가 적어 값을 올린다면","why":"공급자 교섭력이 업계 구조 문제인지 본다"}]},{"name":"생산","means":"만들거나 서비스를 준비한다","q":"만드는 과정에서 원가·불량·시간이 새나?","links":[{"to":"profit_tree","cond":"단계 원가를 이익 식의 비용 항목으로 계산해야 하면","why":"변동비·고정비로 나눠 이익 영향을 잰다"}]},{"name":"물류","means":"고객에게 전달한다","q":"전달 과정의 비용·지연이 큰가?","links":[{"to":"4p","cond":"전달 경로가 고객 접점(유통)의 문제라면","why":"유통 채널(Place) 선택으로 넘긴다"}]},{"name":"판매","means":"알리고 판다","q":"판매 활동의 비용 대비 효과가 낮은가?","links":[{"to":"aidma","cond":"판매 단계에서 고객이 어느 단계에서 빠지는지 봐야 하면","why":"구매 단계별 전환율로 판매 문제를 좁힌다"}]},{"name":"서비스","means":"산 뒤에 지원한다","q":"구매 후 지원에서 불만·비용이 생기나?","links":[{"to":"jtbd","cond":"구매 후 고객이 해결하려는 일이 채워지지 않으면","why":"고객의 일에서 빠진 지원을 찾는다"}]}],"favorable":["이익률·원가가 문제이고 업무 단계별 원가·시간 자료를 얻을 수 있을 때","강점이 어느 업무에서 나오는지, 어느 단계로 사업을 넓힐지 볼 때(p46 縦 확장)"],"data":["단계별 원가·소요 시간·불량률","기준 공장·경쟁사 대비 차이"],"why":"이익 식(매출 − 비용)은 비용 항목은 보여 주지만 어느 업무에서 새는지는 보여 주지 않는다. 업무 단계로 나누면 손댈 곳이 보인다.","vsOther":"수요가 부족한 문제라면 업무보다 고객 쪽(AIDMA·STP)이 먼저다.","misuse":"모든 단계를 같은 깊이로 나열하지 않는다. 원가·지연이 큰 단계 하나를 다시 나눈다.","bookPage":"p39 バリューチェーン, p45(자사 가치사슬 가설), p46(縦: 가치사슬 범위 확장)","cases":[{"row":15,"part":"생산","cond":"금속 가공 공장의 원가가 가공 중 불량·정지에서 새고 있다면","why":"조달·가공·검사 단계별로 원가를 나누면 판매 단가 문제인지 공장 안 손실인지가 갈린다"},{"row":41,"part":"생산","cond":"저가 미용실이 커트 외 업무를 줄여 단가를 낮추는 구조라면","why":"세발·예약·결제 같은 업무를 단계로 나눠야 어디를 줄여 저가를 유지하는지와 다음 개선점이 보인다"},{"row":476,"part":"서비스","cond":"가전 양판점이 판매 뒤 업무(설치·수리·금융)로 새 수익원을 찾는다면","why":"판매 앞뒤 업무 단계를 나열하면 자사가 넓힐 수 있는 단계(縦 확장)가 보인다"}],"note":null,"notFit":[]},"jtbd":{"id":"jtbd","name":"JTBD(해결하려는 일)","en":"Jobs To Be Done","question":"고객은 어떤 상황에서 무엇을 해결하려고 이것(또는 다른 대안)을 고르나?","def":"고객은 상황 속에서 해결하려는 일(Job)이 있고, 그 일을 해 줄 상품을 '고용'한다고 보는 틀이다. 연령·성별보다 상황과 목적으로 고객을 본다.","parts":[{"name":"상황","means":"언제·어디서·누구와","q":"고객은 어떤 상황에서 이것을 쓰나?","links":[{"to":"stp","cond":"상황마다 고객층이 뚜렷하게 갈리면","why":"상황을 세그먼트 축으로 써서 노릴 장면을 정한다"}]},{"name":"해결하려는 일","means":"그 상황에서 이루려는 목적","q":"그 상황에서 무엇을 끝내고 싶나?","links":[]},{"name":"지금 고르는 대안","means":"그 일을 위해 대신 쓰는 것","q":"고객은 지금 무엇으로 그 일을 하나?","links":[{"to":"five_forces","cond":"업태 밖 대안이 업계 전체 수요를 빼앗는다면","why":"대체재의 힘으로 업계 수익성을 본다"}]},{"name":"고르지 않는 이유","means":"자사가 고용되지 않는 이유","q":"왜 우리 상품을 고용하지 않나?","links":[{"to":"4p","cond":"이유가 상품·가격·접점 중 하나로 좁혀지면","why":"해당 수단을 바꾸는 시책으로 잇는다"}]}],"favorable":["새 상품·새 사업 발상, 업태 밖 대안으로 고객이 옮긴 문제","고객이 무엇과 비교하는지 모를 때"],"data":["이용 상황 관찰·인터뷰","대안으로 쓰는 것과 그 이유"],"why":"고객이 해결하려는 일로 보면 업태 밖의 진짜 경쟁 상대와 새 상품의 방향이 보인다(p43 ジョブ).","vsOther":"이미 아는 경쟁 대안끼리 견주는 문제라면 구매 결정 요인 비교(4P·3C Competitor)가 더 직접적이다.","misuse":"연령·성별 같은 속성만 바꿔 쓰면 JTBD가 아니다. 상황이 빠지면 니즈 목록이 된다.","bookPage":"p43 ジョブ理論","cases":[{"row":274,"part":"해결하려는 일","cond":"영화관이 '외출해서 함께 즐기기'라는 일을 다른 놀거리와 다툰다면","why":"영화를 보는 일보다 상위의 일로 보면 경쟁 상대(다른 외출)와 새 영화관의 형태가 정해진다"},{"row":37,"part":"상황","cond":"히트 청량음료를 새로 만들려면","why":"마시는 상황과 그때 해결하려는 일에서 출발해야 기존 상품과 다른 이유가 생긴다"},{"row":669,"part":"상황","cond":"미용실 고객의 시술 전후 시간에 채우지 못한 일이 있다면","why":"시술 전후 상황에서 고객이 하려는 일을 찾으면 미용실과 결합할 사업의 근거가 된다"}],"note":null,"notFit":[]},"five_forces":{"id":"five_forces","name":"Five Forces(5F)","en":"Five Forces","question":"업계 구조가 업계 수익성과 경쟁 압력을 어떻게 정하나?","def":"업계 수익성을 정하는 다섯 가지 힘 — 기존 경쟁, 신규 진입, 대체재, 구매자 교섭력, 공급자 교섭력 — 으로 업계 구조를 보는 틀이다.","parts":[{"name":"기존 경쟁","means":"경쟁사끼리의 가격·판촉 경쟁","q":"경쟁사 수가 많고 차별화가 약해 단가·수량·원가 인수에 잇는다"}]},{"name":"Society(사회)","means":"인구·생활 방식·가치관","q":"인구 구성이나 생활 방식이 바뀌나?","links":[{"to":"stp","cond":"변화가 특정 고객층에 몰리면","why":"커지거나 줄어드는 층을 세그먼트로 나눈다"},{"to":"jtbd","cond":"생활 방식 변화로 해결하려는 일이 바뀌면","why":"바뀐 상황에서 고객의 일을 다시 본다"}]},{"name":"Technology(기술)","means":"새 기술과 그 비용","q":"새 기술이 대안이나 원가를 바꾸나?","links":[{"to":"value_chain","cond":"기술이 특정 업무 단계의 비용을 바꾸면","why":"어느 업무가 바뀌는지 가치사슬로 본다"},{"to":"scenario","cond":"보급 속도·시점이 불확실하면","why":"속도별 시나리오로 나눈다"}]}],"favorable":["장래 예측·공공 정책·진입 판단처럼 바깥 변화가 답을 바꿀 때","규제·원가 충격 같은 외부 변화의 단서가 문제에 있을 때"],"data":["규제·정책 일정","인구·소득 통계","기술 보급률과 비용 추이"],"why":"바깥 변화를 네 칸으로 나누면 결과를 바꾸는 동인을 빠짐없이 찾을 수 있다(p37 外部環境).","vsOther":"5F는 업계 안의 힘을 본다. 업계 바깥의 변화가 문제일 때 PEST를 쓴다. 단기 자사 매출 문제에서 외부 단서가 없으면 우선순위가 낮다.","misuse":"네 칸을 일반론으로 채우지 않는다. 각 변화가 수요나 비용에 닿는 경로까지 이어야 쓸모가 있다.","bookPage":"p37 外部環境","cases":[{"row":415,"part":"Society(사회)","cond":"젊은 층이 차를 덜 산다면(자동차 회사의 시책)","why":"도시 거주·공유 서비스·소득 같은 사회·경제·기술 변화가 차를 소유하는 이유를 줄였는지 먼저 가른다"},{"row":294,"part":"Politics(정치·제도)","cond":"고령 운전자 면허 제한의 찬반을 묻는다면","why":"제도 변경이 이동 수단·사고·지역 생활에 미치는 영향을 사회 변화(고령화)와 함께 본다"},{"row":141,"part":"Society(사회)","cond":"냉동식품 수요를 장래까지 예측해야 한다면","why":"맞벌이·1인 가구·조리 시간 같은 사회 변화가 수요의 방향을 정한다"}],"note":null,"notFit":[]},"stp":{"id":"stp","name":"STP","en":"Segmentation · Targeting · Positioning","question":"누구를 노리고(타깃), 그 고객에게 경쟁과 다른 무엇으로 기억될까(포지션)?","def":"시장을 니즈·행동이 다른 층으로 나누고(Segmentation), 그중 노릴 층을 고르고(Targeting), 그 층의 머릿속에서 경쟁과 다른 자리를 정하는(Positioning) 마케팅 전략 틀이다.","parts":[{"name":"Segmentation(세분화)","means":"니즈·사용 행동이 다른 층으로 나눈다","q":"어떤 기준으로 나누면 니즈·사용량이 크게 갈리나?","links":[{"to":"jtbd","cond":"속성(연령·성별)보다 상황·목적으로 갈리면","why":"상황별 해결하려는 일을 나누는 기준으로 쓴다"}]},{"name":"Targeting(타깃 선정)","means":"크기·성장·자사 적합도로 노릴 층을 고른다","q":"어느 층이 크고, 자사가 이길 수 있나?","links":[{"to":"five_forces","cond":"노릴 층의 경쟁 강도·교섭력을 봐야 하면","why":"그 층을 두고 다투는 힘을 본다"},{"to":"entry","cond":"아직 안 들어간 층이라 진입 판단이 필요하면","why":"시장 매력·실현성으로 판단한다"}]},{"name":"Positioning(포지셔닝)","means":"타깃의 머릿속에 경쟁과 다른 자리를 정한다","q":"타깃은 우리를 무엇으로 기억하고, 경쟁과 무엇이 다른가?","links":[{"to":"4p","cond":"정한 자리를 상품·가격·유통·판촉으로 실현해야 하면","why":"포지션을 네 가지 수단으로 옮긴다"}]}],"favorable":["누구를 노릴지 정해지지 않았거나, 층마다 니즈가 크게 다를 때","새 시장·새 상품의 방향을 정할 때(타깃과 차별화가 함께 필요)"],"data":["층별 크기·성장·사용량","층별 니즈와 경쟁사 위치(포지셔닝 맵)"],"why":"층마다 니즈가 다르면 한 상품으로 모두를 만족시키기 어렵다. 노릴 층과 차별화할 자리를 정해야 4P 시책이 하나의 방향으로 모인다.","vsOther":"단순히 고객을 나눠 비교하는 진단(어느 층에서 매출이 줄었나)은 세그먼트 비교로 충분하다. STP는 노릴 층과 자리를 정하는 전략 선택까지 간다.","misuse":"세그먼트를 나누는 것만으로 STP가 아니다. 타깃 선정 기준과 포지션이 빠지면 고객 분류에 그친다.","bookPage":"관련 대목: p44(세그먼트·포지셔닝 가설), p55~56(세그먼트 축)","cases":[{"row":47,"part":"Positioning(포지셔닝)","cond":"대중용 사료 회사가 고급 사료 시장에 들어간다면","why":"고급 시장의 어느 층을 노리고, 대중 브랜드 이미지와 다른 어떤 자리를 잡을지가 진입 방식을 정한다"},{"row":252,"part":"Segmentation(세분화)","cond":"젊은 층의 맥주 음용이 다른 층보다 크게 줄었다면","why":"젊은 층 안에서도 마시는 상황·이유가 다른 층을 나눠야 시책을 둘 층이 정해진다"},{"row":552,"part":"Targeting(타깃 선정)","cond":"고령자 대상 구독 서비스를 새로 만든다면","why":"고령자도 건강·이동·가족 형태가 달라, 어느 층을 노릴지 정해야 서비스와 효과 추정이 정해진다"}],"note":null,"notFit":[]},"4p":{"id":"4p","name":"4P(마케팅 믹스)","en":"Product · Price · Place · Promotion","question":"타깃에게 무엇을(상품), 얼마에(가격), 어디서(유통), 어떻게 알려(판촉) 팔까?","def":"기업이 고객에게 내놓는 수단을 상품(Product)·가격(Price)·유통(Place)·판촉(Promotion) 네 가지로 나누는 실행 틀이다. 네 수단이 같은 타깃·포지션을 향하는지 함께 본다.","parts":[{"name":"Product(상품)","means":"기능·품질·디자인·구색","q":"상품이 타깃의 니즈와 맞나?","links":[{"to":"jtbd","cond":"상품이 고객의 해결하려는 일과 어긋났다면","why":"고객의 일에서 빠진 기능을 찾는다"}]},{"name":"Price(가격)","means":"가격 수준·할인·요금 구조","q":"가격이 지불 의사와 경쟁 대비 맞나?","links":[{"to":"profit_tree","cond":"가격 변경이 판매량·이익에 미치는 영향을 계산해야 하면","why":"가격 × 수량 − 비용 식으로 따진다"}]},{"name":"Place(유통)","means":"판매 채널·진열·접근성","q":"고객이 사려 할 때 살 수 있는 곳에 있나?","links":[{"to":"aidma","cond":"매장·화면에서 고객이 어느 단계에서 빠지는지 봐야 하면","why":"구매 단계별 전환율을 센다"},{"to":"value_chain","cond":"물류·판매 업무 비용이 문제라면","why":"업무 단계별 비용을 본다"}]},{"name":"Promotion(판촉)","means":"광고·홍보·판매 촉진","q":"알리는 방법이 타깃에게 닿나?","links":[{"to":"aidma","cond":"알리기와 관심 단계 중 어디가 약한지 봐야 하면","why":"인지·관심 단계 수를 센다"}]}],"favorable":["타깃과 포지션이 정해진 뒤 실행 시책을 정할 때","잘 팔리는 상품이 왜 팔리는지 수단별로 설명할 때"],"data":["상품 사양·가격표·채널별 판매","광고 접촉률","경쟁 상품의 4P"],"why":"고객이 실제로 접하는 수단은 이 네 가지로 거의 나뉜다. 수단별로 보면 시책이 구체적이 되고, 네 수단이 서로 모순되는지도 보인다.","vsOther":"누구를 노릴지 정해지지 않았다면 4P 전에 STP가 먼저다. 수단을 늘어놓기만 하면 타깃 없는 시책 목록이 된다.","misuse":"네 칸을 각각 아이디어로 채우고 끝내지 않는다. 타깃과 포지션에서 출발해 가장 효과가 큰 수단을 고른다.","bookPage":"관련 대목: p44~45(구매 이유·차별화·구매 채널·인지 가설)","cases":[{"row":35,"part":"Product(상품)","cond":"경쟁이 심한 청량음료에서 특정 브랜드들이 점유율을 늘린 이유를 묻는다면","why":"같은 시장에서 이긴 브랜드의 상품·가격·유통·판촉을 경쟁과 견주면 이긴 이유를 수단별로 설명할 수 있다"},{"row":539,"part":"Price(가격)","cond":"의자에 가격을 매긴다면","why":"원가·고객 지불 의사·경쟁 가격 중 무엇으로 정할지가 가격 결정의 기준이다"},{"row":102,"part":"Place(유통)","cond":"특정 회사의 비즈니스 가방 점유율을 늘린다면","why":"가방은 사는 장소(백화점·EC·양판점)마다 경쟁 상대가 달라, 유통과 판촉부터 견준다"}],"note":null,"notFit":[]},"ansoff":{"id":"ansoff","name":"Ansoff 성장 매트릭스","en":"Ansoff Growth Matrix","question":"기존·새 시장과 기존·새 상품 중 어디서 성장할까?","def":"성장 방향을 시장(기존/신규)과 상품(기존/신규)의 2×2로 나눠, 시장 침투·시장 개발·상품 개발·다각화 중 고르는 성장 전략 틀이다.","parts":[{"name":"시장 침투(기존 시장 × 기존 상품)","means":"지금 고객에게 더 많이 판다","q":"지금 시장에서 점유율·구매 빈도를 더 올릴 여지가 있나?","links":[{"to":"profit_tree","cond":"늘릴 수치(고객 수·빈도·단가)를 정해야 하면","why":"매출 식의 인수로 나눈다"}]},{"name":"시장 개발(새 시장 × 기존 상품)","means":"지금 상품을 새 지역·새 고객층에 판다","q":"지금 상품이 통할 새 지역·고객층이 있나?","links":[{"to":"entry","cond":"새 지역·국가에 들어갈지 판단해야 하면","why":"시장 매력·실현성으로 판단한다"},{"to":"stp","cond":"새 고객층 중 어디를 노릴지 정해야 하면","why":"층별 크기·적합도로 고른다"}]},{"name":"상품 개발(기존 시장 × 새 상품)","means":"지금 고객에게 새 상품을 판다","q":"지금 고객이 해결하지 못한 일이 있나?","links":[{"to":"jtbd","cond":"지금 고객의 채워지지 않은 일을 찾아야 하면","why":"상황별 해결하려는 일을 본다"}]},{"name":"다각화(새 시장 × 새 상품)","means":"새 고객에게 새 상품을 판다","q":"자사 자산(고객·설비·브랜드)을 살릴 수 있나?","links":[{"to":"value_chain","cond":"자사 업무 단계를 새 사업에 나눠 쓸 수 있는지 봐야 하면","why":"공유할 업무 단계(시너지)를 찾는다"},{"to":"entry","cond":"새 사업에 들어갈지 판단해야 하면","why":"진입 판단으로 넘어간다"}]}],"favorable":["성장·확장 방향을 묻는데 어디서 늘릴지 정해지지 않았을 때","성숙 시장이라 기존 사업만으로 늘리기 어려울 때(p46 縦横 확장)"],"data":["기존 시장 점유율·성장률","자사 자산(고객 기반·설비·브랜드)","인접 시장 크기"],"why":"성장 방향을 네 칸으로 나누면 위험이 낮은 순(침투 → 개발 → 다각화)으로 선택지를 견줄 수 있다.","vsOther":"특정 시장에 들어갈지만 묻는다면 Ansoff보다 시장 진입 프레임워크가 직접적이다. Ansoff는 방향을 고르는 단계다.","misuse":"네 칸 모두에 아이디어를 하나씩 채우는 것이 목적이 아니다. 자사 자산과 시장 여지로 칸을 고른다.","bookPage":"관련 대목: p46(縦: 가치사슬 확장, 横: 인접 시장 진출)","cases":[{"row":29,"part":"시장 침투(기존 시장 × 기존 상품)","cond":"후발 약혼반지 회사가 성장하다 실적이 정체했다면","why":"지금 시장에서 더 늘릴 여지가 남았는지부터 보고, 없으면 새 고객층·새 상품으로 칸을 옮긴다"},{"row":622,"part":"시장 개발(새 시장 × 기존 상품)","cond":"고급 초콜릿 회사가 동남아 새 시장에 싼 초콜릿을 낼지 묻는다면","why":"새 시장 × 기존 상품(시장 개발)인지, 새 시장 × 새 상품(다각화)인지 칸이 달라 위험과 필요한 역량이 다르다"},{"row":681,"part":"다각화(새 시장 × 새 상품)","cond":"규동 체인과 시너지를 낼 새 사업을 묻는다면","why":"규동 체인의 자산(점포·조달·고객)을 공유할 수 있는 새 상품·새 시장을 고른다"}],"note":null,"notFit":[]},"profit_tree":{"id":"profit_tree","name":"매출·이익 트리","en":"Revenue · Profit Tree","question":"매출·이익을 만드는 수치 중 무엇이 움직였나?","def":"이익 = 매출 − 비용, 매출 = 고객 수 × 1인당 구매액처럼 항등식으로 목표 수치를 인수로 나누는 틀이다. 인수가 겹치지 않고 곱·합이 목표 수치와 같아야 한다.","parts":[{"name":"매출 측: 고객 수","means":"구매자·이용자·거래 수","q":"사는 사람 수가 줄었나?","links":[{"to":"aidma","cond":"고객 수 감소가 특정 구매 단계 이탈 때문이면","why":"단계별 전환율을 센다"},{"to":"stp","cond":"고객 수 변화가 특정 층에 몰리면","why":"층별로 나눠 노릴 층을 정한다"}]},{"name":"매출 측: 1인당 구매액","means":"단가 × 구매 빈도·개수","q":"한 사람이 쓰는 금액이 줄었나?","links":[{"to":"4p","cond":"단가·구성 변화가 상품·가격 정책 때문이면","why":"상품·가격 수단을 본다"}]},{"name":"비용 측","means":"변동비·고정비","q":"비용이 늘었나?","links":[{"to":"value_chain","cond":"비용 증가가 특정 업무 단계에서 생기면","why":"업무 단계별로 원가를 나눈다"}]}],"favorable":["매출·이익·시장 규모의 수치 목표가 분명할 때","어느 인수가 움직였는지 자료로 확인할 수 있을 때"],"data":["고객 수·단가·빈도의 추이","변동비·고정비 내역"],"why":"항등식으로 나누면 빠짐·겹침 없이 움직인 인수를 찾을 수 있다. 시책이 어느 인수를 바꾸는지도 분명해진다.","vsOther":"인수를 나눈 뒤 '왜 그 인수가 움직였나'는 다른 프레임워크(AIDMA·가치사슬·STP)로 넘긴다. 트리만으로 원인이 설명되지는 않는다.","misuse":"가격과 수량은 서로 영향을 주니 각각 따로 올린다고 해석하지 않는다. 플랫폼은 공급 × 수요의 단순곱으로 쓰지 않는다.","bookPage":"p53(인수 분해)","cases":[{"row":54,"part":"비용 측","cond":"개인택시의 이익이 실차율과 연료비에 좌우된다면","why":"이익 = 운임 수입 − 비용으로 나누면 실차율(수입 측)과 연료비(비용 측) 중 어디를 바꿀지 정해진다"},{"row":200,"part":"매출 측: 고객 수","cond":"주문 요청은 있는데 드라이버가 부족해 성사되지 않는다면","why":"요청 수 × 성사율 × 건당 수익으로 나누고, 드라이버 처리 능력은 성사율의 상한으로만 쓴다"},{"row":14,"part":"매출 측: 고객 수","cond":"과자 회사의 특정 채널에서 진열이 줄어 구매자 수가 줄었다면","why":"채널별 구매자 수 × 1인당 구매액으로 나누면 진열 감소가 매출에 미친 몫을 잴 수 있다"}],"note":null,"notFit":[]},"entry":{"id":"entry","name":"시장 진입 프레임워크","en":"Market Entry","question":"이 시장에 들어갈 만한가, 들어가면 이길 수 있나, 어떻게 들어가나?","def":"진입 판단을 시장 매력(크고 성장하나) → 경쟁 우위(이길 수 있나) → 실현성(역량·투자·방법) → 위험(실패 시 손실·철수) 순으로 묻는 판단 틀이다.","parts":[{"name":"시장 매력","means":"크기·성장·수익성","q":"시장이 충분히 크고 수익이 남나?","links":[{"to":"five_forces","cond":"업계 수익성과 경쟁 압력이 이어질지 봐야 하면","why":"업계 구조로 수익성을 본다"},{"to":"pest","cond":"규제·경제·인구 같은 바깥 조건이 시장을 정하면","why":"바깥 변화를 네 칸으로 본다"}]},{"name":"경쟁 우위","means":"고객이 자사를 고를 이유","q":"기존 회사보다 고객이 우리를 고를 이유가 있나?","links":[{"to":"3c","cond":"고객·경쟁·자사를 함께 견줘야 하면","why":"세 관점으로 우위를 확인한다"},{"to":"stp","cond":"어느 층에서 이길지 정해야 하면","why":"노릴 층과 자리를 정한다"}]},{"name":"실현성","means":"자사 역량·투자·진입 방법(자체·제휴·인수)","q":"자사가 할 수 있고, 어떤 방법으로 들어가나?","links":[{"to":"value_chain","cond":"어느 업무를 자사가 하고 어느 업무를 제휴할지 정해야 하면","why":"업무 단계별로 역량을 본다"}]},{"name":"위험","means":"실패 시 손실과 철수 조건","q":"실패하면 무엇을 잃고, 언제 물러나나?","links":[{"to":"scenario","cond":"결과를 바꾸는 동인이 불확실하면","why":"경우별 손익과 철수 조건을 나눈다"}]}],"favorable":["들어갈지 말지, 어느 나라·어느 시장에 들어갈지를 묻는 문제","진입 방법(자체·제휴·인수·가맹)을 정해야 할 때"],"data":["시장 규모·성장률·이익률","자사 역량과 필요 투자","진입 장벽과 철수 비용"],"why":"진입 목적에서 출발해 시장 → 우위 → 실현성 → 위험 순으로 물으면, 어느 조건이 판단을 가르는지 보인다.","vsOther":"3C는 같은 요소를 보지만 판단 질문의 순서가 없다. 기존 사업 매출을 늘리는 문제라면 매출·이익 트리가 맞다.","misuse":"매력적인 시장이라는 이유만으로 '들어간다'고 결론 내지 않는다. 이길 근거와 실현성이 함께 필요하다.","bookPage":"p40(시장·경쟁 판단)","cases":[{"row":24,"part":"시장 매력","cond":"반도체에 들어갈 목적과 이길 근거를 따져야 한다면","why":"거대 투자가 필요해 시장 매력보다 우위·실현성·위험에서 판단이 갈린다"},{"row":623,"part":"경쟁 우위","cond":"미국 트랙터 회사가 캐나다에 들어갈지 판단할 질문을 묻는다면","why":"인접국이라 시장·고객이 비슷해 보여도 현지 경쟁·유통·규제를 질문으로 나눠야 판단 근거가 된다"},{"row":661,"part":"실현성","cond":"개발도상국에 진출하려는 과자 회사가 검토할 사항을 묻는다면","why":"소득·유통·기호가 달라 시장 매력과 함께 현지 조달·유통 같은 실현성을 빠짐없이 봐야 한다"}],"note":null,"notFit":[]},"scenario":{"id":"scenario","name":"시나리오 분석","en":"Scenario Planning","question":"불확실한 동인의 방향·속도·시점이 갈리면 결과와 대응이 어떻게 달라지나?","def":"결과를 크게 바꾸지만 방향·속도·규모·시점이 불확실한 동인을 골라, 그 동인이 갈리는 경우마다 결과를 그리고 경우별·공통 대응을 정하는 틀이다.","parts":[{"name":"분명한 흐름","means":"전제로 두는 변화(가설 표시)","q":"어느 경우에도 일어날 변화는 무엇인가?","links":[{"to":"pest","cond":"분명한 흐름을 빠짐없이 찾아야 하면","why":"바깥 변화를 네 칸으로 훑는다"}]},{"name":"불확실한 동인","means":"방향·속도·규모·시점이 갈리는 변화","q":"결과를 크게 바꾸는데 갈리는 동인은 무엇인가?","links":[{"to":"pest","cond":"불확실한 동인의 후보를 찾아야 하면","why":"제도·경제·사회·기술에서 후보를 찾는다"}]},{"name":"경우별 결과","means":"동인이 갈린 경우마다의 시장·수요","q":"각 경우에 시장은 얼마나 달라지나?","links":[{"to":"profit_tree","cond":"경우별 시장 규모·매출을 숫자로 내야 하면","why":"인수별로 경우마다 값을 바꿔 추정한다"}]},{"name":"경우별 대응","means":"각 경우에 해 둘 일과 어느 경우에도 할 일","q":"어느 경우에도 해 둘 일은 무엇인가?","links":[{"to":"ansoff","cond":"경우마다 성장 방향이 달라지면","why":"경우별로 성장 칸을 고른다"}]}],"favorable":["장래 예측에서 결과를 바꾸는 동인 중 불확실한 것이 있을 때","한 숫자의 외삽으로는 대응을 정하기 어려울 때"],"data":["동인별 전망 범위","과거 유사 변화의 속도"],"why":"불확실한 동인이 갈리는 경우를 나누면, 어느 경우에도 해 둘 일과 경우별로 다른 일이 갈린다(p38).","vsOther":"동인이 모두 분명하면 시나리오 없이 매출·이익 트리로 추정하면 된다.","misuse":"동인을 두 개 정도로 좁혀 2×2로 그리는 것은 도식을 단순하게 하는 선택이지 적용 조건이 아니다.","bookPage":"p38","cases":[{"row":219,"part":"불확실한 동인","cond":"AI가 업무 단위의 비용을 바꿔 산업 구조가 달라진다면","why":"AI 보급 속도와 대체 범위가 불확실해, 경우별로 커지는 산업과 줄어드는 산업을 나눈다"},{"row":243,"part":"경우별 결과","cond":"50년 뒤 TV 시장을 묻는다면","why":"보는 시간과 화면이 다른 기기로 옮겨 가는 속도가 갈리는 경우마다 TV 수요가 달라진다"},{"row":16,"part":"경우별 대응","cond":"여행사가 대리점형과 웹형 중 어느 방식으로 갈지 묻는다면","why":"웹 이동 속도가 갈리는 경우마다 유리한 방식이 달라, 어느 경우에도 해 둘 일과 경우별 전환 시점을 나눈다"}],"note":null,"notFit":[]}},"fwOrder":["3c","aidma","value_chain","jtbd","five_forces","pest","stp","4p","ansoff","profit_tree","entry","scenario"],"fwApply":{"A01-1":[{"fw":"profit_tree","cond":"매출 = 구매자 수 × 1인당 구매량 × 단가로 채널·용량별 변화를 볼 때"},{"fw":"4p","cond":"편의점·자판기 진열(Place)과 신상품 회전(Product)이 판매를 좌우할 때"},{"fw":"jtbd","cond":"마시는 상황(일하는 중·운동 후)별로 대신 고르는 음료가 다를 때"},{"fw":"stp","cond":"젊은 층처럼 특정 층의 음용이 크게 줄어 그 안의 층을 다시 나눌 때"}],"A01-4":[{"fw":"pro \n以前はインバウンドによる需要の下支えがあり、業績は好調に推移していた。しかしコロナ以降はインパウンドの大幅な需要減、在宅勤務の推奨、個々人の外出提会の大幅減少、マスク着用による化粧に対するライフスタイルの変化等により、化粧品業界全体として苦戦している。今後インバウンド需要が再度回復するかは不透明であると想定している。直近の業績はやや回復基調ではあるが、コロナ感染者の増減状況もなかなか落ち着かず先行き不透明であり、抜本的な回復には至っていない。\n特に日本全体の化粧品市場をみると、外資系企業含む競合化粧品メーカーとの競争が激化している。\n\n【皆様に取り組んで頂きたいこと】\n日系化粧品メーカーの中から、1社を仮のクライアントとして選定してください。\n仮のクライアントである日系化粧品メーカーの経営企画を担当する取締(経営者)に対して、今後の中期経営計画立案に資する具体的な経営施策とその施策毎の実行計画概要を考え、それらを提案・プレゼンテーションしてください。(施策は複数でも構いません)\nその提案の前提となる取り巻く環境や現状の事業状況分析や事業上の課題分析等についても調査・整理した上で、あわせて提案・プレゼンテーションしてください。","rows":[{"row":471,"company":"EY","stage":null,"format":"ロングＧＤ","tag":null,"time":null,"memo":null}],"sub":"A02-2","mode":"case","types":["growth"],"fermi":null,"also":[],"exclude":null,"review":false,"scenario":null,"titleInC":false,"fund":false,"note":"","arch":"A02","similar":[],"title":null,"scope":null},{"id":472,"rawSame":true,"text":"「機械製造会社における利益率向上施策」","rows":[{"row":472,"company":"EY","stage":null,"format":"ロングＧＤ","tag":null,"time":null,"memo":"全部で2.5時間 \n\n面接官説明→ブレイクアウトルームでGD(80分) \n→全体で発表、質疑応答"}],"sub":"A04-2","mode":"case","types":["profit"],"fermi":null,"also":[],"exclude":null,"review":false,"scenario":null,"titleInC":false,"fund":false,"note":"","arch":"A04","similar":[],"title":null,"scope":null},{"id":473,"rawSame":true,"text":"「とある航空業界のクライアントに対し、テクノロジーを用いたビジネス創出のコンサルをせよ」","rows":[{"row":473,"company":"EY","stage":null,"format":"ロングＧＤ","tag":null,"time":null,"memo":null}],"sub":"A12-1","mode":"case","types":["ideate"],"fermi":null,"also":[],"exclude":null,"review":false,"scenario":null,"titleInC":false,"fund":false,"note":"신사업 발상(교과서 감사)","arch":"A12","similar":[],"title":null,"scope":null},{"id":474,"rawSame":true,"text":"ミレニアム・Z世代のチャレンジを応援するために、金融機関が果たすべき役割（金融商品、サービス、市場形成etc）について検討してください。 \n\n","rows":[{"row":474,"company":"EY","stage":null,"format":"ロングＧＤ","tag":null,"time":null,"memo":null}],"sub":null,"mode":"case","types":["public"],"fermi":null,"also":[],"exclude":"finance","review":false,"scenario":null,"titleInC":false,

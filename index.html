:"날씨·자원·시황이 생산과 가격을 흔든다.","subs":["A14-1","A14-3"]}],"contrast":"세 대표는 수요가 생기는 방식과 돈이 들어오는 경로가 모두 다르다. 브랜드 음료는 마시면 없어져 다시 사는 소진형이다. 에어컨은 보유 대수와 교체 시기가 수요를 만든다. 엘리베이터는 설치한 뒤 수십 년 보수 계약으로 돈을 번다. 같은 「제조업」이라도 첫 질문이 각각 「누가 얼마나 자주 고르나」, 「언제 바꾸나」, 「설치 뒤 누가 지키나」로 갈린다.","deep":["brand-drink","aircon","elevator"]},{"id":"G2","name":"매장·공간·시설","common":"고객이 특정 장소에 와서 이용한다. 입지, 운영, 공간과 시간의 배분이 공통 쟁점이다.","kinds":[{"name":"소매","note":"면적과 상권이 품목 구성을 정한다.","subs":["A05-1","A05-2","A05-3"]},{"name":"외식","note":"좌석·주방 처리 능력과 이용 상황이 매출을 정한다.","subs":["A06-1","A06-2","A06-3"]},{"name":"회원 시설","note":"가입과 이용 빈도가 따로 움직인다.","subs":["A08-1"]},{"name":"숙박·레저","note":"오늘 팔지 못한 객실·좌석은 사라진다.","subs":["A11-1","A11-3"]},{"name":"공간 임대","note":"공간을 기간이나 시간 단위로 빌려준다.","subs":["A13-1","A13-2"]}],"contrast":"세 대표 모두 고객이 장소에 와야 매출이 생기지만, 공간을 파는 방식이 다르다. 편의점은 좁은 매장 면적을 어떤 상품에 배분하느냐로 승부한다. 카페는 좌석과 체류 시간, 이용 목적이 매출을 정한다. 호텔은 오늘 팔지 못한 객실이 사라지므로 가동률과 단가를 함께 관리한다.","deep":["cvs","cafe","hotel"]},{"id":"G3","name":"인력·프로젝트","common":"사람의 시간·전문성·공정이 제공 가치와 처리 능력의 중심이다.","kinds":[{"name":"교육","note":"이용자와 결정자가 다를 수 있고 대상 연령 인구가 수요를 묶는다.","subs":["A07-1"]},{"name":"의료·웰니스","note":"결정자·지불자가 분리되고 가격이 제도로 정해지는 부분이 있다.","subs":["A07-2"]},{"name":"생활 서비스","note":"시술자 수와 회전 시간이 매출의 상한이다.","subs":["A07-3"]},{"name":"전문 프로젝트","note":"인력 가동률과 수주가 매출을 묶는다.","subs":["A07-4"]},{"name":"건설·개발","note":"수주·공정·착공에서 인도까지의 시차가 쟁점이다.","subs":["A13-3","A13-4"]}],"contrast":"세 대표 모두 사람이 서비스를 만들지만, 결정하는 사람과 공급의 한계가 다르다. 학원은 이용자(학생)와 결정자(부모)가 다르고 강사가 질을 정한다. 저가 커트 전문점은 시술자 수와 회전 시간이 매출의 상한이다. 병원은 환자가 아닌 의사·제도가 진료 내용과 가격에 크게 관여한다.","deep":["juku","lowcut","hospital"]},{"id":"G4","name":"이동·공급 인프라","common":"차량·망·설비로 이동·연결·공급을 제공한다. 용량, 배치, 가동과 운영 원가가 공통 쟁점이다.","kinds":[{"name":"여객","note":"피크 혼잡과 비피크 공석이 함께 있다.","subs":["A12-1","A12-2"]},{"name":"물류","note":"인력·차량과 배송 밀도가 처리량을 정한다.","subs":["A12-3"]},{"name":"차량·자산 대여","note":"거점·시간대별 가동률 편차가 쟁점이다.","subs":["A09-3"]},{"name":"통신","note":"요금제 구성과 망 비용을 함께 본다.","subs":["A08-2"]},{"name":"전력·에너지","note":"발전과 소매가 나뉜 시장 구조를 먼저 확인한다.","subs":["A14-2"]}],"contrast":"택시는 호출이 생긴 장소·시간에 차량을 맞춘다. 택배는 경로 안에서 배송을 묶어 기사 시간을 절약한다. 통신은 요금제별 이용량·이동과 네트워크 원가를 함께 본다. 같은 인프라여도 가동 단위와 혼잡이 생기는 방식이 다르다.","deep":["taxi","parcel","mobile"]},{"id":"G5","name":"콘텐츠·디지털","common":"작품·권리·소프트웨어·정보를 만들고 배포해 이용하게 한다. 고정비 회수와 이용 정착이 공통 쟁점이다.","kinds":[{"name":"영상·디지털 이용","note":"과금 방식(구독·작품별·광고)을 먼저 확인한다.","subs":["A08-3"]},{"name":"업무 소프트웨어","note":"기업 업무에 정착해야 가치가 생긴다.","subs":["A08-4"]},{"name":"신문·출판","note":"종이와 디지털, 구독과 광고의 수익이 함께 있다.","subs":["A10-1"]},{"name":"콘텐츠 제작·IP","note":"흥행 불확실성과 여러 창구의 회수가 쟁점이다.","subs":["A10-2"]}],"contrast":"영상은 작품이 유입을 만들고 그 뒤의 이용 경험이 잔존을 만든다. 게임회사는 기기 보급과 소프트·IP 회수가 서로 영향을 준다. 업무용 SaaS는 기업 업무에 실제로 정착해야 가치가 생긴다. 디지털이라는 이유로 셋을 구독·해지 하나로 풀지 않는다.","deep":["streaming","games","saas"]},{"id":"G6","name":"중개·광고","common":"거래 상대·상품·고객의 관심을 잇는 접점을 제공하고, 연결의 가치로 수익을 얻는다.","kinds":[{"name":"거래·매칭 중개","note":"참여자의 밀도가 거래를 정한다. EC 문제는 중개형인지 직접 판매인지 원문에서 확인한다.","subs":["A09-1","A09-2"]},{"name":"여행 중개","note":"직접 예약 대신 중개를 쓰는 이유가 쟁점이다.","subs":["A11-2"]},{"name":"광고","note":"광고주가 사는 것은 도달인가, 측정 가능한 효과인가.","subs":["A10-3"]}],"contrast":"여행 중개는 탐색·조합·예약 후 지원의 가치를, 배달은 지역 안 세 참여자의 동시 연결을, 옥외광고는 특정 장소에서의 도달과 행동 기여를 판다. 거래액·중개 수입·광고주의 성과를 구별한다.","deep":["travel","delivery","outdoor"]}],"public":{"id":"P","name":"공공·조직","common":"판매가 아니라 정책·조직의 목표를 다룬다. 진짜 과제 → 분해 → 병목 → 시책의 틀을 쓴다.","kinds":[{"name":"공공·조직 운영","note":"","subs":["A15-1","A15-2","A15-3","A15-4","A15-5","A15-6","A15-7","A15-8"]},{"name":"관광 수요 유치(정책)","note":"","subs":["A11-4"]}]},"rowAlso":{"509":["P"],"606":["P"]},"allowDomains":["j-sda.or.jp","jema-net.or.jp","n-elekyo.or.jp","family.co.jp","jfnet.or.jp","mlit.go.jp","mhlw.go.jp","stat.go.jp","uber.com","dcaj.or.jp","unext-hd.co.jp","j-com.co.jp","nintendo.co.jp","freee.co.jp","tokyu-store.co.jp","dentsu.co.jp"],"order":["brand-drink","aircon","elevator","cvs","cafe","hotel","juku","lowcut","hospital","taxi","parcel","mobile","streaming","games","saas","travel","delivery","outdoor"],"items":[{"id":"brand-drink","group":"G1","name":"브랜드 음료","subs":["A01-1"],"scope":"편의점·슈퍼·자판기에서 팔리는 차·커피·유산균 음료 같은 브랜드 청량음료. 원문은 BOSS·おーいお茶·カルピス처럼 여러 브랜드를 함께 다룬다.","character":"마시면 없어져 다시 사는 소진형 상품이다. 가게 선반 앞에서 몇 초 만에 고르기 때문에 「떠오르는가」와 「진열돼 있는가」가 매출을 크게 좌우한다. 기능 차이가 작아 금방 따라 만들 수 있으므로, 오래 팔리는 브랜드는 왜 모방되지 않는지가 핵심 질문이 된다.","firstQs":["매출이 정체·성장한 것은 처음 사 보는 사람(침투) 때문인가, 다시 사는 사람의 빈도 때문인가?","그 브랜드가 팔리는 채널(편의점·슈퍼·자판기·EC)별로 진열 확보와 판매 속도는 어떤가?"],"lenses":[{"name":"헤비 사용자와 라이트 사용자를 나눠 본다","hypothesis":"매출의 상당 부분이 자주 마시는 일부 사용자에게서 나오고, 라이트층은 가끔 집어 드는 정도일 수 있다.","when":"음용 빈도 차이가 크다고 볼 근거가 있을 때. 페르미에서도 영향이 큰 인수만 나눈다.","split":"사용자층(헤비/라이트) × 음용 빈도 × 1회 구매량. 헤비층은 빈도 유지, 라이트층은 시용과 상기가 레버다.","data":"구매 빈도 분포, 브랜드별 반복 구매율, 채널별 판매 수량","refute":"빈도 분포가 고르게 퍼져 있다면 층을 나누는 의미가 작다. 이때는 채널·진열 쪽을 먼저 본다."},{"name":"롱셀러가 모방되지 않는 이유를 찾는다","hypothesis":"오래 팔리는 브랜드는 선발 브랜드 인지, 원가 우위, 판로 확보 중 무엇인가 때문에 모방이 어렵다.","when":"문제가 「롱셀러를 만들라」 또는 「왜 점유를 늘렸나」처럼 지속성을 묻는 경우.","split":"모방 장벽 후보: 브랜드 인지(선발 우위) / 원가·규모 / 진열·판로 / 맛·습관","data":"출시 시기와 경쟁 브랜드의 진입 시기, 채널별 진열 점유, 광고 투입 추이","refute":"경쟁 브랜드가 같은 장벽을 이미 갖고 있다면, 그 장벽으로는 차이를 설명하지 못한다."},{"name":"시장을 다시 정의한다","hypothesis":"차 음료의 경쟁 상대가 다른 차 브랜드가 아니라 물·커피·탄산일 수 있다.","when":"품목 전체가 줄거나 정체할 때, 또는 점유율만으로 답이 나오지 않을 때.","split":"「무슨 시장인가」(같은 갈증 해소 상황의 대체재 포함) → 「어느 시장을 노리나」 → 「어떻게 이기나」","data":"품목별 생산량 추이, 이용 상황별 선택 대안","refute":"과제의 목표와 대체 행동이 이미 분명하다면 시장 재정의의 우선순위는 낮다. 책은 미네랄워터 시장(いろはす)을 그런 예로 들었지만, 그 시장이 늘 자명하다는 규칙은 아니다."}],"causal":{"cause":"라이트층이 매장에서 브랜드를 떠올리지 못해 다른 음료를 고른다(가설).","action":"구매 직전 접점(편의점 진열, 자판기 전면 배치, 계절 한정 패키지)에 노출을 집중한다.","effect":"매장에서 상기율이 오르고 시용이 늘어난다. 맛이 맞으면 반복 구매로 이어진다.","metric":"채널별 판매 수량, 신규 구매자 비율, 3개월 내 재구매율","conditions":"진열 공간을 얻으려면 소매와의 거래 조건(가격·판촉비)을 감당해야 한다. 판촉비 부담과 가격 인하 압력이 부작용이다. 한정 상품이 기존 상품의 매출을 깎을 수도 있다."},"trends":[{"fact":"2025년 茶系飲料 생산량은 5,611,400kl, 전년 대비 99.4%였다. 청량음료 품목 가운데 생산량이 가장 많다.","apply":"응용 가설: 품목 생산량이 정체에 가깝다면 「차 시장 전체가 커진다」는 전제를 두지 않는다. 다만 생산량 통계는 금액 시장의 증감을 보여 주지 않으므로, 브랜드 탈취만이 성장책이라고 결론 내리지 않는다. 가격·이용 상황 확대도 함께 검토한다.","source":{"publisher":"全国清涼飲料連合会","title":"清涼飲料水統計2026","url":"https://j-sda.or.jp/statistically-information/pdf/2026jsda_databook.pdf","period":"2025년(1~12월)","published":null},"checked":"2026-11-20","status":"verified","loc":"p1 「清涼飲料水品目別生産量推移(2021～2025年)」 표","limit":"생산량(kl)이며 판매액·소비량이 아니다. 차 안의 무당차·녹차 구분은 이 쪽에 없다."},{"fact":"같은 통계에서 2025년 ミネラルウォーター類는 전년 대비 96.7%, 炭酸飲料는 97.0%, コーヒー飲料等은 98.8%였다. 주요 품목이 모두 전년보다 줄었고, 茶系飲料의 감소폭(99.4%)이 가장 작았다.","apply":"응용 가설: 생산량 감소가 품목 전체에 걸쳐 있다면 개별 브랜드 부진을 「브랜드 탓」만으로 볼 수 없다. 시장 요인과 브랜드 요인을 나눠 본다.","source":{"publisher":"全国清涼飲料連合会","title":"清涼飲料水統計2026","url":"https://j-sda.or.jp/statistically-information/pdf/2026jsda_databook.pdf","period":"2025년(1~12월)","published":null},"checked":"2026-11-20","status":"verified","loc":"p1 같은 표","limit":"품목 간 비교는 생산량 기준이다. 브랜드별 수치가 아니다."}],"pdf":[{"page":"p38","kind":"direct","note":"롱셀러 상품의 특징을 구체 예에서 귀납한다. 「모방되지 않았기 때문에 롱셀러가 됐다」는 대우로 선발 우위·원가 우위를 찾는다(예: ポカリスエット, カップヌードル)."},{"page":"p56","kind":"direct","note":"페르미 세그먼트는 영향이 큰 인수만 소비 행동으로 나눈다. 「愛飲者は週に数本飲むが、多くの人は稀にしか飲まない」."},{"page":"p53","kind":"direct","note":"스토리라인 최상단을 「무슨 시장인가 → 어느 시장을 노리나 → 어떻게 이기나」로 둔다. 저자는 재정의가 필요 없는 예로 ミネラルウォーター市場(いろはす)을 든다."},{"page":"p62","kind":"method","note":"상재가 코모디티인지 차별화 상품인지, 제품 수명주기 어느 단계인지에 따라 전략 방향이 달라진다."}],"problems":[{"row":35,"cond":"BOSS·おーいお茶·カルピス가 왜 점유를 늘렸는지와 지속 시책을 묻는다. 롱셀러의 모방 장벽 관점이 맞는 문제다. 162는 같은 주제다."},{"row":49,"cond":"세 브랜드의 성장 분석과 3년 안에 점유 5할 확대. 헤비/라이트와 채널을 함께 본다."},{"row":335,"cond":"롱셀러 상품을 만드는 방법. p38의 귀납 방법이 직접 쓰인다."},{"row":126,"cond":"롱셀러가 되는 청량음료 만들기. 차에 한정되지 않는다."}],"cautions":["원문 문제는 차 단독이 아니라 여러 브랜드 음료를 다룬다. 차의 생산 통계를 다른 브랜드의 사실로 옮기지 않는다."]},{"id":"aircon","group":"G1","name":"에어컨","subs":["A03-1"],"scope":"가정용 룸에어컨. 제조사의 국내 판매가 대상이다.","character":"한 번 사면 10년 안팎 쓰는 내구재다. 이미 보급된 품목이라면 판매의 중심은 새로 사는 집보다 바꾸는 집이다. 기능 차이가 작아 코모디티에 가깝다고 보기 쉽지만, 규제 기한이나 기후처럼 교체 시기를 앞당기는 바깥 요인이 있으면 수요가 한꺼번에 움직인다.","firstQs":["판매가 신규 보유에서 나오는가, 기존 보유분의 교체에서 나오는가? 보급률과 사용 연수는 어떤가?","교체를 앞당기거나 늦추는 계기(고장, 규제, 기온, 이사)는 무엇인가?"],"lenses":[{"name":"보유 대수와 교체 주기로 수요를 본다","hypothesis":"보급률이 높다면 연간 판매는 대체로 보유 대수 ÷ 사용 연수에 가깝다.","when":"보급률이 높은 품목의 시장 규모나 성장 여지를 묻는 경우.","split":"보유 세대 × 1세대 보유 대수 ÷ 사용 연수(교체) + 신규 보유(신축·첫 구입) + 추가 구입(방 늘리기). 이사는 기존 기기 이전·교체·추가 구입 중 무엇인지 나눠 중복으로 세지 않는다.","data":"보급률·보유 대수, 평균 사용 연수, 신축 착공 수","refute":"보급률이 낮은 지역·해외라면 신규 보유가 중심이라 이 분해가 맞지 않는다."},{"name":"정해진 조건(定数)과 바꿀 수 있는 조건(変数)을 나눈다","hypothesis":"기본 기능의 차이로는 더 늘릴 여지가 작고, 특정 조건(고온 대응, 오래 쓴 고령 세대의 교체)에 여지가 있다.","when":"성숙기 상품의 매출 향상 문제. 책의 주 예제와 같은 구조다.","split":"제품 전략(기능·정서 가치) / 판매 전략(채널·대상) 중 어느 쪽이 변수인가. 변수 쪽에만 시책을 낸다.","data":"제조사 간 기능 차이, 고장·사용 연수 분포, 판매 채널 구성","refute":"경쟁사도 같은 기능을 갖췄다면 그 기능으로 얻는 영향도는 작아진다. 다만 그것만으로 자사의 개선이 불가능하다는 뜻은 아니므로, 영향도와 실행 가능성의 근거로 판단한다."},{"name":"규제·기후가 만드는 앞당긴 수요와 반동을 본다","hypothesis":"규제 기한 전에 앞당겨 산 만큼 다음 해에 반동 감소가 올 수 있다.","when":"출하가 비정상적으로 늘거나 줄 때, 장래 예측을 묻는 경우.","split":"지금 시기: 수요 = 정상 교체분 + 앞당긴 교체분 − 같은 시기에 이월된 감소분. 다음 시기: 수요 = 다음 시기의 정상 교체분 − 이미 앞당겨 산 물량.","data":"월별 출하 대수, 규제의 목표 연도, 기온","refute":"앞당긴 수요가 아니라 보급률 자체가 오른 것이라면 반동은 작다."}],"causal":{"cause":"오래된 에어컨을 쓰는 고령 세대가 바꿀 계기를 찾지 못한다(책 예제의 가설).","action":"고장 전 점검·교체 제안을 지역 판매점·설치 업체와 함께 한다. 설치 공사 일정과 철거까지 묶는다.","effect":"교체 시기가 앞당겨진다. 교체 수요를 경쟁사보다 먼저 잡는다.","metric":"교체 판매 대수, 사용 연수 10년 이상 세대의 교체율, 설치 대기 일수","conditions":"설치 인력이 성수기에 부족하면 판매를 늘려도 설치가 따라가지 못한다. 앞당긴 수요는 다음 해 반동을 키울 수 있다."},"trends":[{"fact":"2026년 10월 ルームエアコン 국내 출하는 751천 대, 전년 대비 158.7%였다. 10월 단월로 역대 최고이고 10개월 연속 두 자릿수 증가다. JEMA는 「省エネ法の目標年度を前にした需要の高まり」가 출하를 밀어 올렸다고 설명한다.","apply":"응용 가설: 지금의 증가는 규제 기한 앞의 앞당긴 교체를 포함한다. 장래 예측에서는 기한 뒤의 반동을 함께 넣는다. 책 예제의 「성숙기라 성장이 어렵다」는 출판 시점의 판단이며 현재 사실로 쓰지 않는다.","source":{"publisher":"日本電機工業会(JEMA)","title":"民生用電気機器 2026年10月度 国内出荷実績","url":"https://www.jema-net.or.jp/stat/evefa20000004jb4-att/2610ds-comment.pdf","period":"2026년 10월","published":"2026-11-19"},"checked":"2026-11-20","status":"verified","loc":"p1 「【概況】」와 「主要製品の国内出荷(数量)」","limit":"JEMA 회원 기준 출하 통계이며 판매 대수·보급률이 아니다. 원인 설명은 협회의 해석이다."},{"fact":"같은 자료에서 10월 ルームエアコン 출하 금액은 711억 엔, 전년 대비 158.6%였다. 같은 달 전기냉장고는 94.9%로 감소했다.","apply":"응용 가설: 같은 백색가전이라도 품목별로 움직임이 다르다. 에어컨만의 요인(규제 기한, 여름 기온)을 따로 확인한다.","source":{"publisher":"日本電機工業会(JEMA)","title":"民生用電気機器 2026年10月度 国内出荷実績","url":"https://www.jema-net.or.jp/stat/evefa20000004jb4-att/2610ds-comment.pdf","period":"2026년 10월","published":"2026-11-19"},"checked":"2026-11-20","status":"verified","loc":"p1 「【概況】」","limit":"출하 금액은 제조사 출하가 기준이다."}],"pdf":[{"page":"p6–11","kind":"direct","note":"「大手家電メーカーのエアコン事業の売上向上施策」 예제. 성숙기·코모디티 판단, 정해진 조건과 바꿀 조건 분리, 고온 대응 실외기와 고령 세대 교체, 영향도·해결 가능성·새로움에 따른 걸러내기."},{"page":"p52","kind":"direct","note":"고온 대응 실외기라는 시책을 먼저 떠올리면 기능 가치에도 과제가 있다고 거꾸로 말할 수 있다."},{"page":"p62","kind":"method","note":"코모디티 상재의 싸우는 방법과 제품 수명주기."}],"problems":[{"row":384,"cond":"에어컨 회사의 매출 향상. 책 예제와 같은 구조로 정해진 조건과 바꿀 조건을 나눈다."},{"row":142,"cond":"국내 가정용 에어컨 시장 규모(페르미). 보유 대수 ÷ 사용 연수로 교체 흐름을 세운다."}],"cautions":["책의 「에어컨은 성숙기」, 「특정 기온 이상 대응」 같은 시장 사실은 출판 시점의 가설이다."]},{"id":"elevator","group":"G1","name":"엘리베이터","subs":["A04-2"],"scope":"건물용 승강기 제조사. 신규 설치, 보수, 교체(リニューアル)를 함께 한다.","character":"설치가 끝난 뒤에도 수십 년 동안 보수 계약으로 돈이 들어온다. 신규 설치는 건물 착공에 달려 있고, 보수는 이미 설치한 대수와 계약 유지에 달려 있다. 같은 회사 안에서도 두 매출의 늘리는 방법이 다르다.","firstQs":["이 회사의 매출과 이익은 신규 설치·보수·교체 가운데 어디서 주로 나오는가?","자사가 설치한 엘리베이터를 자사가 계속 보수하고 있는가, 다른 보수 업체로 넘어가고 있는가?"],"lenses":[{"name":"신규 설치와 보수를 나눠서 논의한다","hypothesis":"보수 매출이 더 크고 안정적이라면, 성장 시책도 보수 쪽에서 찾아야 한다.","when":"「1대가 평생 버는 이익」이나 회사 전체의 매출 향상을 묻는 경우.","split":"신규: 착공 건수 × 수주율 × 단가 / 보수: 대상 설치 기반(자사 설치분과 수주 가능한 타사 설치분) × 보수 계약 점유·유지율 × 계약 단가 / 교체: 설치 후 연수가 도래한 대수 × 교체율 × 단가","data":"신규 설치 대수, 보수 대수, 사업별 매출·이익 구성","refute":"착공이 급증하는 시장(신흥국 등)이라면 신규 설치가 변수가 된다."},{"name":"설치 기반을 지키는 이유를 본다","hypothesis":"보수 업체를 바꾸는 이유는 가격이거나 고장 대응 속도일 수 있다.","when":"보수 매출이 줄거나 독립계 보수 업체가 늘었다는 단서가 있을 때.","split":"이탈 이유: 가격 / 출동·복구 시간 / 부품 공급 / 관리 회사의 일괄 발주","data":"자사 설치분 중 자사 보수 비율, 해지 사유, 정지 시간","refute":"이탈이 거의 없다면 유지가 아니라 단가나 교체 쪽이 쟁점이다."},{"name":"교체 시기를 사업 기회로 본다","hypothesis":"오래된 설치분이 한꺼번에 교체 시기를 맞으면 교체 수요가 신규 설치보다 커질 수 있다.","when":"건물 착공이 늘지 않는데 매출을 늘려야 할 때.","split":"설치 연도별 대수 → 교체 시기가 오는 대수 × 교체율 × 단가","data":"설치 연도별 대수, 교체 실적, 건물 소유자의 투자 계획","refute":"건물 자체의 철거·재건축이 많다면 교체 대신 신규 설치로 잡힌다."}],"causal":{"cause":"정지 손실과 총비용을 중시하는 건물 관리자가 고장 대응 속도에 불만을 갖고 저가 보수 업체로 바꾼다(가설).","action":"그런 고객군에 원격 감시를 붙여 고장 징후를 먼저 잡고, 정지 시간 실적을 보여 준다.","effect":"정지 손실을 중시하는 고객에게는 보수 업체를 바꿀 이유가 약해진다. 계약 유지율이 오르는지 그 고객군에서 검증한다.","metric":"대상 고객군의 보수 계약 유지율, 실제 정지 시간, 출동 건수","conditions":"원격 감시 설비 투자, 출동 비용, 현장 안전을 함께 본다. 가격만 보고 이탈하는 고객에게는 이 인과가 통하지 않는다. 가격 인하로 대응하면 보수 이익이 줄어든다."},"trends":[{"fact":"2025년도(2025-04-01~2026-03-31 완료 검사분) 신규 설치 대수는 전 기종 합계 22,805대로, 전년도 24,190대보다 줄었다. 이 가운데 엘리베이터는 20,630대다.","apply":"응용 가설: 신규 설치는 건물 착공에 따라 해마다 오르내린다. 신규 설치에 기대는 성장 가설은 착공 동향을 먼저 확인한다.","source":{"publisher":"一般社団法人日本エレベーター協会","title":"Elevator Journal No.60 「2025年度昇降機設置台数等調査結果報告」","url":"https://www.n-elekyo.or.jp/about/elevatorjournal/pdf/Journal60_01_1.pdf","period":"2025년도","published":"2026-08"},"checked":"2026-11-20","status":"verified","loc":"p1 「１．調査概要」, 신규 설치 도도부현별 표의 총계 행과 연도 비교 표","limit":"협회 정회원 90사 보고분이며 비회원 업체는 빠진다. 22,805대는 엘리베이터·에스컬레이터 등 전 기종 합계다."},{"fact":"2026년 3월 31일 현재 협회 회원이 보수하는 대수는 전 기종 합계 896,364대이고, 이 가운데 엘리베이터가 781,621대다.","apply":"응용 가설: 한 해 신규 설치(전 기종 약 2만 3천 대)에 비해 보수 대상 설치 기반이 훨씬 크다. 매출 구성은 회사마다 확인할 사실이지만, 설치 기반을 지키는 관점이 왜 중요한지 보여 준다.","source":{"publisher":"一般社団法人日本エレベーター協会","title":"Elevator Journal No.60 「2025年度昇降機設置台数等調査結果報告」","url":"https://www.n-elekyo.or.jp/about/elevatorjournal/pdf/Journal60_01_1.pdf","period":"2026-03-31 현재","published":"2026-08"},"checked":"2026-11-20","status":"verified","loc":"보수 대수 도도부현별 표의 총계 행","limit":"대수이며 매출이 아니다. 회원사가 보수하는 대수만 포함한다. 896,364대는 전 기종, 781,621대는 엘리베이터다."}],"pdf":[{"page":"p63","kind":"direct","note":"B2B는 비즈니스 모델과 캐시 포인트를 정리해야 한다. 엘리베이터 회사의 매출 향상은 신규 도입과 보수가 있고 후자가 더 크다. 신규 도입 시책과 이탈 방지 시책은 다르므로 나눠서 논의한다. 「客数客単価レベルの解像度で議論すると、ピントがボケて不合格になる」."}],"problems":[{"row":86,"cond":"엘리베이터 1대가 평생 버는 이익과 회사의 매출 향상. 신규 설치와 보수를 나눈 분해가 직접 맞는다."}],"cautions":["「보수가 신규보다 크다」는 책의 주장이다. 특정 회사의 현재 매출 구성으로 단정하지 않는다."]},{"id":"cvs","group":"G2","name":"편의점","subs":["A05-1"],"scope":"체인 편의점 본부와 가맹점. 원문에는 상품 매출 추정, 무인 매장, 코로나 시기 대응, 커피 서버, 사업 인수 문제가 있다.","character":"매장 면적이 작아 놓을 수 있는 상품 수에 한계가 있다. 그래서 「어떤 상품에 진열 공간을 주나」가 매출을 정한다. 집이나 직장 근처에서 자주 들르는 가게라 입지와 상권이 중요하고, 결제·택배·커피처럼 상품이 아닌 서비스로 방문 이유를 더한다.","firstQs":["이 매장(또는 상품)의 매출 변화는 방문 고객 수에서 왔는가, 한 번 방문할 때의 구매에서 왔는가?","한정된 진열 공간에서 어떤 카테고리를 늘리고 줄일 것인가? 그 판단의 근거는 무엇인가?"],"lenses":[{"name":"면적을 어떤 카테고리에 줄지 본다","hypothesis":"면적당 이익이 낮은 카테고리를 줄이고 회전이 빠른 즉석식품이나 커피를 늘리면 매장 이익이 오를 수 있다.","when":"매장 단위의 매출·이익 향상, 새 상품이나 서비스를 넣을지 묻는 경우.","split":"카테고리별 면적 × 면적당 매출 × 이익률. 늘릴 후보와 줄일 후보를 함께 낸다.","data":"카테고리별 판매·폐기, 진열 면적, 시간대별 판매","refute":"방문 이유가 되는 상품(담배·음료 등)을 줄이면 방문 자체가 줄 수 있다. 면적당 수치만으로 판단하지 않는다."},{"name":"방문 이유를 서비스로 더한다","hypothesis":"상품이 아닌 서비스(커피, 결제, 택배 수취)가 방문 빈도를 올리고 함께 사는 상품을 늘린다.","when":"방문 고객 수가 줄었거나, 새 사업·결합을 묻는 경우(커피 서버, 배터리 사업).","split":"도입 전후와 대조 점포를 비교한다. 효과 = 새로 생긴 방문 수 × 방문 1회 평균 구매의 공헌이익 + 기존 방문에서 늘어난 동반 구매의 공헌이익 − 인력·서비스 비용 − 진열 기회비용. 본부와 가맹점의 손익을 따로 본다.","data":"도입 점포와 대조 점포의 방문 수·객단가 추이, 서비스 운영 비용, 줄어든 진열 면적의 이익","refute":"서비스 이용자와 비이용자를 단순 비교하면 원래 자주 오는 고객이 이용자로 잡혀 효과가 부풀려진다. 대조 점포와 차이가 없으면 증분 효과가 없다고 본다."},{"name":"입지와 상권을 먼저 확인한다","hypothesis":"같은 체인이라도 상권(오피스·주택·역)마다 시간대와 잘 팔리는 상품이 다르다.","when":"특정 지역 매장(赤坂, 대학 구내 등)의 문제일 때.","split":"상권 유형 → 시간대별 고객층 → 그 고객층의 구매 목적","data":"시간대별 고객 수, 상권 인구 구성, 경쟁 매장 위치","refute":"상권 차이와 무관한 전국 공통 요인(가격 인상, 날씨)이 크면 입지 분석보다 그쪽이 먼저다."}],"causal":{"cause":"오피스 상권 매장에서 재택근무 확대로 점심 시간대 고객이 줄었다(가설).","action":"점심 진열을 줄이고 아침·저녁 즉석식품과 생활용품의 면적을 늘린다.","effect":"줄어든 시간대의 손실을 다른 시간대 판매로 메운다. 폐기도 줄어든다.","metric":"시간대별 매출, 카테고리별 면적당 이익, 폐기율","conditions":"본부의 상품 공급과 발주 체계가 매장별 조정을 허용해야 한다. 가맹점 인력이 부족하면 즉석식품 확대가 운영 부담이 된다."},"trends":[{"fact":"2026년 10월 ファミリーマート 기존점 일매출은 전년 대비 103.0%, 객수 100.1%, 객단가 103.0%였다. 회사는 기존점 객수가 15개월 만에 전년을 넘었다고 밝혔다. 기존점 전년비는 카드·티켓의 영향을 제외한 값이다.","apply":"응용 가설: 한 체인의 수치이며 편의점 시장 전체가 아니다. 객단가가 매출을 끌고 객수는 겨우 전년 수준이라면, 방문 이유를 더하는 시책의 효과는 객수 지표로 따로 확인한다.","source":{"publisher":"株式会社ファミリーマート","title":"月次営業実績(速報) 2026年10月度","url":"https://www.family.co.jp/company/familymart/monthly_sales/flash.html","period":"2026년 10월","published":"2026-11-10"},"checked":"2026-11-20","status":"verified","loc":"웹 페이지 「営業実績(国内：単体ベース)」 표와 주석","limit":"국내 단체(単体) 기준 한 체인의 속보다. 업계 전체(JFA 월보)는 원문이 열리지 않아(403) 쓰지 않았다."},{"fact":"같은 달 월차 보고서는 9월부터 이어 온 「朝ファミマのコンビ割」(아침 묶음 할인)가 아침 시간대를 중심으로 지속적인 방문 동기를 만들었다고 적었다. 카운터 상품은 「ファミチキ」 20주년 상품과 「プレミアムモカ」(누계 150만 잔) 등 주력 상품 시책이 호조였다고 밝혔다.","apply":"응용 가설: 시간대 한정 묶음 할인과 카운터 상품은 진열 면적을 크게 쓰지 않고 방문 이유를 더하는 시책이다. 효과는 회사 설명이므로, 증분 방문은 대조 점포나 도입 전후 비교로 확인할 사실이다.","source":{"publisher":"株式会社ファミリーマート","title":"ファミリーマート 月次営業報告(2026年10月)","url":"https://www.family.co.jp/content/dam/family/company/familymart/monthly_sales/getsuji_202610_japanese.pdf","period":"2026년 10월","published":"2026-11-10"},"checked":"2026-11-20","status":"verified","loc":"p1 상품·서비스 동향 항목","limit":"회사의 정성적 설명이며 시책별 증분 효과 수치는 없다."}],"pdf":[{"page":"p60","kind":"method","note":"매출 향상 시책 패턴: 구매 단가 올리기, 구매 빈도 늘리기, 기존 고객 이탈 막기, 크로스셀·업셀."},{"page":"p62","kind":"method","note":"업계 리더·팔로워·니처 위치에 따라 쓸 수 있는 전략이 다르다."},{"page":"p61","kind":"caution","note":"「コンビニエンス・ロックイン」은 편의성으로 고객을 붙잡는 개념이며 편의점 사례가 아니다. 근거로 쓰지 않는다."}],"problems":[{"row":234,"cond":"편의점 어떤 상품의 매출 추정과 향상 시책. 면적 배분과 시간대가 맞는다."},{"row":553,"cond":"赤坂 편의점 체인의 코로나 시기 매출·이익 유지. 상권 변화가 핵심이다."},{"row":323,"cond":"무인 매장 도입 시 인건비 절감. 가맹점 운영 비용 구조를 본다."},{"row":514,"cond":"편의점 커피 서버의 매출과 향상 시책. 서비스로 방문 이유를 더하는 관점이다(유형은 A01-1)."},{"row":337,"cond":"편의점의 스마트폰 배터리 사업 인수. M&A 틀이 먼저이고, 편의점 관점은 시너지 확인에 쓴다."}],"cautions":["업계 전체 통계(JFA 「コンビニエンスストア統計調査月報」)는 원문을 열지 못해 쓰지 않았다. 최근 동향은 한 체인의 공식 속보다."]},{"id":"cafe","group":"G2","name":"카페","subs":["A06-1"],"scope":"커피 체인과 개인 카페. 원문에는 ドトール, スタバ의 인도 진출, 개인 카페 매출 향상이 있다.","character":"커피 자체보다 「그 자리에서 보내는 시간」을 파는 면이 크다. 고객마다 이용 목적(잠깐 마시기, 작업, 대화)이 달라서 좌석 회전과 체류 시간의 관계가 매출을 정한다. 같은 커피라도 편의점 커피와는 다른 가치로 경쟁한다.","firstQs":["주요 고객은 어떤 목적(테이크아웃, 작업, 대화·식사)으로 오는가? 그 목적별로 매출과 좌석 점유는 어떤가?","매출 변화는 방문 고객 수에서 왔는가, 객단가(가격 인상·추가 주문)에서 왔는가?"],"lenses":[{"name":"이용 목적별로 고객을 나눈다","hypothesis":"작업 목적 고객은 체류가 길어 좌석을 오래 차지하고, 메뉴 개선보다 좌석·콘센트가 선택 이유일 수 있다.","when":"체인 카페의 매출 향상, 고객층이 섞여 있는 경우.","split":"이용 목적(커피만 / 커피와 식사 / 작업)별로 매출과 좌석 시간을 따로 측정하고, 피크 시간 좌석 1시간당 공헌이익을 목적끼리 비교한다.","data":"시간대별 좌석 점유율, 목적별 객단가, 체류 시간","refute":"체류가 길어도 좌석이 비어 있는 매장이라면 회전은 제약이 아니다."},{"name":"정서적 가치로 다른 커피와 차별화한다","hypothesis":"같은 커피라도 매장 분위기와 브랜드로 편의점 커피·저가 체인보다 비싸게 팔 수 있다.","when":"가격대가 높은 체인, 또는 편의점 커피와의 경쟁을 묻는 경우.","split":"기능 가치(맛·가격·속도) / 정서 가치(공간·브랜드·경험)","data":"경쟁 가격대, 고객 선택 이유, 재방문율","refute":"고객이 주로 테이크아웃이라면 속도·가격의 비중이 커진다. 다만 짧게 머물러도 브랜드에서 정서 가치를 느낄 수 있으므로, 테이크아웃이라는 이유만으로 정서 가치가 없다고 단정하지 않는다."},{"name":"진출 지역의 점포 수 상한을 세운다","hypothesis":"해외 진출의 점포 수는 커피를 마시는 중산층 인구와 상권 수가 상한을 정한다.","when":"スタバ 인도 진출처럼 점포 수나 진출 여부를 묻는 경우.","split":"대상 고객층 인구 ÷ 1점포가 감당하는 고객 수, 상권 수로 검산","data":"도시별 소득 분포, 기존 커피 문화, 경쟁 체인 점포 수","refute":"차 문화가 강해 커피 소비 자체가 작다면 인구로 계산한 상한이 크게 과대평가된다."}],"causal":{"cause":"작업 목적 고객이 피크 시간에 좌석을 오래 차지해 다른 고객이 들어오지 못한다(가설).","action":"피크 시간에만 좌석 일부를 짧은 체류용으로 바꾸고, 작업 고객에게는 비피크 시간 혜택을 준다.","effect":"피크 회전이 오르고 작업 고객은 비피크로 옮긴다. 하루 전체 좌석 이용이 고르게 된다.","metric":"피크 시간 회전율, 시간대별 매출, 작업 고객의 이탈률","conditions":"작업 고객이 다른 카페로 떠나면 매출이 오히려 줄 수 있다. 정서적 가치를 해치지 않는 범위에서 해야 한다."},"trends":[{"fact":"2026년 9월 喫茶 업태 매출은 전년 대비 103.0%, 점포 수 100.5%, 객수 95.6%, 객단가 107.7%였다. 협회는 장기간의 날씨 불순이 객수에 크게 영향을 줬고, 계절 신상품과 가격 개정으로 객단가가 올랐다고 설명한다.","apply":"응용 가설: 지금 카페 매출은 객수 감소를 가격 인상으로 메우는 구조일 수 있다. 성장 문제에서는 가격 인상이 객수를 더 줄이지 않는지 함께 본다.","source":{"publisher":"一般社団法人日本フードサービス協会","title":"外食産業市場動向調査 2026年9月度 結果報告","url":"https://www.jfnet.or.jp/wp/wp-content/uploads/2026/10/getujidata-2026-9.pdf","period":"2026년 9월","published":"2026-10-26"},"checked":"2026-11-20","status":"verified","loc":"p1 「＜業態別概況＞ 喫茶業態」, p2 「2026年9月度 結果報告」 표의 喫茶(計) 행","limit":"협회 회원사(喫茶 25사·1,903점) 전체 점포 기준이며 기존점 비교가 아니다. 개인 카페는 포함되지 않는다."},{"fact":"같은 달 외식 전체 매출은 107.3%였고, 협회는 객단가 상승(104.9%)이 매출을 받쳤다고 설명한다.","apply":"응용 가설: 객단가 상승은 카페만의 현상이 아니다. 카페 고유의 요인(체류·좌석)과 업계 공통 요인(가격 개정)을 나눠 본다.","source":{"publisher":"一般社団法人日本フードサービス協会","title":"外食産業市場動向調査 2026年9月度 結果報告","url":"https://www.jfnet.or.jp/wp/wp-content/uploads/2026/10/getujidata-2026-9.pdf","period":"2026년 9월","published":"2026-10-26"},"checked":"2026-11-20","status":"verified","loc":"p1 「＜全体概況＞」","limit":"외식 전체 수치다."}],"pdf":[{"page":"p81","kind":"direct","note":"대형 커피 체인의 고객층을 나눈 예. 작업 목적 고객은 좌석 점유율과 콘센트 유무가 중요하고, 메뉴 개선의 여지는 작다."},{"page":"p61","kind":"direct","note":"브랜드 로크인의 예로 スターバックス. 매장에서 마시는 정서적 가치가 높아 편의점이나 ドトール보다 특정 소비자에게 선호된다."}],"problems":[{"row":232,"cond":"커피 체인의 경영 전략(마케팅 평가, 성장, 리스크). 이용 목적과 정서 가치를 함께 본다."},{"row":380,"cond":"ドトール의 매출 향상. 가격대와 이용 목적이 スタバ와 다르다는 점에서 출발한다. 513도 같은 주제다."},{"row":482,"cond":"개인 카페의 매출 향상. 좌석 수가 작아 회전과 단골이 핵심이다."},{"row":52,"cond":"スタバ가 인도에 몇 점포까지 낼까. 점포 수 상한 관점(페르미). 336은 진출 논점 망라다."}],"cautions":[]},{"id":"hotel","group":"G2","name":"호텔","subs":["A11-1"],"scope":"비즈니스호텔, 역 앞 호텔, 온천 여관, 고급 리조트 호텔. 원문에는 アパホテル 프랜차이즈 가맹 검토가 있다.","character":"오늘 팔지 못한 객실은 내일 팔 수 없다. 그래서 가동률과 객실 단가를 함께 관리한다. 객실 수는 짧은 기간에 늘릴 수 없고, 청소·프런트 인력이 부족하면 빈 객실이 있어도 팔 수 없다. 예약 경로(직접 예약, 여행 중개 사이트)에 따라 남는 이익도 다르다.","firstQs":["매출 변화는 가동률에서 왔는가, 객실 단가에서 왔는가? 어느 요일·계절에 비는가?","판매 가능한 객실을 줄이는 운영 제약(청소 인력 등)이 있는가?"],"lenses":[{"name":"가동률과 단가를 함께 움직인다","hypothesis":"성수기에는 단가를 올리고 비수기에는 가동률을 채우는 가격 운영으로 매출이 오를 수 있다.","when":"요일·계절별 수요 차이가 큰 호텔의 매출 향상.","split":"객실 수 × 가동률 × 객실 단가. 요일·계절별로 따로 본다.","data":"요일·계절별 가동률과 단가, 예약 시점 분포, 경쟁 호텔 가격","refute":"1년 내내 가동률이 높다면 가동률이 아니라 단가나 부대 매출이 쟁점이다."},{"name":"판매 가능한 객실을 막는 운영 제약을 찾는다","hypothesis":"수요가 있어도 청소 인력이 부족해 객실을 팔지 못하고 있을 수 있다.","when":"가동률이 수요보다 낮게 묶여 있다는 단서가 있을 때. 매출 부진을 바로 공급 제약으로 단정하지 않는다.","split":"판매 가능 객실 = 총 객실 − 청소 미완료 객실 − 수리 중 객실","data":"청소 완료 시각, 당일 판매 거절 건수, 인력 배치","refute":"당일 거절이 없고 객실이 남아 있다면 제약은 수요 쪽이다."},{"name":"예약 경로와 브랜드 가맹의 손익을 본다","hypothesis":"여행 중개 사이트 의존이 크면 수수료가 이익을 깎는다. 프랜차이즈 가맹은 예약 경로를 바꾸지만 가맹 수수료가 든다.","when":"アパホテル 가맹 검토처럼 수익 구조를 바꾸는 판단을 묻는 경우.","split":"예약 경로별 객실 수 × 단가 × (1 − 수수료율), 가맹 전후로 비교","data":"경로별 예약 비중과 수수료, 가맹 조건, 브랜드 전환 뒤의 가동률","refute":"직접 예약 비중이 이미 높다면 가맹으로 얻는 예약 이점이 작다."}],"causal":{"cause":"평일에는 출장 수요로 차지만 주말에는 객실이 비어 있다(가설).","action":"주말에 지역 행사나 관광과 묶은 숙박 상품을 낸다. 단가는 평일보다 낮추되 최저선을 정한다.","effect":"주말 가동률이 오른다. 늘어난 객실 매출에서 청소·리넨·식사, 여행 중개 사이트나 프랜차이즈 수수료, 추가 인력비를 뺀 증분 이익으로 효과를 평가한다.","metric":"요일별 가동률, 판매 가능 객실당 매출, 주말 객실 단가","conditions":"주말 청소 인력이 확보돼야 한다. 할인이 평일 고객의 기대 가격을 떨어뜨리는 부작용이 있다."},"trends":[{"fact":"2026년 9월(제1차 속보) 객실 가동률은 전체 62.6%, 연 숙박자 수는 5,282만 인박(전년 같은 달 대비 2.6% 감소)이었다. 외국인은 1,165만 인박으로 9.2% 줄었다. 8월(제2차 속보)은 가동률 64.6%, 6,240만 인박(7.2% 감소)이었다. 관광청은 2026년 1월분부터 층화 기준을 바꿔 전년 비교에 그 영향이 있을 수 있다고 적었다.","apply":"응용 가설: 숙박자 수가 줄어도 가동률은 60%대를 유지하고 있다. 수요와 판매 가능 객실(공급)을 나눠 봐야 한다. 전년 비교 수치는 기준 변경의 영향을 감안한다.","source":{"publisher":"観光庁","title":"宿泊旅行統計調査(2026年9月・第1次速報、2026年8月・第2次速報)","url":"https://www.mlit.go.jp/kankocho/news02_00105.html","period":"2026년 9월(제1차 속보)·8월(제2차 속보)","published":"2026-10-30"},"checked":"2026-11-20","status":"verified","loc":"보도 발표 웹 페이지 본문","limit":"9월은 제1차 속보치라 개정될 수 있다. 시설 유형별 가동률은 이 문단에 없다."},{"fact":"2025년 3월 말 旅館業 시설 수는 98,338곳으로, 전년도보다 4,863곳(5.2%) 늘었다.","apply":"응용 가설: 시설 수가 늘고 있다면 개별 호텔의 가동률 경쟁은 더 심해질 수 있다. 공급 증가를 시장 요인으로 확인한다.","source":{"publisher":"厚生労働省","title":"令和6(2024)年度衛生行政報告例の概況","url":"https://www.mhlw.go.jp/toukei/saikin/hw/eisei_houkoku/24/dl/gaikyo.pdf","period":"2025-03-31 현재","published":"2025-10-21"},"checked":"2026-11-20","status":"verified","loc":"p6 「表４ 生活衛生関係施設数の年次推移」 앞 본문","limit":"旅館業은 호텔·여관·간이숙소 등을 합친 수다."}],"pdf":[{"page":"p52","kind":"method","note":"도쿄 택시 회사 예제에서 공급 쪽으로 「台数×稼働率×回転率×利用単価」로 나누고 가동률을 과제로 특정한다. 호텔의 객실 수 × 가동률 × 단가에 응용한다."},{"page":"p63","kind":"method","note":"이익 향상에서는 고정비와 변동비를 나눠 보는 방법을 쓴다. 호텔의 비용 구성 비중을 보여 주는 직접 자료는 아니다."}],"problems":[{"row":372,"cond":"도쿄 비즈니스호텔의 매출 향상. 요일별 가동률과 단가에서 출발한다."},{"row":562,"cond":"역 앞 호텔의 매출 추정과 향상 시책. 객실 수 × 가동률 × 단가로 추정하고 운영 제약을 확인한다."},{"row":334,"cond":"지방 비즈니스호텔 3곳 오너가 アパホテル 가맹 제안을 받음. 예약 경로와 가맹 손익을 본다. 638도 같은 주제다."},{"row":181,"cond":"온천 여관의 고객 수 추정과 경영 전략. 계절성과 단체·개인 고객 구성이 다르다."}],"cautions":["영화관(A11-3)은 좌석 처리 능력이라는 공통점이 있다. 호텔을 대표로 둔 것은 객실 박수, 예약 경로, 청소 제약이라는 다른 학습 가치가 있기 때문이다."]},{"id":"juku","group":"G3","name":"학원","subs":["A07-1"],"scope":"초·중·고생 대상 학습학원과 입시학원. 원문에는 학원 중기 경영계획, 매출 향상, 외국어 학원이 있다.","character":"다니는 사람은 학생이지만 고르고 돈을 내는 사람은 부모다. 대상 연령의 인구가 줄면 정원보다 점유가 쟁점이 된다. 수업의 질은 강사가 정하므로 강사 채용과 육성이 공급의 핵심이다. 한 번 들어오면 몇 년 다니므로 입회와 퇴회가 매출을 크게 움직인다.","firstQs":["대상 연령 인구가 줄고 있는가? 그렇다면 쟁점은 정원 늘리기인가, 경쟁 학원에서 점유를 가져오기인가?","부모가 학원을 고르고 계속 보내는 기준(합격 실적, 성적 향상, 통학 거리, 가격)은 무엇인가?"],"lenses":[{"name":"입회와 퇴회를 나눠 본다","hypothesis":"매출이 줄었다면 신규 입회 감소보다 학년이 오르며 그만두는 퇴회가 원인일 수 있다.","when":"재원생 수가 줄었거나 5년 매출 2배처럼 큰 성장을 묻는 경우.","split":"재원생 수 = 전년 재원생 − 중도 퇴회 − 졸업 + 신규 입회. 졸업은 정상 이행이므로 중도 퇴회(비자발 이탈)와 구분해 학년별로 본다.","data":"학년별 입회·퇴회 수, 퇴회 사유, 계절별 입회","refute":"퇴회율이 업계 평균과 같다는 것만으로 개선 여지가 없다고 보지 않는다. 퇴회 사유가 성적·강사·가격 중 바꿀 수 있는 것인지로 판단한다."},{"name":"결정자인 부모의 판단 기준을 본다","hypothesis":"부모는 합격 실적이나 성적 향상 같은 눈에 보이는 성과로 학원을 고른다.","when":"경쟁 학원과의 점유 경쟁, 마케팅 시책을 묻는 경우.","split":"인지 → 체험 수업 → 입회 → 계속. 단계마다 부모가 보는 근거를 묻는다.","data":"체험에서 입회로 이어지는 비율, 입회 이유 조사, 합격 실적 공개 여부","refute":"고등학생처럼 본인이 고르는 비중이 크다면 학생의 기준이 먼저다."},{"name":"강사 공급이 질과 규모를 묶는다","hypothesis":"좋은 강사를 채용·유지하지 못하면 교실을 늘려도 질이 떨어져 퇴회가 늘 수 있다.","when":"교실 확장, 중기 계획처럼 규모를 늘리는 문제.","split":"공급 상한: 강사 가용 시간 ÷ 학생 1명당 지도 시간. 품질 지표(성적 향상, 만족도, 퇴회율)는 공급 상한과 따로 측정한다.","data":"강사 이직률, 교실별 성적 향상 차이, 채용 경쟁률","refute":"영상 수업 중심이라면 강사 수보다 콘텐츠와 학습 관리가 제약이다."}],"causal":{"cause":"중학교 3학년 입시가 끝나면 고등부로 이어지지 않고 그만둔다(가설).","action":"중3 겨울에 고등학교 첫 시험 대비 과정을 미리 안내하고, 같은 강사가 이어서 맡는다.","effect":"고등부 진급률이 오르고 재원 기간이 길어진다.","metric":"중3 → 고1 진급률, 학년별 퇴회율, 재원 기간","conditions":"고등부를 가르칠 강사가 있어야 한다. 입시 직후 휴식을 원하는 가정에는 권유가 부담이 될 수 있다."},"trends":[{"fact":"2026년 7월(속보) 「学習塾，教養・技能教授業」 매출은 전년 같은 달과 같았다(0.0%).","apply":"응용 가설: 이 분류 전체의 매출은 전년과 같지만, 이것만으로 「점유 경쟁만이 성장책」이라고 결론 내리지 않는다. 이 분류는 학습학원 단독이 아니므로 학원 단독·지역·대상 연령의 수요와 가격·과정 구성을 따로 확인한다.","source":{"publisher":"総務省統計局","title":"サービス産業動態統計調査 2026年(令和8年)7月分(速報)","url":"https://www.stat.go.jp/data/mbss/kekka/pdf/m202607.pdf","period":"2026년 7월","published":"2026-09-24"},"checked":"2026-11-20","status":"verified","loc":"p10 「時系列 第１表」 82b 열, 2026년 7월 행","limit":"속보(p)이고 학습학원 단독이 아니라 교양·기능 교수업을 합친 분류다."},{"fact":"같은 달 「教育，学習支援業」 전체 매출은 전년 대비 2.5% 늘었다.","apply":"응용 가설: 교육 서비스 전체와 학원·교양 분야의 움직임이 다르다. 학원 문제는 교육 업계 전체 수치로 대신하지 않는다.","source":{"publisher":"総務省統計局","title":"サービス産業動態統計調査 2026年(令和8年)7月分(速報)","url":"https://www.stat.go.jp/data/mbss/kekka/pdf/m202607.pdf","period":"2026년 7월","published":"2026-09-24"},"checked":"2026-11-20","status":"verified","loc":"요약 「図２ 月間売上高の前年同月比－産業大分類別」","limit":"대분류 수치다. 「学校教育」은 조사 대상에서 빠진다."}],"pdf":[{"page":"p45","kind":"direct","note":"대학 입시 학원이라면 매력적인 강의를 위해 강사를 채용하고 있는지, 채용·인재 육성에 문제가 없는지, 자사의 가치사슬이 강한지를 묻는다."},{"page":"p63","kind":"method","note":"고객을 고르고 그 고객의 잡(기능 가치·정서 가치)을 생각한다. 학원은 학생과 부모의 잡이 다르다."}],"problems":[{"row":365,"cond":"도쿄 학원의 중기 경영계획. 대상 인구, 강사 공급, 교실 확장을 함께 본다."},{"row":403,"cond":"학원의 매출 향상. 입회와 퇴회를 나눠 출발한다."},{"row":665,"cond":"5년 안에 매출 2배. 점유 경쟁만으로 되는지, 새 대상(학년·과목)이 필요한지를 본다."},{"row":279,"cond":"외국어 학습자 수 추정과 그 언어 학원 진출. 결정자가 본인(성인)이라 부모 관점이 맞지 않는다."}],"cautions":["대학(입학자 모집) 문제는 같은 교육 유형이지만 정원·학령인구·평판 구조가 달라 이 대표와 같은 분석으로 묶지 않는다."]},{"id":"lowcut","group":"G3","name":"저가 커트 전문점","subs":["A07-3"],"scope":"짧은 시간·낮은 가격의 커트 전문점. 원문은 저가 헤어살롱 CEO 제안과 「1000円カット」 매출 향상이다. 1000엔은 원문 문제의 조건이며 현재 가격이 아니다.","character":"시술자 한 사람이 한 시간에 몇 명을 깎을 수 있는가가 매출의 상한이다. 일반 미용실이 시술 시간과 단가를 늘려 버는 것과 반대로, 시술을 짧게 표준화하고 회전을 높여 번다. 고객은 커트 품질의 최소 기준을 충족하는 한 가격과 전체 소요 시간을 더 중시할 수 있어, 대기 시간이 길어지면 바로 떠난다.","firstQs":["지금 매출의 상한을 정하는 것은 고객 수(수요)인가, 시술자 수와 1인 처리 시간(공급)인가?","고객이 이 가게를 고르는 이유는 가격인가, 시간(대기·시술)인가, 위치인가?"],"lenses":[{"name":"시술자 처리 능력을 상한으로 본다","hypothesis":"대기 고객이 생기는 시간대가 있다면 매출의 상한은 시술자 수 × 시간당 처리 수다.","when":"피크 시간에 대기열이 생기거나, 매장 확장·인력을 묻는 경우.","split":"시술자 수 × 영업시간 × 시간당 처리 인원 × 가동률 × 단가","data":"시간대별 대기 인원과 대기 이탈, 1인 시술 시간, 시술자 근무 배치","refute":"하루 종일 대기가 없다면 공급이 아니라 수요가 제약이다."},{"name":"저가·단시간 모델이 포기한 것을 확인한다","hypothesis":"샴푸·드라이를 빼고 시간을 줄인 대신, 그 서비스를 원하는 고객은 처음부터 오지 않는다.","when":"추가 서비스로 객단가를 올리자는 시책을 검토할 때.","split":"추가 서비스의 증분 수입 − 추가 재료비·인건비 − 피크 시간에 그 시술 시간 때문에 놓친 기존 커트의 공헌이익","data":"추가 서비스 수요 조사, 시술 시간 변화","refute":"비피크 시간이라 놓치는 커트가 없다면 셋째 항은 0에 가깝다. 그래도 추가 재료비·인건비는 빼야 하므로, 증분 수입이 그보다 작으면 순이익이 되지 않는다."},{"name":"입지와 대기 시간의 관계를 본다","hypothesis":"역 안·쇼핑몰처럼 지나가다 들르는 입지에서는 대기 시간이 보이면 바로 다른 곳으로 간다.","when":"점포 위치 선정, 신규 출점을 묻는 경우.","split":"통행량 × 입점률(대기 시간에 따라 변함) × 단가","data":"입지별 통행량, 대기 시간 표시와 입점률의 관계","refute":"예약이나 단골 위주 매장이라면 지나가는 통행량의 영향이 작다."}],"causal":{"cause":"평일 저녁과 주말에 대기가 길어 고객이 그냥 돌아간다(가설).","action":"피크 시간에만 일하는 단시간 시술자를 배치하고, 매장 밖에 대기 시간을 표시한다.","effect":"피크 처리 인원이 늘고 대기 이탈이 준다. 대기 표시로 비피크로 오는 고객도 생긴다.","metric":"피크 시간 처리 인원, 대기 이탈 수, 시술자 1인당 매출","conditions":"단시간 근무 시술자를 구할 수 있어야 한다. 시술자 인건비가 늘어난 처리 인원의 매출보다 크면 이익이 준다."},"trends":[{"fact":"2025년 3월 말 美容所는 277,752곳으로 전년도보다 3,682곳(1.3%) 늘었고, 理容所는 107,995곳으로 2,302곳(2.1%) 줄었다.","apply":"응용 가설: 미용소는 늘고 이용소는 줄어드는 흐름 속에서, 커트만 하는 저가 업태가 어느 쪽 고객을 가져오는지 확인한다. 이 통계는 저가 커트를 따로 집계하지 않는다.","source":{"publisher":"厚生労働省","title":"令和6(2024)年度衛生行政報告例の概況","url":"https://www.mhlw.go.jp/toukei/saikin/hw/eisei_houkoku/24/dl/gaikyo.pdf","period":"2025-03-31 현재","published":"2025-10-21"},"checked":"2026-11-20","status":"verified","loc":"p6 「表４ 生活衛生関係施設数の年次推移」","limit":"시설 수이며 매출·고객 수가 아니다. 저가 커트를 따로 집계하지 않는다."},{"fact":"2026년 7월(속보) 「生活関連サービス業，娯楽業」 매출은 전년 대비 3.2% 늘었고, 사업 종사자 수는 0.4% 줄었다.","apply":"응용 가설: 매출은 늘어도 일하는 사람은 줄고 있다. 시술자 확보가 생활 서비스 전반의 제약일 수 있다. 이 분류는 미용 외 업종도 포함한다.","source":{"publisher":"総務省統計局","title":"サービス産業動態統計調査 2026年(令和8年)7月分(速報)","url":"https://www.stat.go.jp/data/mbss/kekka/pdf/m202607.pdf","period":"2026년 7월","published":"2026-09-24"},"checked":"2026-11-20","status":"verified","loc":"요약 「図２」·「表２」","limit":"대분류이며 미용 외 업종도 포함한다."}],"pdf":[{"page":"p52","kind":"method","note":"공급 쪽으로 나눠(택시의 台数×稼働率×回転率×単価) 어느 인수에 여지가 있는지 본다. 시술자 수 × 가동률 × 처리 인원에 응용한다."},{"page":"p62","kind":"method","note":"코모디티에 가까운 상품은 규모나 운영 효율의 원가 우위로 이긴다."}],"problems":[{"row":42,"cond":"1000엔 커트의 매출 향상. 시술자 처리 능력과 대기 이탈에서 출발한다."},{"row":41,"cond":"저가 헤어살롱 CEO에게 할 제안. 저가 모델이 포기한 것과 확장 방향을 함께 본다."},{"row":669,"cond":"미용실과 결합한 시너지 사업(신사업 발상). 저가 커트와 일반 미용실의 차이를 먼저 정한다."}],"cautions":["일반 미용실·네일·마사지는 같은 생활 서비스 유형이지만 시술 시간과 단가 구조가 달라 이 대표의 분해를 그대로 쓰지 않는다."]},{"id":"hospital","group":"G3","name":"병원","subs":["A07-2"],"scope":"입원과 외래 진료를 하는 병원. 원문 4문제 가운데 616·645는 미국 병원(체인)이라고 명시돼 있고, 646·652는 국가가 적혀 있지 않다.","character":"무슨 진료를 받을지는 환자보다 의사가 정하는 경우가 많고, 가격은 제도나 보험이 정한다. 병상과 의료진이 공급의 상한이고 고정비가 크다. 원문은 미국 사례 2건과 국가 미명시 2건이므로, 일본의 제도와 통계를 원문의 사실로 쓰지 않는다.","firstQs":["매출이 둔화했다면 진료 건수(외래·입원 환자 수), 1건당 수입, 진료 구성(진료·입원·처방) 가운데 어디서 왔는가?","그 나라·지역에서 가격을 정하는 것은 누구인가(제도, 보험자, 병원)?"],"lenses":[{"name":"진료 구성별로 나눈다","hypothesis":"입원은 병상 가동률이, 외래는 환자 수와 의사 시간이 매출을 정해 서로 다른 레버가 필요하다.","when":"원문 645처럼 진료·입원·처방의 구성이 주어진 경우.","split":"외래(환자 수 × 1건 수입) / 입원(병상 수 × 가동률 × 대상 기간 일수 × 1일 수입) / 처방. 입원은 기간 일수를 곱해 외래와 같은 기간의 매출로 맞춘다.","data":"부문별 매출, 병상 가동률, 평균 재원 일수","refute":"한 부문이 매출 대부분을 차지한다면 구성보다 그 부문 안의 분해가 먼저다."},{"name":"결정자와 지불자를 구분한다","hypothesis":"환자를 보내는 것은 지역 의원·의사의 소개이고, 돈을 내는 것은 보험자라 「환자 마케팅」만으로는 환자가 늘지 않을 수 있다.","when":"환자 수를 늘리는 시책을 묻는 경우.","split":"환자 유입 경로: 소개 / 응급 / 직접 방문. 경로별로 결정하는 사람이 다르다.","data":"소개 경로별 환자 수, 보험 구성, 지역 의원과의 연계","refute":"직접 방문이 대부분인 진료과(건강검진 등)라면 환자 본인의 선택이 중요하다."},{"name":"가격을 올릴 수 없을 때 수익을 바꾸는 곳을 찾는다","hypothesis":"가격이 제도로 묶여 있다면 이익은 진료 건수, 재원 일수, 원가(인력·재료)에서 바꿔야 한다.","when":"이익 개선이나 경영 개선을 묻는 경우.","split":"이익 = (건수 × 정해진 단가) − 고정비(인력·설비) − 변동비(재료·약)","data":"단가 결정 방식, 비용 구성, 인력 배치","refute":"미국처럼 병원이 보험자와 가격을 협상할 수 있다면 가격도 레버가 된다. 원문의 나라를 먼저 확인한다."}],"causal":{"cause":"지역 의원에서 오는 소개 환자가 경쟁 병원으로 옮겨 갔다(가설).","action":"지역 의원에 진료 결과를 빨리 돌려주고, 소개 환자의 예약을 우선 받는 연계 창구를 만든다.","effect":"의원이 다시 소개할 이유가 생긴다. 외래와 입원 환자가 늘어난다.","metric":"소개 환자 수, 소개에서 입원으로 이어진 비율, 병상 가동률","conditions":"늘어난 환자를 받을 의사·간호 인력이 있어야 한다. 인력이 부족하면 대기가 길어져 소개가 다시 줄 수 있다."},"trends":[{"fact":"2026년 8월 말(개수) 일본의 병원은 7,941곳으로 전월보다 1곳 줄었고, 병원 병상은 1,440,637상으로 44상 늘었다.","apply":"응용 가설: 일본 병원 수는 월 단위로 거의 변하지 않는다. 일본 병원을 다룬다면 신규 개설보다 기존 병원 간 환자·인력 경쟁이 쟁점일 수 있다. 원문의 미국·국가 미명시 사례에는 옮기지 않는다. 공표일은 페이지 표기를 읽지 못해 비워 두었다.","source":{"publisher":"厚生労働省","title":"医療施設動態調査(令和8(2026)年8月末概数)","url":"https://www.mhlw.go.jp/toukei/saikin/hw/iryosd/m26/dl/is2608.pdf","period":"2026-08-31 현재","published":null},"checked":"2026-11-20","status":"verified","loc":"p1 첫 문단과 「１．種類別にみた施設数及び病床数」 표","limit":"월말 개수(概数)다. 공표일은 HTML 페이지 표기가 깨져 확인하지 못했다."},{"fact":"2026년 7월(속보) 「医療業」 매출은 전년 대비 5.4% 늘었고, 「医療，福祉」 전체는 5.2% 늘었다.","apply":"응용 가설: 이 수치는 의원 등을 포함한 「医療業」 전체이고 기간도 7월이다. 8월 병원 수와 섞어 병원 1곳당 매출을 추론하지 않는다. 병원당 매출을 보려면 같은 모집단·기간의 건수와 단가 자료가 필요하다.","source":{"publisher":"総務省統計局","title":"サービス産業動態統計調査 2026年(令和8年)7月分(速報)","url":"https://www.stat.go.jp/data/mbss/kekka/pdf/m202607.pdf","period":"2026년 7월","published":"2026-09-24"},"checked":"2026-11-20","status":"verified","loc":"p10 「時系列 第１表」 83 医療業 열, 요약 「図２」","limit":"속보(p)이며 병원 외 의원 등도 포함한다."}],"pdf":[{"page":"p66–67","kind":"method","note":"출제 유형별 범용 트리 가운데 「売上利益の低下要因」. 원인 문제에서는 매출 정량과 비용을 함께 본다."},{"page":"p63","kind":"method","note":"이익 향상에서는 고정비와 변동비를 나눈다. 병원은 인력·설비 고정비가 크다."}],"problems":[{"row":616,"cond":"미국 병원 체인의 매출 둔화 원인을 구조적으로 망라하고 그래프를 해석한다. 진료 구성과 결정자 관점이 맞는다."},{"row":645,"cond":"미국에 100곳 있는 병원(진료·입원·처방)의 매출 향상. 진료 구성별 분해가 직접 맞는다."},{"row":646,"cond":"병원 매출 확대 방안을 넓게 내고 표로 계산한다(국가 미명시). 652도 같은 주제다."}],"cautions":["원문 616·645는 미국 사례, 646·652는 국가 미명시다. 일본의 진료보수·약가 제도와 통계는 원문의 사실이 아니라 일본에 적용할 때의 응용 가설로만 쓴다."]},{"id":"taxi","group":"G4","name":"택시","subs":["A12-2"],"scope":"택시 사업자 또는 개인 기사의 매출·이익. 배차 앱 자체의 중개 수익과 구별한다.","character":"차량이 있어도 운전자가 없으면 운행할 수 없고, 운행해도 승객이 없는 공차 시간이 있다. 수요가 생긴 장소와 시간에 가용 차량을 맞추는 것이 핵심이며 운임·근무 조건은 지역 제도와 계약에 제약받는다.","firstQs":["차량 부족, 운전자 부족, 공차, 승차 중 병목 중 무엇이 대기와 기회손실을 만드는가?","특정 지역·시간의 부족인가, 하루 전체의 저가동인가? 회사와 개인 기사 중 누구의 이익을 높이는가?"],"lenses":[{"name":"차량 보유보다 시간의 손실 위치","hypothesis":"차량을 늘리기 전에 공차·교대·회송에서 회수할 수 있는 시간이 있을 수 있다.","when":"일일 매출 또는 공급 부족을 묻고 운행 기록을 확인할 수 있을 때.","split":"보유 차량 → 운전자 확보로 운행 가능한 시간 → 영업 시간 중 실차 시간 → 승차당 거리·운임. 시간 비율들의 분모를 통일한다.","data":"시간대별 운행 가능 대수, 실차율, 공차 거리, 교대·휴식 시간, 승차 횟수","refute":"이미 실차율이 높고 운행 가능 시간도 꽉 차 있다면 배차 개선만으로 늘릴 수 없다. 안전한 인력 확보나 수요 분산을 검토한다."},{"name":"도시 평균 대신 지역×시간의 불일치","hypothesis":"차량이 남는 구역과 호출이 거절되는 구역이 동시에 존재할 수 있다.","when":"대기·호출 실패가 특정 시간과 장소에 집중될 때.","split":"지역×시간별 호출 → 배차 수락 → 승객 합류 → 실차. 공차 이동 시간까지 포함해 재배치 효과를 평가한다.","data":"호출 실패·취소율, 도착 시간, 이동 경로, 행사·기상별 수요","refute":"모든 인접 구역이 동시에 부족하면 재배치는 부족을 옮길 뿐이다. 장거리 재배치가 추가 매출보다 비쌀 수도 있다."},{"name":"누가 어떤 경로로 수요를 가져오는가","hypothesis":"길거리 승차·전화·앱은 수요 확보 비용과 공차 절약 효과가 다르다.","when":"배차 앱 도입 또는 고객 확보 수단을 고르는 문제.","split":"경로별 증분 승차 수입 − 수수료 − 합류 공차 비용. 기존 승객이 유료 채널로 이동한 것과 새 수요를 구별한다.","data":"경로별 순수입, 기존 고객의 경로 전환, 합류 거리, 취소 비용","refute":"앱 증가가 기존 승차의 대체에 불과하고 공차도 줄지 않으면 수수료만 늘 수 있다."}],"causal":{"cause":"저녁 특정 거점에서 배차 실패가 나지만 인근 다른 구역 차량은 공차로 돌아다닌다(가설).","action":"짧은 기간·한 구역에서 수요 예측에 따른 대기 거점을 시험한다.","effect":"공차 탐색과 합류 시간을 줄이면 같은 근무 시간에 완료 승차가 늘고 기사 시간당 순수입이 개선된다. 이전 구역의 승차 손실과 재배치 연료비는 차감한다.","metric":"완료 승차/기사 시간, 시간당 순수입, 대기 시간, 호출 실패, 공차 km","conditions":"운전자 휴식·안전과 지역 운행 규칙 준수. 인근 수요 빼앗기와 예측 실패로 인한 공차 증가를 함께 확인한다."},"trends":[{"fact":"関東運輸局의 2026-04-20 자료는 일본판 라이드셰어 등을 지역·시간대별 교통 공급 부족 보완 수단으로 다룬다.","apply":"응용: 하루 평균 가동률보다 부족이 발생하는 구역·시간과 허용 공급을 먼저 묻는다.","source":{"publisher":"国土交通省 関東運輸局","title":"地域交通・自家用車活用事業 관련 설명 자료","url":"https://wwwtb.mlit.go.jp/kanto/content/000372304.pdf","published":"2026-04-20","period":"2026년 제도 설명"},"checked":"2026-11-20","status":"verified","loc":"자택용차 활용 사업·지역 교통 공급 설명","limit":"제도 설명이며 사업자의 수익 개선이나 정책 효과를 입증한 실적이 아니다."},{"fact":"Uber Japan은 2026-11-04에 배달 이용자가 같은 앱의 택시 기능을 발견하도록 하는 캠페인을 발표했다.","apply":"응용: 신규 앱 설치보다 기존 앱 사용자에게 택시 수요를 연결할 수 있는지, 증분 승차와 수수료를 검증한다.","source":{"publisher":"Uber Japan","title":"Eats to Rides 캠페인","url":"https://www.uber.com/jp/ja/newsroom/eats-to-rides-campaign/","published":"2026-11-04","period":"2026년 9월 자사 관측·11월 캠페인"},"checked":"2026-11-20","status":"verified","limit":"자사 발표이며 전체 택시 시장 성장이나 캠페인 인과 효과가 아니다."}],"pdf":[{"page":"p52","kind":"direct","note":"택시 공급 측 분해와 가동률 가설의 예. 저가동은 책의 가설이며 모든 택시의 현재 병목이 아니다."},{"page":"p53","kind":"method","note":"가설에 맞는 분해를 고르고 바꿀 수 있는 변수를 우선한다."}],"problems":[{"row":54,"cond":"개인 택시 기사의 이익과 강약점. 회사 전체 비용을 개인 기사 비용으로 옮기지 않는다. 124는 유사 문제다."},{"row":451,"cond":"택시 1대 하루 매출 추정. 실차율·승차 회전·운임의 중복 계산에 주의."}],"cautions":["택시 회사, 개인 기사, 앱 플랫폼의 수입과 비용은 다르다."]},{"id":"parcel","group":"G4","name":"택배","subs":["A12-3"],"scope":"집하·간선·지역 거점을 거쳐 수취인에게 배달하는 택배. 트럭 운송 일반과 구별한다.","character":"상자 수가 같아도 배송지가 모여 있는지, 부재와 재방문이 많은지에 따라 필요한 기사 시간이 달라진다. 수요를 늘리는 일과 배송 능력을 늘리는 일이 충돌할 수 있다.","firstQs":["인원 부족이 집하·간선·분류·최종 배송 중 어디에 집중되는가?","배송 1건의 이동·정차·인도·재방문 시간 중 무엇이 긴가? 지역·건물·수취 방식별 차이는?"],"lenses":[{"name":"기사 수보다 완료 배송당 시간","hypothesis":"추가 채용 전에 반복 방문과 건물 내 이동을 줄여 공급을 회복할 수 있다.","when":"인력 부족 원인이 물량 증가인지 생산성 저하인지 구별할 때.","split":"한 경로의 시간 = 거점 준비 + 이동 + 정차·인도 + 재방문. 완료 건수와 시도 횟수를 구별한다.","data":"기사 근무 시간, 배송 시도·완료 건수, 재배달, 주차·건물 이동 시간","refute":"최종 배송이 아니라 간선 운송 또는 분류가 병목이면 수취 방법 개선만으로 총처리량은 늘지 않는다."},{"name":"수취를 배송 서비스의 일부로 설계","hypothesis":"부재가 반복되는 구역은 시간 지정·보관함·비대면 수취로 재방문을 줄일 수 있다.","when":"부재·시간 불일치 비중이 높고 수취인의 동의를 얻을 수 있을 때.","split":"수취 방법별 첫 배송 완료율 × 절감 시간 − 보관함 비용·우회 시간·분실 대응 비용.","data":"첫 방문 성공률, 수취 방식 이용률, 민원·분실, 보관함까지 우회 시간","refute":"보관함이 멀거나 만실이고 현관 전달도 이미 잘되면 전환의 편익이 작다."},{"name":"평균 단가보다 지역·화주별 배송 밀도","hypothesis":"박리 다건 계약도 배송지가 밀집하면 수익성이 좋고, 높은 단가도 장거리 분산 배송이면 나쁠 수 있다.","when":"EC 물량 확대나 계약 재협상·지역 확장을 검토할 때.","split":"지역·화주별 수입 − 증분 운행·작업 비용. 배송 건/km와 건/정차를 함께 확인한다.","data":"배송지 지도, 화주별 물량 변동, 피크 대응 인력비, 계약 조건","refute":"밀도가 높아져도 피크 시간에 작업이 몰려 잔업·혼잡이 급증하면 물량 확대가 이익을 깎는다."}],"causal":{"cause":"부재 재방문 때문에 기사 시간이 소모되고 같은 경로의 당일 완료 물량이 제한된다(가설).","action":"부재율 높은 구역부터 사전 수취 선택과 가까운 공동 수취 거점을 시험한다.","effect":"첫 시도 완료가 늘어 재방문 시간이 줄면 같은 근무 시간의 배송 능력이 회복된다. 절감한 시간이 실제 잔업 감소 또는 추가 완료로 바뀌는지 확인한다.","metric":"첫 배송 완료율, 기사 시간/완료 건, 잔업, 배송 지연, 분실·민원, 증분 비용","conditions":"수취 동의·보안·보관 공간과 운영 책임이 필요하다. 수취인에게 이동 부담을 전가하거나 거점 만실로 우회가 늘 수 있다."},"trends":[{"fact":"2026년 4월 조사에서 非対面配達率(비대면 배달률)은 31.0%였다(대형 택배 3사). 2026-07-10 발표.","apply":"응용: 수취 방식 전환 여지를 구역별로 조사한다.","source":{"publisher":"国土交通省","title":"宅配便の多様な受取方法の利用率は約31.0%","url":"https://www.mlit.go.jp/report/press/tokatsu01_hh_001025.html","published":"2026-07-10","period":"2026년 4월"},"checked":"2026-11-20","status":"verified","loc":"표(1)","limit":"3사 수치다. 전 국민의 선호나 모든 회사의 이용률이 아니다."},{"fact":"동일 발표의 재배달률은 7.6%였다(대형 택배 6사). 3사 참고치는 8.8%로 따로 제시된다.","apply":"응용: 시계열과 회사 범위를 맞춘 뒤 자사 재배달 수준과 비교한다.","source":{"publisher":"国土交通省","title":"宅配便 재배달 실태 조사","url":"https://www.mlit.go.jp/report/press/tokatsu01_hh_001025.html","published":"2026-07-10","period":"2026년 4월"},"checked":"2026-11-20","status":"verified","loc":"표(2)","limit":"앞의 31.0%와 모집단이 다르므로 두 수치의 차이나 상관으로 절감 효과를 계산하지 않는다."}],"pdf":[{"page":"p52–53","kind":"method","note":"공급 측 병목을 먼저 특정하고 바꿀 수 있는 변수에 시책을 연결한다. 택시 식을 택배에 그대로 복사하지 않는다."},{"page":"p67","kind":"method","note":"비용 항목 아래 실제 운영 원인을 찾는다."},{"page":"p71","kind":"method","note":"물류 인원 부족을 환경 변화의 영향으로 검토하는 예다. 택배 최종 배송이 병목이라는 직접 실증은 아니다."}],"problems":[{"row":545,"cond":"EC 확대·택배 기사 고령화에 따른 인원 부족 해결. 인원 증원만 아니라 필요 노동시간의 원인도 본다."},{"row":547,"cond":"트럭 운전사 부족 일반 문제. 택배 최종 배송의 가설을 쓰려면 사업 범위를 추가 확인한다."}],"cautions":["고령화와 EC 확대는 545 원문의 조건이다. 최근 통계만으로 이 문제의 병목이 재배달이라고 확정하지 않는다."]},{"id":"mobile","group":"G4","name":"이동통신","subs":["A08-2"],"scope":"이동통신 요금제 매출·가입자 기반. MNO(망 보유)인지 MVNO(망 임차)인지 먼저 확인한다.","character":"회선 하나가 지속 과금을 만들지만 사용량과 품질 요구는 다르다. 요금제를 바꾸면 가입자 증가뿐 아니라 기존 가입자의 이동으로 매출이 바뀐다. 연결 비용·망 투자와 판매 수수료도 사업자 유형에 따라 다르다.","firstQs":["신규 유입·외부 해지·자사 요금제 간 이동 중 무엇이 매출 변화를 만드는가?","사업자는 MNO인가 MVNO인가? 목표는 회선 수·매출·이익 중 무엇이며 단말 매출을 포함하는가?"],"lenses":[{"name":"평균 ARPU보다 요금제 이동표","hypothesis":"고가 요금제 매출 감소가 고객 이탈이 아니라 저가 요금제로의 내부 이동일 수 있다.","when":"요금제별 매출·가입자 자료가 주어진 경우.","split":"기초 회선 + 신규 − 해지 + 요금제 간 순이동 = 기말 회선. 각 회선의 적용 기간과 할인 후 단가로 매출 계산.","data":"요금제 간 이동, 신규·해지 코호트, 적용 월수, 할인 종료 시점","refute":"총매출만 있고 회선·이동 데이터가 없으면 요금제 구성 효과를 단정할 수 없다."},{"name":"데이터를 적게 쓰는 고객의 미충족 가치","hypothesis":"일부 고객은 큰 데이터 한도보다 단순 가격·설명·안정성을 중시할 수 있다.","when":"요금제 개편이나 저가 사업자 대응 문제.","split":"실사용량·통화·지원 요구별 고객층 → 과잉 지불과 불안 요인 → 선택을 바꾸는 가치.","data":"사용량 분포, 이탈 사유, 혼잡 시간 품질, 상담 비용, 경쟁 대안","refute":"저가층의 수요가 작거나 지원 원가가 과도하면 싼 요금제가 좋은 틈새라는 가설을 버린다."},{"name":"회선 성장과 품질·접속 비용의 연결","hypothesis":"회선이 늘어도 피크 사용량·접속 비용·판매비가 더 빨리 늘면 이익이 악화될 수 있다.","when":"성장 투자·망 확장·수익성 문제.","split":"회선·트래픽별 수입 → MNO 설비/접속 또는 MVNO 도매망 비용 → 획득·지원 비용. 혼잡과 이탈을 되먹임으로 본다.","data":"접속 계약, 피크 트래픽, 품질·해지, 회선당 공헌이익, 투자 회수 기간","refute":"사업자 유형을 모르면 비용을 추정할 수 없다. 통신 산업을 하나의 설비 원가 식으로 고정하지 않는다."}],"causal":{"cause":"저사용량 고객이 복잡한 대용량 요금제에 불만을 갖고 외부로 이탈한다(가설).","action":"대상 고객에 한해 단순한 저용량 요금제와 설명을 시험한다.","effect":"이탈 방지로 유지되는 공헌이익에서 고가층의 하향 이동 손실·전환 지원비를 뺀 값이 양수인지 본다. 가입자 수 증가만으로 성공을 판정하지 않는다.","metric":"대상층 외부 해지율, 내부 하향 이동, 할인 후 월 수입, 회선당 공헌이익, 품질","conditions":"대상 선별·망 품질·접속 계약 확인. 전 고객에게 할인하면 잠식이 유지 효과를 넘을 수 있다."},"trends":[{"fact":"日本通信은 2026년 9월 말 월 과금 회선이 114만이라고 반기보고서에 밝혔다.","apply":"응용: 저가·단순 요금제의 성장 가능성을 조사하되 회선 성장과 수익성은 따로 확인한다.","source":{"publisher":"日本通信","title":"第31期 半期報告書","url":"https://www.j-com.co.jp/ir/pdf/yuho_2027_q2.pdf","published":"2026-11-06","period":"2026년 4–9월"},"checked":"2026-11-20","status":"verified","loc":"본문 p7(파일 p10)","limit":"MVNO 한 회사의 회선 수다. MNO 전체 시장 또는 원문 인도 회사의 수치가 아니다."},{"fact":"같은 보고서는 새 음성·SMS 상호접속 서비스의 시작 계획을 기술 문제로 2027년 4월경으로 늦췄고, 접속 관련 원가를 기재했다.","apply":"응용: 요금·회선 확대 계획뿐 아니라 접속 준비, 투자·초기 비용, 출시 지연을 검토한다.","source":{"publisher":"日本通信","title":"第31期 半期報告書","url":"https://www.j-com.co.jp/ir/pdf/yuho_2027_q2.pdf","published":"2026-11-06","period":"2026년 4–9월 및 향후 계획"},"checked":"2026-11-20","status":"verified","loc":"본문 p7","limit":"출시 계획은 미래 전망이며 실적이 아니다. 일반적인 MNO 망 구축과 동일시하지 않는다."}],"pdf":[{"page":"p6–7","kind":"method","note":"목표·사업 범위·돈을 받는 지점을 확인한다."},{"page":"p35·53","kind":"method","note":"가설을 구별할 수 있는 분해를 선택한다. 책이 이동통신의 정답을 제시한 것은 아니다."}],"problems":[{"row":59,"cond":"통신 캐리어 매출 추정과 향상. 요금·회선·사업 범위부터 확인한다."},{"row":617,"cond":"인도 회사의 요금제별 자료 분석. 653과 같은 해외 문제이므로 독립 사례 두 개로 세지 않는다."},{"row":653,"cond":"617과 유사한 해외 요금제 자료 문제. 일본 최신 기업 자료는 응용 비교다."}],"cautions":["요금제·망 투자·보험 번들을 전력 소매 원문에서 옮겨오지 않는다."]},{"id":"streaming","group":"G5","name":"영상 스트리밍","subs":["A08-3"],"scope":"영상 배급·시청 서비스. 월 구독, 작품별 결제, 광고형 중 해당 모델을 확인한다.","character":"작품이 유입의 계기가 되고 다른 작품·추천·이용 편의가 다음 이용을 만든다. 권리 범위와 비용을 가진 콘텐츠 확보가 필요하며, 가입자 증가가 콘텐츠 투자 회수를 보장하지 않는다.","firstQs":["돈은 구독·작품 결제·광고 중 어디서 받는가? 직접 제작·권리 보유와 배급을 어디까지 하는가?","어떤 작품으로 들어온 사람이 언제 떠나는가? 신규·기존 시청자와 작품별 비용을 구별할 수 있는가?"],"lenses":[{"name":"유입 작품과 잔존 작품을 구별","hypothesis":"화제작은 첫 가입을 만들지만 완결 직후 이탈이 집중될 수 있다.","when":"구독형이고 작품 공개 일정과 가입·해지 코호트가 있을 때.","split":"유입 계기별 코호트 → 첫 작품 시청 → 다음 작품 발견 → 재이용·갱신. 해지 시점과 작품 공개를 함께 본다.","data":"유입 작품, 시청·탐색 이력, 코호트 잔존율, 공개 일정","refute":"개별 과금 모델이거나 화제작 시청자도 충분히 잔존하면 구독 해지 프레임을 우선하지 않는다."},{"name":"콘텐츠 포트폴리오의 증분 회수","hypothesis":"비싼 독점작보다 특정 고객층의 빈 시간을 채우는 작품군이 추가 이익을 만들 수 있다.","when":"콘텐츠 투자 우선순위 문제.","split":"작품·장르별 추가 유입/이탈 방지 가치 − 권리·제작·마케팅 비용. 시청자 중복과 원래 남을 고객을 제외한다.","data":"작품별 획득비·권리 기간, 중복 시청, 추가 지불·잔존, 대체 콘텐츠","refute":"시청 시간이 늘어도 추가 수입·이탈 방지와 연결되지 않으면 투자 효과라고 볼 수 없다."},{"name":"한정된 여가 시간의 점유","hypothesis":"다른 OTT뿐 아니라 게임·숏폼·외출이 시청 시간을 빼앗을 수 있다.","when":"가입형 시장 포화나 이용 정체를 설명할 때.","split":"이용 상황별 여가 시간 → 대체 수단 → 우리 서비스가 선택되는 이유. 가격과 시간의 제약을 따로 묻는다.","data":"이탈 후 대안, 상황별 이용 시간, 동시 구독·지불 부담","refute":"정체 원인이 결제 오류·지역 제한 등 명확한 운영 문제면 광범위한 시간 경쟁보다 직접 원인을 우선한다."}],"causal":{"cause":"화제작 완결 뒤 다음 작품을 찾지 못해 해지한다(구독형 가설).","action":"해당 코호트에 관심 장르의 다음 작품·공개 일정을 제시하고 비교 집단과 갱신을 비교한다.","effect":"다음 시청으로 갱신 공백을 줄이면 증분 잔존 수입이 생긴다. 알림 비용·할인·추가 권리 비용을 차감해 효과를 평가한다.","metric":"코호트 갱신율, 다음 작품 도달률, 증분 공헌이익, 알림 거부","conditions":"추천의 적합성과 콘텐츠 권리 필요. 과도한 알림·스포일러, 할인 대기, 자연 잔존을 성과로 세는 오류에 주의."},"trends":[{"fact":"U-NEXT HOLDINGS의 2026년 8월기 결산 설명 자료는 콘텐츠 배급 과금 사용자 수가 전년보다 9.2%(45만) 늘었다고 제시한다.","apply":"응용: 유입과 이탈의 순증을 분리해 묻고, 특정 기업의 성장과 시장 전체 성장을 구분한다.","source":{"publisher":"U-NEXT HOLDINGS","title":"2026年8月期 決算説明資料","url":"https://unext-hd.co.jp/ir/archive/pdf/2026/202608_annual.pdf","published":"2026-10-15","period":"2026년 8월기"},"checked":"2026-11-20","status":"verified","loc":"p6 사업 KPI","limit":"자사 과금 사용자 KPI이며 영상 시장 전체의 성장률이 아니다."},{"fact":"DCAJ의 공개 2025 보고서는 2024년 영상 배급 시장을 5,710억 엔으로 추정하고 미래 예측을 따로 제시한다.","apply":"응용: 회사 실적과 시장 추정의 기간을 맞추고, 최신 보고서 발행연도와 대상연도를 구별한다.","source":{"publisher":"デジタルコンテンツ協会","title":"動画配信市場調査レポート2025 공개 안내","url":"https://dcaj.or.jp/project/sale/index.html","published":"2025년(일자 미확인)","period":"2024년 추정 실적"},"checked":"2026-11-20","status":"verified","limit":"최신 연도 시장 실적이라고 표시하지 않는다. 예측을 현재 실적으로 사용하지 않는다."}],"pdf":[{"page":"p38","kind":"method","note":"콘텐츠·플랫폼·단말을 나누는 미디어 관점과 영화관의 시간 경쟁을 영상 배급에 응용한다."},{"page":"p63","kind":"method","note":"이용 목적을 나눈 영화관 예를 응용한다. 책이 영상 서비스의 해지율·LTV를 실증한 것은 아니다."},{"page":"p37","kind":"direct","note":"구독 영상의 확산으로 대여 비디오의 시청 전후 수고가 상대적 약점이 되는 예. 현재 시장 수치의 근거는 아니다."},{"page":"p61","kind":"direct","note":"배송 렌털에서 스트리밍으로 유통 경로를 바꾸는 예. 신규 유입·해지율의 실증은 아니다."}],"problems":[{"row":462,"cond":"영상 배급 시장 추정. 과금 유형과 시장 범위를 확인한다."},{"row":626,"cond":"스트리밍 회사 매출·자료 해석. 654는 같은 주제이며 제공 도표에 따라 가설을 바꾼다."},{"row":654,"cond":"626 유사 문제. 원문에 없는 구독형을 확정하지 않는다."}],"cautions":["구독 코호트 관점은 구독 모델이 확인된 경우에만 사용한다."]},{"id":"games","group":"G5","name":"게임회사(하드·소프트·IP)","subs":["A10-2"],"scope":"Nintendo 같은 하드·소프트·IP를 함께 가진 회사. 순수 모바일 개발사와 동일한 구조로 보지 않는다.","character":"기기 보급 기반이 소프트 판매를 만들고 매력적인 소프트가 기기 선택을 돕는다. 신기기 전환기, 기존 작품, 외부 라이선스 등 회수 경로의 시간과 위험이 다르다.","firstQs":["회사 전체 매출인가, 기기·소프트·IP 중 특정 사업인가? 신기기 전환기의 어느 시점인가?","기기 설치 기반의 확대, 기기당 소프트 구매, 게임 밖 IP 회수 중 어느 연결이 약한가?"],"lenses":[{"name":"기기와 소프트의 서로 다른 시계","hypothesis":"신기기 수요가 강해도 생산·공급 또는 소프트 구성이 부족하면 회수 속도가 달라진다.","when":"전용 게임기 업체의 성장·전환 문제.","split":"가동 설치 기반 × 이용자당 소프트 구매, 새 기기 판매와 기존 보유자 판매를 분리. 누적 출하를 활성 이용자와 동일시하지 않는다.","data":"기기 보급·공급, 활성 이용, 장착률, 발매 일정, 재고","refute":"순수 모바일·타사 기기용 회사라면 자사 기기 보급을 뿌리로 놓지 않는다."},{"name":"신작 흥행과 기존 작품 회수의 조합","hypothesis":"신작 성공 확률만 높이기보다 기존 작품의 재판매·추가 콘텐츠가 위험을 분산할 수 있다.","when":"소프트 포트폴리오·개발 투자 문제.","split":"신작/기존작 × 자체/타사 × 판매/추가 결제. 매출뿐 아니라 개발비·권리·운영 비용을 나눈다.","data":"작품 연령별 판매, 개발비·회수 기간, 업데이트 비용, 구매자 중복","refute":"기존작 수요가 낮거나 신작 잠식·이식 비용이 크면 재활용이 이익을 보장하지 않는다."},{"name":"IP 노출과 게임 구매의 연결","hypothesis":"영화·상품·체험이 인지를 높여 게임 구매로 이어질 수 있다.","when":"IP 확장 또는 스마트폰 게임에 대한 대응을 검토할 때.","split":"외부 IP 사업 자체 수입 + 게임으로의 증분 전환 − 투자·파트너 비용·브랜드 위험.","data":"라이선스 조건, 접점별 신규 고객, 실제 구매 전환, 지역·연령별 반응","refute":"노출은 늘어도 게임 구매가 늘지 않거나 브랜드 신뢰가 훼손되면 시너지를 주장할 수 없다."}],"causal":{"cause":"관심 고객이 기기는 보유했지만 구매할 다음 게임을 찾지 못한다(가설).","action":"보유·이용 이력에 맞춰 기존 작품 체험판과 관련 신작을 제안한다.","effect":"발견 장벽을 낮춰 증분 소프트 구매를 만든다. 할인 잠식과 원래 살 고객을 제외하고 개발·판촉비 차감 후 회수를 평가한다.","metric":"기기당 소프트 구매, 체험→구매 전환, 증분 공헌이익, 활성 이용","conditions":"고객 데이터 동의·기기 호환·적합한 작품 필요. 할인 대기와 기존 정가 판매 잠식 가능."},"trends":[{"fact":"Nintendo는 2026-04~09 중간 실적에서 Switch 2 하드649만 대, 소프트2,449만 개 판매를 공시했다.","apply":"응용: 세대 전환기에는 회사 매출 한 줄보다 설치 기반·소프트 연결·공급 제약을 나눠 본다.","source":{"publisher":"任天堂","title":"2027年3月期 第2四半期 決算短信","url":"https://www.nintendo.co.jp/ir/pdf/2026/261105.pdf","published":"2026-11-05","period":"2026년 4–9월"},"checked":"2026-11-20","status":"verified","loc":"p3 사업 설명","limit":"한 회사의 중간 실적이며 연간 전체 게임 시장 수치가 아니다."},{"fact":"같은 발표의 디지털 매출은2,496억 엔(전년 동기비+60.5%), 모바일·IP 관련 수입 등은627억 엔(+87.9%)이었다.","apply":"응용: 다운로드 판매와 게임 밖 IP 수입을 한 덩어리의 디지털 매출로 섞지 않는다.","source":{"publisher":"任天堂","title":"2027年3月期 중간 결산","url":"https://www.nintendo.co.jp/ir/pdf/2026/261105.pdf","published":"2026-11-05","period":"2026년 4–9월"},"checked":"2026-11-20","status":"verified","loc":"p3","limit":"관세 환급 등 이익 영향도 있어 전체 이익 변화를 IP 성장 하나로 설명하지 않는다."}],"pdf":[{"page":"p38","kind":"method","note":"미디어의 콘텐츠·플랫폼·단말 구별을 게임 생태계에 응용한다."},{"page":"p62–63","kind":"method","note":"차별화와 수익 지점 구별. 게임회사 전체를 IP 매출 하나로 축소하지 않는다."}],"problems":[{"row":572,"cond":"Nintendo 전체 매출 향상. 하드·소프트·IP 범위를 확인한다."},{"row":541,"cond":"스마트폰 게임에 대한 가정용 게임기 대응. 가격만 아니라 전용기기의 이용 경험과 소프트를 비교한다."}],"cautions":["영화283·레코드475는 별도 콘텐츠 사례이며 게임 문제로 재분류하지 않는다."]},{"id":"saas","group":"G5","name":"업무용 SaaS","subs":["A08-4"],"scope":"웹 보충 사례: 기업이 반복 과금으로 쓰는 업무 소프트웨어를 가정한다. 원문543은 회의 도구 개발·이용자 확보만 명시하고 구독·ARR는 명시하지 않는다.","character":"구매 승인자와 실제 사용자가 다를 수 있다. 도입 후 기존 업무·권한·데이터에 연결돼야 가치가 실현되며 계정 수만으로 정착을 알 수 없다.","firstQs":["누가 사고 누가 쓰며 어떤 업무 결과를 바꾸는가? 가격이 좌석·사용량·결과 중 무엇에 연동되는가?","첫 도입에서 반복 업무 정착까지 어디서 막히는가? 데이터·보안·권한·승인 중 필수 조건은 무엇인가?"],"lenses":[{"name":"가입 퍼널 뒤의 첫 업무 완료","hypothesis":"가입은 쉬워도 데이터 이전·권한 설정 때문에 첫 핵심 업무를 끝내지 못해 이탈한다.","when":"도입은 늘지만 이용·갱신이 약한 기업용 도구.","split":"도입 승인 → 설정·연계 → 첫 핵심 업무 완료 → 반복 이용 → 부서 확장. 클릭 수 대신 업무 완료를 본다.","data":"단계별 완료·소요 시간, 실패 원인, 관리자와 사용자 인터뷰","refute":"이탈 이유가 가격 또는 핵심 기능 부적합이면 온보딩 개선으로 해결되지 않는다."},{"name":"유료 좌석과 고객 조직의 실제 가치","hypothesis":"구매한 좌석 중 비활성 사용자가 많으면 좌석 확대 매출이 다음 갱신 때 줄 수 있다.","when":"좌석 과금이 확인된 경우에만 사용.","split":"고객 조직 수 × 조직당 유료 좌석 × 할인 후 가격. 좌석 활성·고객 축소·고객 해지를 분리한다.","data":"계약·활성 좌석, 갱신·축소, 업무별 이용, 계정별 지원비","refute":"사용량·성과 과금이라면 좌석 식을 버린다. 543 원문에 이 모델을 강제하지 않는다."},{"name":"AI 기능을 업무 책임까지 연결","hypothesis":"생성 결과만 빠른 기능보다 승인·감사·예외 처리까지 연결되는 기능이 업무 시간을 줄일 수 있다.","when":"기업용 AI 기능·차별화 문제.","split":"입력·데이터 권한 → 제안/자동 실행 → 검토·승인 → 오류 복구. 줄인 작업 시간에서 검증·수정 시간을 뺀다.","data":"업무 전체 시간, 오류·재작업, 승인 이력, 권한·보안 요건","refute":"수정·검수 비용이 절감 시간을 넘거나 책임 소재를 정할 수 없으면 자동 실행을 확대하지 않는다."}],"causal":{"cause":"신규 조직이 데이터 연계와 권한 설정에 막혀 첫 업무를 완료하지 못한다(가설).","action":"고빈도 업무 한 개에 표준 연계 템플릿과 관리자 설정 지원을 제공한다.","effect":"첫 업무 완료까지 시간을 줄여 반복 이용·갱신을 높인다. 연계 구축·지원비를 차감한 고객별 공헌이익으로 평가한다.","metric":"첫 가치 도달 시간, 핵심 업무 완료율, 반복 이용, 조직 갱신, 지원비","conditions":"표준화 가능한 업무·데이터 동의·접근 권한이 필요하다. 고객별 개발이 늘어 저마진 프로젝트가 되거나 잘못된 자동 처리가 확산될 수 있다."},"trends":[{"fact":"freee는 2026-06-16에 AI 어시스턴트와 업무 맞춤형 연계·개발 제공을 발표했다.","apply":"응용: 독립적인 AI 기능보다 업무 데이터·다른 도구와의 연결이 차별화인지 묻는다.","source":{"publisher":"freee","title":"AIアシスタント・カスタムオーダー 발표","url":"https://corp.freee.co.jp/news/20260616freee_AIassistant&customorder.html","published":"2026-06-16","period":"2026년 제품 발표"},"checked":"2026-11-20","status":"verified","limit":"회계·업무 도구의 보충 사례이며543 온라인 회의 도구의 원문 사실이 아니다."},{"fact":"같은 발표는 업무 연계와 자동화 구성을 설명한다. 이는 단순 문장 생성에서 업무 실행 지원으로의 제품 확장 사례다.","apply":"응용: 자동화 범위가 커질수록 승인·권한·오류 복구와 실제 절감 시간을 검증한다.","source":{"publisher":"freee","title":"AI 업무 지원·맞춤형 연계 발표","url":"https://corp.freee.co.jp/news/20260616freee_AIassistant&customorder.html","published":"2026-06-16","period":"2026년 제품 발표"},"checked":"2026-11-20","status":"verified","limit":"한 기업의 제품 방향이다. 업계 전체 채택률이나 고객 생산성 개선을 입증하지 않는다."}],"pdf":[{"page":"p6–7·63","kind":"method","note":"돈을 받는 지점과 고객·사업 범위를 확인하는 방법을 응용한다. SaaS ARR·해지의 직접 근거가 아니다."},{"page":"p19–20","kind":"method","note":"기능 제시만 아니라 원인을 바꾸는 인과와 목표 효과를 설명한다."}],"problems":[{"row":543,"cond":"1차 온라인 회의 도구 차별화·이용자 확보 부분만 연결. 2차 손목시계는 범위 밖이다. 원문에는 구독·ARR가 없어 해당 분석은 보충 가정을 명시해야 한다."}],"cautions":["웹 보충 표시를 제목 가까이에 노출한다. 원문 정답이나 PDF 직접 사례라고 표시하지 않는다."]},{"id":"travel","group":"G6","name":"여행 중개","subs":["A11-2"],"scope":"여행사의 예약 중개·여행 상품 판매. OTA, 매장형 대리점, 여행 주최자의 수입·책임을 구분한다.","character":"소비자는 직접 예약할 수도 있다. 중개자는 비교·조합·불확실성 해소·여행 중 지원 중 어디에서 지불할 가치를 만드는지 설명해야 한다. 취급액 전체가 여행사의 순수입은 아니다.","firstQs":["직접 예약 대신 이 회사를 쓰는 이유가 가격·탐색 절약·복잡한 조합·사후 지원 중 무엇인가?","단순 중개 수수료인가, 패키지 마진인가? 취급액·회계상 매출·순수입 중 목표는 무엇인가?"],"lenses":[{"name":"온라인 대 오프라인보다 여행 복잡도","hypothesis":"단순 숙박은 직접 예약으로 이동해도 복잡한 일정·단체·해외 여행에는 지원 가치가 남을 수 있다.","when":"매장형 쇠퇴·온라인 전환 또는 고객층 선택 문제.","split":"여행 목적·인원·국가·조합 복잡도 → 필요한 상담·지원 → 채널별 제공 비용.","data":"상담 이유, 직접 예약 대안, 상품별 마진·상담 시간·전환","refute":"고객이 추가 지원에 지불하지 않거나 자동 도구가 같은 가치를 싸게 제공하면 오프라인 유지 논리가 약하다."},{"name":"취급액에서 남는 돈까지","hypothesis":"고액 상품의 취급액이 늘어도 낮은 수수료·지원비 때문에 이익은 줄 수 있다.","when":"매출 확대·상품 구성·채널 비교 문제.","split":"예약 건 × 거래액 × 수수료율 또는 패키지 마진 − 획득·상담·취소 대응 비용. 회계 표시를 확인한다.","data":"상품·채널별 수수료율, 마진, 광고비, 취소·재예약·지원비","refute":"회사에 따라 본인/대리인 회계가 달라 겉 매출만으로 회사 간 효율을 비교할 수 없다."},{"name":"예약 후 사고 대응이 만드는 재구매","hypothesis":"결항·변경처럼 드문 문제를 해결하는 능력이 재구매 이유가 될 수 있다.","when":"차별화·서비스 유지·지원 투자 문제.","split":"예약 전 탐색 → 결제 → 출발 전 변경 → 여행 중 문제 → 다음 예약. 지원의 지불 가치와 처리 원가를 나눈다.","data":"문제 발생·해결 시간, 지원 원가, 재구매·추천, 보장 조건","refute":"문제 발생률·지불 의향이 매우 낮으면 모든 예약에 고비용 지원을 붙이는 것은 과잉이다."}],"causal":{"cause":"고객이 복잡한 일정 조합에 시간을 쓰지만 일반 예약 목록만 제공돼 직접 예약으로 빠진다(가설).","action":"복잡한 일정 고객을 골라 조합 상담과 변경 지원을 묶은 상품을 시험한다.","effect":"탐색 부담과 실패 불안을 낮춰 예약 전환·순수입을 높인다. 상담·지원 원가와 취소 위험을 뺀 공헌이익으로 비교한다.","metric":"대상 고객 전환, 예약당 순수입, 상담 시간, 취소 비용, 재구매","conditions":"조합 역량·재고 연계·지원 책임과 가격 설명 필요. 상담만 받고 타사 결제하거나 복잡한 고객만 몰릴 수 있다."},"trends":[{"fact":"観光庁의 2026년 8월 주요 여행업자 43사 취급액은 전년 동월비 100.9%로 정정됐다(2026-10-30 정정).","apply":"응용: 취급액 변화와 실제 수수료·마진 변화를 따로 분석한다.","source":{"publisher":"観光庁","title":"主要旅行業者の旅行取扱状況 2026年8月","url":"https://www.mlit.go.jp/kankocho/news13_00008.html","published":"2026-10-30 정정","period":"2026년 8월"},"checked":"2026-11-20","status":"verified","loc":"정정 후 첨부표 https://www.mlit.go.jp/kankocho/content/002029213.pdf","limit":"43사 취급액이며 전체 여행 소비·여행사 순매출이 아니다. 정정 전101.1%를 쓰지 않는다."},{"fact":"2026-11-18 발표된 일본인 국내 여행 소비 3분기 속보는 여행자 수·1인당 지출·총지출을 따로 제시한다.","apply":"응용: 여행객이 늘어서인지 여행 내용·가격이 바뀌어서인지 분리하고, 그중 중개를 통하는 비중을 추가 확인한다.","source":{"publisher":"観光庁","title":"旅行・観光消費動向調査 2026年7–9月期 速報","url":"https://www.mlit.go.jp/kankocho/news02_00106.html","published":"2026-11-18","period":"2026년 7–9월"},"checked":"2026-11-20","status":"verified","limit":"일본인 국내 여행 소비다. 8월43사 자료와 모집단·기간이 달라 직접 나눠 중개 점유율을 계산하지 않는다."}],"pdf":[{"page":"p35·53","kind":"method","note":"가설과 비교 대상을 맞춘 분해·시장 정의를 사용한다."},{"page":"p63","kind":"method","note":"수익 지점을 먼저 확인한다. 여행사 수수료율 자체의 책 근거는 아니다."}],"problems":[{"row":16,"cond":"매장형과 웹형 여행사 추이 도표를 읽고 전략을 고른다. 원문 A/B 회사 표기가 혼재하므로 제공 조건 확인."},{"row":373,"cond":"HIS 중기 경영 계획. 회사 범위를 확인하고 단순 OTA라고 가정하지 않는다."},{"row":375,"cond":"JTB 매출 향상. 취급액·매출·마진과 고객 목적을 확인한다."}],"cautions":["호텔 FC 결정334는 여행 중개 문제로 연결하지 않는다."]},{"id":"delivery","group":"G6","name":"음식배달 플랫폼","subs":["A09-2","A06-3"],"scope":"소비자·점포·배달원을 연결하는 플랫폼. 음식점 자체 배달·택배와 구별한다.","character":"앱 가입자 수만 많아도 주문이 안 될 수 있다. 같은 구역·시간에 소비자 수요, 준비 가능한 점포, 배달원이 함께 있어야 거래가 성사된다. 지역 확대는 이 세 밀도를 다시 만드는 투자다.","firstQs":["어떤 구역·시간에 점포 부족, 주문 부족, 배달원 부족, 조리 지연 중 무엇이 거래를 막는가?","목표가 거래액인가 주문당 공헌이익인가? 가맹점 확대와 새 지역 진출 중 어느 투자 결정을 묻는가?"],"lenses":[{"name":"세 참여자의 지역×시간 밀도","hypothesis":"점포 수를 늘려도 주문 시간과 배달원 공급이 맞지 않으면 취소·대기만 늘 수 있다.","when":"가맹점 확대 대 지역 확장, 서비스 품질 문제.","split":"구역·시간별 소비자 주문 의향 → 점포 선택·주문 → 조리 완료 → 배달원 매칭 → 전달.","data":"선택 가능한 점포, 주문 전환, 배달원 수락, 조리·합류 시간, 취소","refute":"기존 구역이 이미 충분히 촘촘하고 추가 점포가 기존 수요만 나누면 새 지역 또는 다른 이용 상황이 나을 수 있다."},{"name":"총거리보다 준비·대기의 배차 경제성","hypothesis":"배달 거리는 짧아도 조리 대기·합류 동선 때문에 시간당 처리량이 낮을 수 있다.","when":"배송 원가·배달원 부족·시간 약속 문제.","split":"점포 도착 → 준비 대기 → 픽업 → 이동 → 인도. 묶음 배달의 추가 우회와 품질을 비교한다.","data":"단계별 시간, 주문당 보상·수입, 시간 준수, 음식 상태·환불","refute":"묶음 배달이 식음 품질·대기·환불을 악화하면 효율 향상이라고 단정하지 않는다."},{"name":"회원제의 빈도 증가와 보조금 잠식","hypothesis":"무료 배송 회원제가 주문을 늘려도 원래 주문할 고객의 수수료를 포기할 수 있다.","when":"멤버십·쿠폰·신규 고객 확보 문제.","split":"회원료 + 증분 주문 공헌이익 − 기존 주문 할인 손실 − 혜택 비용. 새 주문과 채널 이동을 구별한다.","data":"비회원 비교 집단, 혜택 전후 빈도, 주문당 공헌이익, 회원 잔존","refute":"증분 주문이 적고 고비용 이용자만 몰리면 회원 수가 늘수록 손실이 커질 수 있다."}],"causal":{"cause":"저녁 피크에 조리 완료 시점과 배달원 도착이 어긋나 대기·취소가 늘어난다(가설).","action":"협력 점포 일부에서 준비 완료 예측과 픽업 예약 배차를 시험한다.","effect":"기다리는 시간을 줄여 배달원 시간당 완료 주문과 정시 전달을 개선한다. 잘못된 예측·대기 보상·점포 업무 부담을 포함해 순효과를 본다.","metric":"픽업 대기, 시간당 완료 주문, 정시율, 취소·환불, 주문당 공헌이익","conditions":"점포 데이터 정확도·준비 협력 필요. 배달원 조기 배차를 줄이다 합류가 늦어질 수도 있어 양쪽 대기·품질을 함께 본다."},"trends":[{"fact":"Uber Japan은 2026-07-28 Uber One 일반 월 요금을 498→698엔, 학생 요금을349→298엔으로 바꾸고 혜택 범위를 조정한다고 발표했다.","apply":"응용: 동일한 할인 전략으로 묶지 말고 고객층별 가격·이용 빈도·원가를 따로 평가한다.","source":{"publisher":"Uber Japan","title":"Uber One アップデート","url":"https://www.uber.com/jp/ja/newsroom/uber-one-update-2026-july/","published":"2026-07-28","period":"2026년 요금 변경"},"checked":"2026-11-20","status":"verified","limit":"가격 변경이 수익 개선을 증명하지 않는다. 적용 시점·기존 회원 조건은 원문을 확인한다."},{"fact":"東急ストア는 2026-10-29 Uber Eats를 통한 식품·일용품 배달을 36개 점포에서 시작한다고 발표했다.","apply":"응용: 외식뿐 아니라 장보기 상황으로 넓어지면 상품 피킹·결품·무게·배달 시간의 병목이 달라진다.","source":{"publisher":"東急ストア","title":"Uber Eats デリバリーサービス開始","url":"https://www.tokyu-store.co.jp/Portals/0/PDF/newsrelease/2026/2026.10.29UberEats.pdf","published":"2026-10-29","period":"2026년10월 서비스 개시"},"checked":"2026-11-20","status":"verified","loc":"p1–2 서비스 개요","limit":"한 사업자의 출시 사례이며 장보기 배달 전체의 수익성·수요 증가는 미확인."}],"pdf":[{"page":"p33","kind":"method","note":"식사 상황과 배달 대체재의 범위를 검토하는 방법. 피자 점포와 플랫폼은 수익 주체가 다르다."},{"page":"p35·52–53","kind":"method","note":"가설에 맞는 분해와 공급 병목 질문을 응용한다. 책의 플랫폼 단위경제 실증은 아니다."}],"problems":[{"row":260,"cond":"도쿄 Uber Eats 시장 추정 뒤 가맹점 확대와 지역 확장 선택. 기존·신규 구역의 밀도와 증분 투자 비교가 직접 맞는다."},{"row":468,"cond":"코로나 자숙기의 시장 증가 추정. 일시적 상황을 현재 성장률로 사용하지 않는다."}],"cautions":["200의 UBER는 배달이 특정되지 않아 음식배달 근거로 세지 않는다."]},{"id":"outdoor","group":"G6","name":"옥외광고","subs":["A10-3"],"scope":"옥외 간판·디지털 화면 등 광고 공간을 파는 매체 사업자. 광고주가 스포츠 후원을 고르는 문제와 다르다.","character":"장소·시간·통행자의 상황이 광고 가치의 일부다. 광고주는 노출 수가 아니라 필요한 사람에게 닿아 어떤 행동·기억을 만드는지 묻는다. 좋은 위치와 측정 가능한 효과가 같은 것은 아니다.","firstQs":["광고주가 원하는 것은 넓은 인지·특정 지역 방문·구매 중 무엇인가? 어떤 사람에게 언제 닿아야 하는가?","매체의 위치·슬롯·가동·판매율과 광고주 성과 중 어느 문제가 매출 정체를 만드는가?"],"lenses":[{"name":"총통행량보다 타깃×장소의 문맥","hypothesis":"더 작은 유동량이라도 구매 직전의 적합한 고객에게 닿는 위치가 가치 있을 수 있다.","when":"온라인 대비 옥외의 우위·위치 선택 문제.","split":"통행자 → 광고주 타깃 적합 → 시인 가능·반복 → 관련 행동. 각 단계는 관측 가능 범위를 명시한다.","data":"시간대별 통행·타깃 구성, 시야·체류, 주변 업종·행사, 광고주 목적","refute":"주요 타깃이 거의 지나지 않거나 화면을 볼 수 없는 위치면 총유동량은 설득 근거가 아니다."},{"name":"한 화면의 판매 가능한 시간 재고","hypothesis":"피크는 팔려도 비수기·시간대 슬롯이 남아 전체 수익이 낮을 수 있다.","when":"디지털 옥외 매체 판매·가격 구성 문제.","split":"위치별 판매 가능 슬롯 × 판매율 × 실수취 단가 − 운영·판매 비용. 반복 노출과 과도한 슬롯 분할의 효과를 본다.","data":"슬롯 판매율, 할인·대행 수수료, 화면 가동, 광고주 갱신","refute":"정적 간판 장기 계약 모델이면 시간 슬롯 식을 강제하지 않는다. 노출 약화로 갱신이 떨어질 수 있다."},{"name":"측정 가능한 행동과 증분 효과","hypothesis":"QR·검색·방문 측정은 도움이 되지만 원래 올 고객을 광고 효과로 셀 수 있다.","when":"광고주에게 효과를 제시하거나 측정 상품을 만들 때.","split":"노출 지표와 행동 지표를 분리 → 유사 지역·기간 비교 → 날씨·행사·다른 광고 영향을 점검.","data":"목적에 맞는 브랜드 조사·방문·검색, 비교 지역, 동시 캠페인","refute":"노출·방문 표본이 편향되거나 대조 조건이 다르면 인과 효과라고 말하지 않는다. 직접 클릭이 적다고 브랜드 효과가 없다는 뜻도 아니다."}],"causal":{"cause":"지역 상점 광고주가 매체의 타깃 적합과 효과를 이해하지 못해 계약을 갱신하지 않는다(가설).","action":"특정 상권·목적에 맞춘 위치 묶음과 간단한 비교 측정을 제공한다.","effect":"관련 고객에 대한 도달과 검증 가능한 가치를 보여 갱신·실수취 단가를 개선한다. 측정·영업비를 차감하고 광고주 목적 달성도 같이 확인한다.","metric":"광고주 갱신, 실수취 단가·판매율, 목적별 도달/인지/방문, 측정·영업비","conditions":"위치·시간 데이터와 적절한 비교 조건 필요. 개인정보·표본 편향·효과 과장과 측정 비용 증가에 주의."},"trends":[{"fact":"電通의 2026-03-05 발표는 2025년 일본 광고비에서 인터넷 비중이 50.2%였다고 추정했다.","apply":"응용: 디지털 경쟁을 인정하면서, 같은 클릭 지표로만 경쟁하지 않고 장소·문맥·보완 도달의 가치를 검증한다.","source":{"publisher":"電通","title":"2025年 日本の広告費","url":"https://www.dentsu.co.jp/news/release/2026/0305-011003.html","published":"2026-03-05","period":"2025년 추정"},"checked":"2026-11-20","status":"verified","limit":"전체 광고비 비중이며 특정 옥외 사업자의 성과가 아니다."},{"fact":"같은 발표는 인터넷 광고 확대와 함께 옥외·교통광고도 증가했다고 설명한다.","apply":"응용: 온라인 확대를 옥외 쇠퇴와 등치하지 않는다. 지역 행사·관광 등 자사 매체와 관련된 원인을 따로 확인한다.","source":{"publisher":"電通","title":"2025年 日本の広告費","url":"https://www.dentsu.co.jp/news/release/2026/0305-011003.html","published":"2026-03-05","period":"2025년 추정"},"checked":"2026-11-20","status":"verified","limit":"집계상 동반 증가다. 관광·행사가 모든 매체의 성장 원인이라고 입증한 것은 아니다."}],"pdf":[{"page":"p35·53","kind":"method","note":"목적·경쟁 범위와 가설을 먼저 정한다."},{"page":"p19–20·63","kind":"method","note":"왜 사실인가와 왜 목표에 중요한가를 나누고 인과를 설명한다. 옥외 효과 측정의 직접 실증은 아니다."}],"problems":[{"row":278,"cond":"C열에 옥외 간판 광고회사 매출 향상 질문이 있고 본문은 온라인 대비 우위 메모다. 기존 fragment 제외 플래그 때문에 기본 목록에 없을 수 있지만 원문 질문은 존재한다."}],"cautions":["원문·라벨을 무단 수정하지 않는다. 533 광고주 스포츠 후원 선택은 매체 운영자 문제와 구분한다."]}]}}</script>
<script>(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('data').textContent);
  const T = D.taxonomy;
  const ARCH = new Map(), SUB = new Map();
  T.archetypes.forEach(a => { ARCH.set(a.id, a); a.subtypes.forEach(s => SUB.set(s.id, Object.assign({ arch: a.id }, s))); });
  const TYPE_NAME = Object.fromEntries(T.problemTypes.map(t => [t.id, t.name]));
  const FERMI_NAME = Object.fromEntries(T.fermiTargets.map(t => [t.id, t.name]));
  const MODES = [['all', '전체'], ['case', '케이스'], ['fermi', '페르미'], ['mixed', '혼합']];
  const MODE_NAME = { case: '케이스', fermi: '페르미', mixed: '혼합' };
  const EXCL_NAME = { finance: '제외: 금융', interview: '제외: 면접 경험담', fragment: '제외: 문제 조각' };
  const PAGE = 150;
  const norm = s => (s || '').normalize('NFKC').toLowerCase();
  const nameOf = id => ARCH.has(id) ? ARCH.get(id).name : (SUB.has(id) ? SUB.get(id).name : id);
  const archOf = id => id ? id.slice(0, 3) : null;
  // ---- 상재 6묶음 overlay (system-design §18): 기존 원형·유형 ID는 그대로, 탐색 묶음만 얹는다 ----
  const DP = D.deep || null;
  const GRP = new Map(), SUB_GRP = new Map();
  if (DP) DP.groups.concat([DP.public]).forEach(g => { GRP.set(g.id, g); g.kinds.forEach(k => k.subs.forEach(s => SUB_GRP.set(s, g.id))); });
  const ROW_ALSO = DP ? DP.rowAlso : {};
  const DEEP = new Map((DP ? DP.items : []).map(x => [x.id, x]));
  const grpName = gid => gid === 'U' ? '미분류(商材 미상)' : GRP.has(gid) ? GRP.get(gid).name : '';

  // ---- items: past problems (one per 정규화 중복 group) + supplements ----
  const items = [];
  const byKey = new Map();
  D.groups.forEach(g => {
    const sub = g.sub ? SUB.get(g.sub) : null;
    const meta = g.rows.map(r => [r.company, r.tag, r.stage, r.format, r.memo, r.time].join(' ')).join(' ');
    const it = Object.assign({}, g, {
      kind: 'past', key: String(g.id),
      hay: norm([g.title, g.text, meta, sub && sub.name, sub && ARCH.get(sub.arch).name, sub && grpName(SUB_GRP.get(sub.id)), g.note,
        g.also.map(nameOf).join(' ')].join(' ')),
      rowSet: new Set(g.rows.map(r => String(r.row))),
    });
    items.push(it); byKey.set(it.key, it);
  });
  T.archetypes.forEach(a => a.subtypes.forEach(s => s.supplements.forEach(sp => {
    const it = { kind: 'sup', key: sp.id, id: sp.id, sub: s.id, arch: a.id, mode: sp.kind, types: sp.types, also: [],
      fermi: sp.fermi, scope: sp.scope, text: sp.text, exclude: null, review: false, rowSet: new Set(),
      hay: norm([sp.text, s.name, a.name, sp.id, '보충'].join(' ')) };
    items.push(it); byKey.set(it.key, it);
  })));

  // ---- state <-> URL hash ----
  // v = learn | practice | refs. Links without v but with practice keys keep opening 문제 연습 (old links).
  const st = { v: 'learn', f: '', from: '', d: '', dfrom: '', q: '', m: 'all', t: [], a: '', s: '', g: '', x: false, r: false, sel: '', c: '' };
  const VIEWS = ['learn', 'practice', 'deep', 'refs'], PRACTICE_KEYS = ['q', 'm', 't', 's', 'a', 'g', 'x', 'r', 'sel', 'c'];
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    st.v = VIEWS.includes(p.get('v')) ? p.get('v') : PRACTICE_KEYS.some(k => p.has(k)) ? 'practice' : 'learn';
    if (st.v === 'deep' && !DP) st.v = 'learn';
    const FW = T.frameworks || {};
    st.f = FW[p.get('f')] ? p.get('f') : ''; st.from = FW[p.get('from')] ? p.get('from') : '';
    st.d = DEEP.has(p.get('d')) ? p.get('d') : ''; st.dfrom = DEEP.has(p.get('dfrom')) ? p.get('dfrom') : '';

      h('dl', { class: 'ldl' },
        h('dt', null, '이 조건이면 쓴다'), h('dd', null, l.when),
        h('dt', null, '가설'), h('dd', null, l.hypothesis),
        h('dt', null, '나누는 법·물을 것'), h('dd', null, l.split),
        h('dt', null, '확인할 자료'), h('dd', null, l.data),
        h('dt', null, '반증 — 이러면 버린다'), h('dd', null, l.refute)));
    const C = x.causal;
    const trend = (t, i) => { const sb = STATUS[t.status]; const s = t.source || {};
      return h('section', { class: 'trend' },
        sb ? h('p', null, h('span', { class: 'badge ' + sb[1] }, sb[0])) : null,
        t.fact ? h('p', null, h('span', { class: 'badge' }, '사실'), ' ', t.fact) : h('p', { class: 'alt' }, t.note || '수치를 확인하지 못해 비워 두었습니다.'),
        t.apply ? h('p', null, h('span', { class: 'badge b-mode' }, '응용 가설'), ' ', t.apply) : null,
        h('details', { class: 'src', 'data-k': `${x.id}-t${i}` }, h('summary', null, '출처·범위·한계'),
          h('dl', { class: 'ldl' },
            h('dt', null, '자료'), h('dd', null, `${s.publisher || ''} 「${s.title || ''}」 `,
              s.url && allowedUrl(s.url) ? h('a', { href: s.url, target: '_blank', rel: 'noopener noreferrer' }, '공식 원문 열기(새 탭)') : (s.url || '')),
            h('dt', null, '대상 기간'), h('dd', null, s.period || '미확인'),
            h('dt', null, '발표일'), h('dd', null, s.published || '미확인'),
            h('dt', null, '확인일'), h('dd', null, t.checked || '미확인'),
            t.loc ? [h('dt', null, '본 위치'), h('dd', null, t.loc)] : null,
            t.limit ? [h('dt', null, '해석 한계'), h('dd', null, t.limit)] : null))); };
    const nd = x.pdf.filter(p => p.kind === 'direct').length;
    return [
      h('p', { class: 'crumb' }, h('button', { type: 'button', class: 'link', onclick: deepHome }, '← 6개 묶음 비교로'), ` · ${g.name}`),
      h('h2', { id: 'deepTitle', tabindex: '-1', class: 'dtitle' }, x.name),
      h('p', { class: 'scope-l' }, x.scope),
      h('p', { class: 'lead' }, x.character),
      h('p', { class: 'alt' }, '기존 세부 유형: ', x.subs.map((sid, i) => [i ? ' · ' : '', h('button', { type: 'button', class: 'link', onclick: () => openScope(sid) }, `${SUB.get(sid).name}(${sid}) 문제 보기`)])),
      h('h3', null, '먼저 확인할 질문'),
      h('ol', { class: 'fq' }, x.firstQs.map(q => h('li', null, q))),
      h('h3', null, '고유 관점 3개 — 조건이 맞을 때만 쓴다'),
      h('nav', { class: 'lens-idx', 'aria-label': '관점 3개 비교' }, h('ol', null, x.lenses.map(l => h('li', null, h('b', null, l.name), h('span', { class: 'alt' }, ' — ' + l.when))))),
      ...x.lenses.map(lens),
      h('h3', null, '시책 인과 — 원인에서 지표까지'),
      h('ol', { class: 'chain' },
        h('li', null, h('b', null, '원인(가설): '), C.cause),
        h('li', null, h('b', null, '시책: '), C.action),
        h('li', null, h('b', null, '효과: '), C.effect),
        h('li', null, h('b', null, '지표: '), C.metric),
        h('li', null, h('b', null, '실행 조건·부작용: '), C.conditions)),
      h('h3', null, '최근 동향 — 사실과 응용 가설을 나눠 읽기'),
      ...x.trends.map(trend),
      h('details', { class: 'src', 'data-k': `${x.id}-pdf` }, h('summary', null, `책 근거 ${x.pdf.length}개 (직접 예시 ${nd} · 방법 응용 등 ${x.pdf.length - nd})`),
        h('ul', { class: 'pdfl' }, x.pdf.map(p => h('li', null, h('span', { class: 'badge ' + (KIND[p.kind] || ['', ''])[1] }, (KIND[p.kind] || [p.kind])[0]), ` ${p.page} — ${p.note}`)))),
      h('h3', null, `연결된 원문 문제 ${x.problems.length}개`),
      h('p', { class: 'alt' }, '문제를 열면 원문과 조건만 보입니다. 첫 切り口 후보는 직접 고릅니다. 등장 수는 실제 출제 확률이 아닙니다.'),
      h('ul', { class: 'probs' }, x.problems.map(p => h('li', null,
        h('p', { class: 'pq' }, h('span', { class: 'badge b-mode' }, `행 ${p.row}`), ' ', row(p.row)),
        h('p', { class: 'bl' }, h('b', null, '적용 조건: '), p.cond),
        h('button', { type: 'button', class: 'pick', onclick: () => openDeepProblem(x.id, p.row) }, '이 문제 열기')))),
      x.cautions && x.cautions.length ? [h('h3', null, '주의'), h('ul', { class: 'pit' }, x.cautions.map(c => h('li', null, c)))] : null];
  }
  function renderRefs() {
    $('refs').replaceChildren(h('section', { class: 'pane refs-pane' },
      h('h2', null, '참고 자료 — GitHub 저장소 3개'),
      h('p', { class: 'alt' }, '식과 분해는 교과서(PDF 4~94쪽)를 기준으로 썼습니다. 아래 저장소에서는 도구를 고르는 조건, 잘못 쓰는 경우, 도구끼리 잇는 방식을 보여 주는 형식만 참고했습니다.'),
      (T.refs || []).map(r => h('article', { class: 'ref' },
        h('h3', null, r.repo),
        h('p', { class: 'bl' }, h('b', null, '참고한 구성: '), r.used),
        h('p', { class: 'bl' }, h('b', null, '면접 적용 한계: '), r.limits),
        h('p', { class: 'bl' }, h('a', { href: r.url, target: '_blank', rel: 'noopener noreferrer' }, r.url)),
        h('p', { class: 'alt' }, `별 ${r.stars}개(${r.starsDate} 조회 스냅샷 — 신뢰도 점수가 아님) · 검토일 ${r.starsDate}`),
        h('details', { class: 'steps' }, h('summary', null, '검토 커밋'), h('code', null, r.commit))))));
  }

  function measureTop() { document.documentElement.style.setProperty('--top-h', document.querySelector('.top').offsetHeight + 12 + 'px'); }
  window.addEventListener('resize', measureTop);
  window.addEventListener('popstate', () => {
    readHash();
    const hs = history.state || {};
    if (st.v === 'deep' && hs.prev) Object.assign(st, hs.prev);  // 심화에서 문제로 갈 때 비운 연습 필터를 되돌린다
    update(false);
    if (st.v === 'learn') landLearn(hs); else if (st.v === 'deep') landDeep(hs); else if (st.v === 'practice') showDetail();
  });
  readHash(); measureTop(); update(false);
  if (st.v === 'learn') landLearn(history.state); else if (st.v === 'deep') landDeep(history.state); else showDetail();
})();
</script>
</body>
</html>
